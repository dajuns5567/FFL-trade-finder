name: Compile V256 runtimes
on:
  push:
    branches: [v257-flatten-runtime]
permissions:
  contents: write
jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[compiled-v256]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v257-flatten-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/compile-v256-runtimes.cjs
      - name: Commit compiled runtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-finder-v256-compiled.js trade-runtime-v256-compiled.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate compiled V256 runtimes [compiled-v256]"
          git push origin HEAD:v257-flatten-runtime
