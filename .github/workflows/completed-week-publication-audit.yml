name: Completed week publication audit

on:
  pull_request:
    paths:
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/league-hub-weekly-publish.mjs'
      - 'netlify/functions/inquirer-*.mjs'
      - 'league-hub-v451.js'
      - 'league-hub-lazy-v454.js'
      - 'league-hub-fetch-cache-v452.js'
      - 'netlify/functions/site-v29.mjs'
      - '.github/workflows/completed-week-publication-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completed-week-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve latest completed Sleeper week
        id: target
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const LEAGUE='1316867686394769408',API='https://api.sleeper.app/v1';
          const get=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.json()};
          const state=await get(API+'/state/nfl'),league=await get(API+'/league/'+LEAGUE);
          const season=Number(league.season||state.season),upper=Math.min(17,Number(state.week)||1);
          let latest=0;
          for(let w=1;w<=upper;w++){
            const rows=await get(API+'/league/'+LEAGUE+'/matchups/'+w).catch(()=>[]);
            const complete=Array.isArray(rows)&&rows.length===32&&rows.every(m=>Number.isFinite(Number(m?.points))&&m?.players_points&&Object.keys(m.players_points).length);
            if(!complete)break;
            latest=w;
          }
          if(!latest)throw Error('No completed Sleeper week found');
          console.log('season='+season);
          console.log('week='+latest);
          NODE
      - name: Wait for Netlify deploy preview
        shell: bash
        env:
          PREVIEW: https://deploy-preview-${{ github.event.pull_request.number }}--mellow-salmiakki-f4268c.netlify.app
        run: |
          for i in {1..24}; do
            code=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' "$PREVIEW/" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Deploy preview did not become ready" >&2
          exit 1
      - name: Publish and verify completed week
        shell: bash
        env:
          PREVIEW: https://deploy-preview-${{ github.event.pull_request.number }}--mellow-salmiakki-f4268c.netlify.app
          TARGET_SEASON: ${{ steps.target.outputs.season }}
          TARGET_WEEK: ${{ steps.target.outputs.week }}
        run: |
          node <<'NODE'
          const base=process.env.PREVIEW,targetSeason=Number(process.env.TARGET_SEASON),targetWeek=Number(process.env.TARGET_WEEK);
          const get=async path=>{const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(r.status+' '+path+' '+JSON.stringify(j).slice(0,500));return j};
          let report=null;
          for(let i=0;i<4;i++){
            report=await get('/.netlify/functions/league-hub?weekly=1&publication_audit=1&n='+i);
            if(report?.available&&Number(report.season)===targetSeason&&Number(report.week)===targetWeek)break;
          }
          if(!report?.available)throw Error('No published weekly report');
          if(Number(report.season)!==targetSeason||Number(report.week)!==targetWeek)throw Error('Expected '+targetSeason+' Week '+targetWeek+', got '+report.season+' Week '+report.week);
          if(!Array.isArray(report.teams)||report.teams.length!==32)throw Error('Expected 32 team articles');
          if(report.teams.some(t=>!t?.inquirer_article?.headline))throw Error('A team article is missing its headline');
          if(!report?.league_overview?.headline||!Array.isArray(report?.league_overview?.sections)||report.league_overview.sections.length<3)throw Error('Weekly recap incomplete');
          if(targetWeek>=3){
            if(report?.editorial_generation?.engine!=='v31-forward')throw Error('Forward reporter engine regressed: '+JSON.stringify(report?.editorial_generation));
            if(report?.editorial_generation?.logic_floor!=='week2-approved-plus-forward-v31')throw Error('Approved reporter logic floor missing');
          }
          const serial=JSON.stringify(report);
          if(serial.length<100000)throw Error('Published edition suspiciously small');
          if(/(?:\.\.\.\s*truncated|\[truncated\])/i.test(serial))throw Error('Truncation marker detected');
          const recapText=JSON.stringify(report.league_overview);
          for(const label of ['Title favorite','Breakout player','Player of the Year','Fraud alert','Division flags']){
            if(!recapText.toLowerCase().includes(label.toLowerCase()))throw Error('Missing recurring Hot Takes category: '+label);
          }

          const awards=await get('/.netlify/functions/league-hub?weekly_awards=1&publication_audit=1');
          const rec=(awards.records||[]).find(r=>Number(r.season)===targetSeason&&Number(r.week)===targetWeek);
          if(!rec)throw Error('Current weekly award record missing');
          if(!rec?.players_of_week?.offense||!rec?.players_of_week?.defense)throw Error('Players of the Week incomplete');
          const types=new Set((rec.manager_awards||[]).map(x=>x.type));
          for(const type of ['hot-seat','cool-throne','highest-scorer','lowest-scorer'])if(!types.has(type))throw Error('Missing manager award '+type);

          const managers=await get('/.netlify/functions/league-hub?managers=1&publication_audit=1');
          if(Number(managers?.scoring_history?.through_season)!==targetSeason||Number(managers?.scoring_history?.through_week)<targetWeek)throw Error('Manager Spotlight has not advanced through Week '+targetWeek);
          console.log(JSON.stringify({
            ok:true,
            season:targetSeason,
            week:targetWeek,
            articles:report.teams.length,
            engine:report?.editorial_generation?.engine||'preloaded',
            offense:rec.players_of_week.offense,
            defense:rec.players_of_week.defense,
            hot_seat:(rec.manager_awards||[]).find(x=>x.type==='hot-seat')||null,
            cool_throne:(rec.manager_awards||[]).find(x=>x.type==='cool-throne')||null,
            manager_through_week:managers.scoring_history.through_week
          },null,2));
          NODE
