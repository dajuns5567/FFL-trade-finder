name: DraftSharks live diagnostic
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe DraftSharks live source shape
        run: node scripts/draftsharks-live-diagnostic.mjs
