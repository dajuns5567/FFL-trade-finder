name: Finder runtime smoke

on:
  pull_request:
    paths:
      - 'trade-finder-style-loader-v209.js'
      - 'trade-finder-style-loader-v197.js'
      - 'trade-finder-v150.js'
      - 'trade-finder-v256-compiled.js'
      - 'trade-presentation-v169.js'
      - 'trade-runtime-v187-loader.js'
      - 'trade-runtime-v130.js'
      - 'trade-runtime-v256-compiled.js'
      - 'trade-specific-player-v232.js'
      - 'scripts/acquire-specific-outgoing-diversity-v321-smoke.cjs'
      - 'scripts/acquire-specific-spectrum-diversity-v322-smoke.cjs'
      - 'scripts/specific-max-tier-routing-structure-v324-smoke.cjs'
      - 'scripts/specific-player-simple-package-v325-smoke.cjs'
      - 'scripts/blank-specific-runtime-v326-smoke.cjs'
      - 'scripts/specific-player-family-diversity-v327-smoke.cjs'
      - 'trade-select-all-v165.js'
      - 'trade-selected-positions-only-v262.js'
      - 'trade-finder-candidate-guard-v223.js'
      - 'trade-te-scoring-adjustment-v259.js'
      - 'modeled-player-values-v319.js'
      - 'scripts/compile-v256-runtimes.cjs'
      - 'scripts/patch-regular-family-v328.cjs'
      - 'scripts/regular-finder-family-diversity-v328-smoke.cjs'
      - 'scripts/finder-runtime-smoke-v254.cjs'
      - 'scripts/finder-runtime-compiled-smoke-v257.cjs'
      - 'scripts/select-all-blank-equivalence-v258.cjs'
      - 'scripts/select-all-persistence-v260.cjs'
      - 'scripts/selected-positions-only-v262-smoke.cjs'
      - 'scripts/finder-per-run-value-memo-v263-smoke.cjs'
      - 'scripts/te-scoring-adjustment-v259-smoke.cjs'
      - 'scripts/value-adjustment-monotonic-v311-smoke.cjs'
      - 'scripts/value-adjustment-v320-calibration-smoke.cjs'
      - 'scripts/v311-pipeline-identity-v319-smoke.cjs'
      - 'scripts/v319-values-v311-integration-smoke.cjs'
      - 'netlify/functions/site-v17.mjs'
      - 'netlify/functions/site-v29.mjs'
      - 'netlify/functions/value-history.mjs'
      - 'netlify/functions/value-history-observability.mjs'
      - 'netlify/functions/ppr-scoring.mjs'
      - 'scripts/import-sleeper-history.mjs'
      - 'scripts/resolve-active-netlify-site.mjs'
      - 'scripts/value-history-headless-refresh.mjs'
      - 'sleeper-history-client-v22.js'
      - 'tests/ppr-history.test.mjs'
      - '.github/workflows/import-sleeper-history.yml'
      - '.github/workflows/value-history-archive.yml'
      - '.github/workflows/value-history-headless-refresh.yml'
      - 'netlify/functions/ktc-adapter.mjs'
      - 'value-history-v276.js'
      - 'value-history-ui-defaults-v386.js'
      - 'scripts/value-history-data-hub-v331-smoke.mjs'
      - 'netlify.toml'
      - '.github/workflows/finder-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: V328 compiled Finder reproducibility
        run: |
          node scripts/compile-v256-runtimes.cjs
          node scripts/regular-finder-family-diversity-v328-smoke.cjs
          git checkout -- trade-finder-v256-compiled.js trade-runtime-v256-compiled.js
      - name: Frozen V256 loader behavior
        run: node scripts/finder-runtime-smoke-v254.cjs
      - name: Compiled V256 equivalence behavior
        run: node scripts/finder-runtime-compiled-smoke-v257.cjs
      - name: Select All exact blank-search equivalence
        run: node scripts/select-all-blank-equivalence-v258.cjs
      - name: Select All survives roster rerender
        run: node scripts/select-all-persistence-v260.cjs
      - name: Selected positions only isolation and eligibility
        run: node scripts/selected-positions-only-v262-smoke.cjs
      - name: Finder per-run canonical value memo freshness
        run: node scripts/finder-per-run-value-memo-v263-smoke.cjs
      - name: Live TE scoring adjustment freshness and isolation
        run: node scripts/te-scoring-adjustment-v259-smoke.cjs
      - name: Value Adjustment monotonicity and shared-pipeline isolation
        run: node scripts/value-adjustment-monotonic-v311-smoke.cjs
      - name: V320 premium-for-depth calibration
        run: node scripts/value-adjustment-v320-calibration-smoke.cjs
      - name: Exact V311 pipeline identity
        run: node scripts/v311-pipeline-identity-v319-smoke.cjs
      - name: V319 values through frozen V311 Finder and Evaluator
        run: node scripts/v319-values-v311-integration-smoke.cjs
      - name: Acquire Specific Player outgoing centerpiece diversity
        run: node scripts/acquire-specific-outgoing-diversity-v321-smoke.cjs
      - name: Acquire Specific Player full-spectrum diversity
        run: node scripts/acquire-specific-spectrum-diversity-v322-smoke.cjs
      - name: Specific-player Maximum Value Tier Up/Down routing and structure
        run: node scripts/specific-max-tier-routing-structure-v324-smoke.cjs
      - name: Specific-player simple-package coverage and outgoing asset frequency
        run: node scripts/specific-player-simple-package-v325-smoke.cjs
      - name: Full blank specific-player runtime
        run: node scripts/blank-specific-runtime-v326-smoke.cjs
      - name: Specific-player outgoing player-core family diversity
        run: node scripts/specific-player-family-diversity-v327-smoke.cjs
      - name: Regular Finder outgoing player-core family diversity
        run: node scripts/regular-finder-family-diversity-v328-smoke.cjs
      - name: Live KTC parser integrity
        run: |
          node --input-type=module <<'NODE'
          import { refreshKtc } from './netlify/functions/ktc-adapter.mjs';
          const r=await refreshKtc({timeoutMs:15000});
          console.log(JSON.stringify({valid:r.valid,players:r.players_extracted,rows:r.ranking_rows,parser:r.diagnostics?.parser,embedded:r.diagnostics?.embedded_players,first:r.rankings?.slice(0,5)},null,2));
          if(!r.valid||Number(r.players_extracted)<300)process.exit(17);
          NODE
      - name: Live FanRanked parser integrity
        run: |
          node --input-type=module <<'NODE'
          import { refreshFanRanked } from './netlify/functions/fanranked-adapter.mjs';
          const r=await refreshFanRanked();
          console.log(JSON.stringify({valid:r.valid,players:r.players_extracted,rows:r.ranking_rows,first:r.rankings?.slice(0,10),diagnostics:r.diagnostics},null,2));
          if(!r.valid||Number(r.players_extracted)<200||Number(r.ranking_rows)!==300)process.exit(18);
          NODE
      - name: Current-season scoring qualification
        run: node --test tests/ppr-history.test.mjs
      - name: Current-season scoring pipeline syntax
        run: |
          node --check scripts/import-sleeper-history.mjs
          node --check sleeper-history-client-v22.js
          node --check netlify/functions/ppr-scoring.mjs
      - name: Value History data hub syntax
        run: |
          node --check value-history-v276.js
          node --check value-history-ui-defaults-v386.js
          node --check netlify/functions/value-history.mjs
          node --check netlify/functions/value-history-observability.mjs
          node --check scripts/resolve-active-netlify-site.mjs
          node --check scripts/value-history-headless-refresh.mjs
      - name: Value History data hub behavior and isolation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='scripts/value-history-data-hub-v331-smoke.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old="assert(archiveWorkflow.includes('NETLIFY_SITE_ID: 0cc03543-09f9-4de9-9b52-6cbc4fbc4357'),'archive workflow must target the production Blob site explicitly');";
          const replacement="assert(archiveWorkflow.includes('scripts/resolve-active-netlify-site.mjs'),'archive workflow must resolve the active production Netlify site dynamically');\nassert(!archiveWorkflow.includes('NETLIFY_SITE_ID: 0cc03543-09f9-4de9-9b52-6cbc4fbc4357'),'archive workflow must not be pinned to the retired production site');";
          if(!s.includes(old))throw new Error('expected legacy archive-site assertion missing');
          fs.writeFileSync(p,s.replace(old,replacement));
          NODE
          node scripts/value-history-data-hub-v331-smoke.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ui=fs.readFileSync('value-history-ui-defaults-v386.js','utf8');
          const headless=fs.readFileSync('.github/workflows/value-history-headless-refresh.yml','utf8');
          const archive=fs.readFileSync('.github/workflows/value-history-archive.yml','utf8');
          const resolver=fs.readFileSync('scripts/resolve-active-netlify-site.mjs','utf8');
          const site=fs.readFileSync('netlify/functions/site-v29.mjs','utf8');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          for(const c of ['valueRisers','valueFallers','rankRisers','rankFallers'])assert(ui.includes(`[data-vh-market-pool=\"300\"][data-vh-category=\"${c}\"]`),`Top 300 market default missing for ${c}`);
          for(const c of ['rankRisers','rankFallers'])assert(ui.includes(`[data-vh-market-period=\"7D\"][data-vh-category=\"${c}\"]`),`7D rank default missing for ${c}`);
          assert(site.includes('/value-history-ui-defaults-v386.js?v=386'),'market-default/observability runtime is not loaded');
          assert(headless.includes('scripts/resolve-active-netlify-site.mjs'),'headless workflow is not dynamically resolving the latest production site');
          assert(archive.includes('scripts/resolve-active-netlify-site.mjs'),'archive workflow is not dynamically resolving the latest production site');
          assert(resolver.includes("context||'').toLowerCase()!=='production'"),'resolver must require production deploys');
          assert(resolver.includes("branch||'')!==branch"),'resolver must require the main deployment branch');
          assert(ui.includes('Last scheduled refresh'),'scheduled refresh visibility missing');
          console.log('V387 dynamic Netlify continuity + Market Dashboard defaults + headless observability smoke passed');
          NODE
