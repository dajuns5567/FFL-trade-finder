name: Finder runtime smoke

on:
  pull_request:
    paths:
      - 'trade-finder-style-loader-v209.js'
      - 'trade-finder-style-loader-v197.js'
      - 'trade-finder-v150.js'
      - 'trade-finder-v256-compiled.js'
      - 'trade-presentation-v169.js'
      - 'trade-runtime-v187-loader.js'
      - 'trade-runtime-v130.js'
      - 'trade-runtime-v256-compiled.js'
      - 'trade-specific-player-v232.js'
      - 'scripts/acquire-specific-outgoing-diversity-v321-smoke.cjs'
      - 'scripts/acquire-specific-spectrum-diversity-v322-smoke.cjs'
      - 'scripts/specific-max-tier-routing-structure-v324-smoke.cjs'
      - 'scripts/specific-player-simple-package-v325-smoke.cjs'
      - 'scripts/blank-specific-runtime-v326-smoke.cjs'
      - 'scripts/specific-player-family-diversity-v327-smoke.cjs'
      - 'trade-select-all-v165.js'
      - 'trade-selected-positions-only-v262.js'
      - 'trade-finder-candidate-guard-v223.js'
      - 'trade-te-scoring-adjustment-v259.js'
      - 'modeled-player-values-v319.js'
      - 'scripts/compile-v256-runtimes.cjs'
      - 'scripts/patch-regular-family-v328.cjs'
      - 'scripts/regular-finder-family-diversity-v328-smoke.cjs'
      - 'scripts/finder-runtime-smoke-v254.cjs'
      - 'scripts/finder-runtime-compiled-smoke-v257.cjs'
      - 'scripts/select-all-blank-equivalence-v258.cjs'
      - 'scripts/select-all-persistence-v260.cjs'
      - 'scripts/selected-positions-only-v262-smoke.cjs'
      - 'scripts/finder-per-run-value-memo-v263-smoke.cjs'
      - 'scripts/te-scoring-adjustment-v259-smoke.cjs'
      - 'scripts/value-adjustment-monotonic-v311-smoke.cjs'
      - 'scripts/value-adjustment-v320-calibration-smoke.cjs'
      - 'scripts/v311-pipeline-identity-v319-smoke.cjs'
      - 'scripts/v319-values-v311-integration-smoke.cjs'
      - 'netlify/functions/site-v17.mjs'
      - 'netlify/functions/site-v29.mjs'
      - 'netlify.toml'
      - '.github/workflows/finder-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: V328 compiled Finder reproducibility
        run: |
          node scripts/compile-v256-runtimes.cjs
          node scripts/regular-finder-family-diversity-v328-smoke.cjs
          git checkout -- trade-finder-v256-compiled.js trade-runtime-v256-compiled.js
      - name: Frozen V256 loader behavior
        run: node scripts/finder-runtime-smoke-v254.cjs
      - name: Compiled V256 equivalence behavior
        run: node scripts/finder-runtime-compiled-smoke-v257.cjs
      - name: Select All exact blank-search equivalence
        run: node scripts/select-all-blank-equivalence-v258.cjs
      - name: Select All survives roster rerender
        run: node scripts/select-all-persistence-v260.cjs
      - name: Selected positions only isolation and eligibility
        run: node scripts/selected-positions-only-v262-smoke.cjs
      - name: Finder per-run canonical value memo freshness
        run: node scripts/finder-per-run-value-memo-v263-smoke.cjs
      - name: Live TE scoring adjustment freshness and isolation
        run: node scripts/te-scoring-adjustment-v259-smoke.cjs
      - name: Value Adjustment monotonicity and shared-pipeline isolation
        run: node scripts/value-adjustment-monotonic-v311-smoke.cjs
      - name: V320 premium-for-depth calibration
        run: node scripts/value-adjustment-v320-calibration-smoke.cjs
      - name: Exact V311 pipeline identity
        run: node scripts/v311-pipeline-identity-v319-smoke.cjs
      - name: V319 values through frozen V311 Finder and Evaluator
        run: node scripts/v319-values-v311-integration-smoke.cjs
      - name: Acquire Specific Player outgoing centerpiece diversity
        run: node scripts/acquire-specific-outgoing-diversity-v321-smoke.cjs
      - name: Acquire Specific Player full-spectrum diversity
        run: node scripts/acquire-specific-spectrum-diversity-v322-smoke.cjs
      - name: Specific-player Maximum Value Tier Up/Down routing and structure
        run: node scripts/specific-max-tier-routing-structure-v324-smoke.cjs
      - name: Specific-player simple-package coverage and outgoing asset frequency
        run: node scripts/specific-player-simple-package-v325-smoke.cjs
      - name: Full blank specific-player runtime
        run: node scripts/blank-specific-runtime-v326-smoke.cjs
      - name: Specific-player outgoing player-core family diversity
        run: node scripts/specific-player-family-diversity-v327-smoke.cjs
      - name: Regular Finder outgoing player-core family diversity
        run: node scripts/regular-finder-family-diversity-v328-smoke.cjs
