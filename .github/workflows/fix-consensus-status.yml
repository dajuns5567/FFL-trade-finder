name: One-time consensus status display fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-consensus-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hard-coded source total
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '${consensusCount}/8'
          new = '${consensusCount}/9'
          if old not in s:
              raise SystemExit('Expected hard-coded /8 status string not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-consensus-status.yml
          git add index.html
          git commit -m "Fix consensus source total in update status"
          git push
