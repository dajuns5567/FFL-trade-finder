name: Archive Blob inventory regression tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/archive-blob-inventory.mjs'
      - 'scripts/archive-value-history.mjs'
      - 'tests/archive-blob-inventory.test.mjs'
      - '.github/workflows/fleeced-archive-blob-inventory-tests.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/archive-blob-inventory.test.mjs
      - run: node --check scripts/archive-value-history.mjs
