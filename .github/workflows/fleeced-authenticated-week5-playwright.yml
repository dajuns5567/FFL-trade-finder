name: Authenticated Fleeced project Playwright verification
on:
  push:
    branches:
      - fix/inquirer-week5-feature-package-guard
    paths:
      - 'scripts/inquirer-authenticated-browser-audit.mjs'
      - '.github/workflows/fleeced-authenticated-week5-playwright.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Authorized Fleeced replacement-site page or preview to audit'
        required: true
        type: string
        default: 'https://deploy-preview-402--transcendent-manatee-2f0123.netlify.app/?inquirer_preview=1&preview_week=5'
jobs:
  protected-preview-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PREVIEW_URL: ${{ inputs.target_url || 'https://deploy-preview-402--transcendent-manatee-2f0123.netlify.app/?inquirer_preview=1&preview_week=5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate target is the Fleeced replacement project
        run: |
          node -e "const u=new URL(process.env.PREVIEW_URL);if(u.protocol!=='https:'||!(/^(?:deploy-preview-[0-9]+--)?transcendent-manatee-2f0123\\.netlify\\.app$/).test(u.hostname))process.exit(1)"
      - name: Require authenticated browser state (failure is not a pass)
        env:
          PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.FLEECED_PLAYWRIGHT_STORAGE_STATE_B64 }}
        shell: bash
        run: |
          if [ -z "$PLAYWRIGHT_STORAGE_STATE_B64" ]; then
            echo "::error::Protected preview was NOT audited. Set the repository secret FLEECED_PLAYWRIGHT_STORAGE_STATE_B64 from an authorized Playwright storage state."
            exit 1
          fi
          umask 077
          printf '%s' "$PLAYWRIGHT_STORAGE_STATE_B64" | base64 --decode | gzip -dc > "$RUNNER_TEMP/netlify-playwright-state.json"
          node -e "const fs=require('fs');const p=process.argv[1];const s=JSON.parse(fs.readFileSync(p));if(!Array.isArray(s.cookies)||!Array.isArray(s.origins))process.exit(1)" "$RUNNER_TEMP/netlify-playwright-state.json"
      - name: Validate Playwright audit script syntax
        run: node --check scripts/inquirer-authenticated-browser-audit.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Audit protected preview with real browser
        env:
          PLAYWRIGHT_STATE_FILE: ${{ runner.temp }}/netlify-playwright-state.json
        run: node scripts/inquirer-authenticated-browser-audit.mjs
      - name: Explain authenticated browser failure without leaking session data
        if: failure()
        shell: bash
        run: |
          if [ -f playwright-audit-result.json ]; then
            node -e "const r=require('./playwright-audit-result.json'); const u=String(r.checks?.final_host||'unknown');const errors=(r.errors||[]).map(x=>String(x).slice(0,160));console.log('Authenticated browser audit: '+JSON.stringify({authenticated:!!r.authenticated,landing_page_verified:!!r.landing_page_verified,final_host:u,sso_redirect:!!r.checks?.sso_redirect,sso_wall:!!r.checks?.sso_wall,http_status:r.checks?.http_status??null,errors}));"
          else
            echo "Browser audit did not create a diagnostic report."
          fi
      - name: Upload diagnostic only (no cookies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-authenticated-playwright-audit
          path: playwright-audit-result.json
          if-no-files-found: ignore
      - name: Remove browser state
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/netlify-playwright-state.json"
