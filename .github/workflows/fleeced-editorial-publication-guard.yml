name: Fleeced Editorial Publication Guard
on:
  push:
    paths:
      - 'netlify/functions/inquirer-publication-guard.mjs'
      - 'netlify/functions/inquirer-format-contract.mjs'
      - 'netlify/functions/inquirer-narrative-architecture.mjs'
      - 'league-hub-v451.js'
      - 'tests/inquirer-narrative-architecture.test.mjs'
      - 'tests/week5-forward-editorial-repair.test.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/inquirer-publish-scheduled.mjs'
      - 'tests/inquirer-publication-guard.test.mjs'
      - 'tests/forward-week-prose-source.test.mjs'
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'scripts/approve-staged-inquirer.mjs'
      - '.github/workflows/fleeced-editorial-approve-reviewed-week.yml'
      - '.github/workflows/fleeced-editorial-publication-guard.yml'
  pull_request:
    paths:
      - 'netlify/functions/inquirer-publication-guard.mjs'
      - 'netlify/functions/inquirer-format-contract.mjs'
      - 'netlify/functions/inquirer-narrative-architecture.mjs'
      - 'league-hub-v451.js'
      - 'tests/inquirer-narrative-architecture.test.mjs'
      - 'tests/week5-forward-editorial-repair.test.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/inquirer-publish-scheduled.mjs'
      - 'tests/inquirer-publication-guard.test.mjs'
      - 'tests/forward-week-prose-source.test.mjs'
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'scripts/approve-staged-inquirer.mjs'
      - '.github/workflows/fleeced-editorial-approve-reviewed-week.yml'
      - '.github/workflows/fleeced-editorial-publication-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed editorial regression and approval tests
        run: node --test tests/inquirer-publication-guard.test.mjs tests/inquirer-narrative-architecture.test.mjs tests/forward-week-prose-source.test.mjs
      - name: Parse production entrypoints
        run: |
          node --check netlify/functions/inquirer-publication-guard.mjs
          node --check netlify/functions/inquirer-format-contract.mjs
          node --check netlify/functions/inquirer-narrative-architecture.mjs
          node --check netlify/functions/inquirer-publish-scheduled.mjs
          node --check netlify/functions/league-hub.mjs
          node --check scripts/approve-staged-inquirer.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
      - name: Verify gate cannot be bypassed by direct weekly entrypoint
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('netlify/functions/league-hub.mjs','utf8');const guard=s.indexOf('inspectEditionBeforePublication(result,previousBroadcast)'),gate=s.indexOf('if(!audit.ok||!deepQualityOk||!admission.approved)'),publish=s.indexOf('await s.setJSON(key,result)'),commit=s.indexOf('await ensureLockedEditionIndexed(s,result,key)');if(guard<0||gate<guard||publish<gate||commit<publish)process.exit(1);"
