name: Fleeced Editorial Publication Guard
on:
  push:
    paths:
      - 'netlify/functions/inquirer-publication-guard.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/inquirer-publish-scheduled.mjs'
      - 'tests/inquirer-publication-guard.test.mjs'
      - 'tests/forward-week-prose-source.test.mjs'
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'netlify/functions/inquirer-week4-editorial-brief.mjs'
      - 'netlify/functions/inquirer-week4-batch.mjs'
      - 'netlify/functions/inquirer-week4-staging.mjs'
      - 'netlify/functions/inquirer-week4-model-client.mjs'
      - 'netlify/functions/inquirer-week4-gateway.mjs'
      - 'netlify/functions/inquirer-week4-run-auth.mjs'
      - 'netlify/functions/inquirer-week4-generate-review.mjs'
      - 'netlify/functions/inquirer-week4-review-status.mjs'
      - 'netlify/functions/inquirer-week4-preflight.mjs'
      - 'netlify/functions/inquirer-recover-week-archive.mjs'
      - 'netlify/functions/inquirer-recovery-upload-ui.mjs'
      - 'tests/inquirer-week4-run-auth.test.mjs'
      - 'tests/inquirer-week4-preflight.test.mjs'
      - 'tests/inquirer-recover-week-archive.test.mjs'
      - 'tests/inquirer-week4-editorial-brief.test.mjs'
      - 'tests/inquirer-week4-batch.test.mjs'
      - 'tests/inquirer-week4-staging.test.mjs'
      - 'tests/inquirer-week4-model-client.test.mjs'
      - 'tests/inquirer-week4-gateway.test.mjs'
      - 'scripts/generate-week4-style-review.mjs'
      - 'tests/generate-week4-style-review.test.mjs'
      - 'scripts/audit-fleeced-week5-live-published.mjs'
      - 'tests/week5-live-audit-depth.test.mjs'
      - 'scripts/approve-staged-inquirer.mjs'
      - '.github/workflows/fleeced-editorial-approve-reviewed-week.yml'
      - '.github/workflows/fleeced-editorial-publication-guard.yml'
  pull_request:
    paths:
      - 'netlify/functions/inquirer-publication-guard.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/inquirer-publish-scheduled.mjs'
      - 'tests/inquirer-publication-guard.test.mjs'
      - 'tests/forward-week-prose-source.test.mjs'
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'netlify/functions/inquirer-week4-editorial-brief.mjs'
      - 'netlify/functions/inquirer-week4-batch.mjs'
      - 'netlify/functions/inquirer-week4-staging.mjs'
      - 'netlify/functions/inquirer-week4-model-client.mjs'
      - 'netlify/functions/inquirer-week4-gateway.mjs'
      - 'netlify/functions/inquirer-week4-run-auth.mjs'
      - 'netlify/functions/inquirer-week4-generate-review.mjs'
      - 'netlify/functions/inquirer-week4-review-status.mjs'
      - 'netlify/functions/inquirer-week4-preflight.mjs'
      - 'netlify/functions/inquirer-recover-week-archive.mjs'
      - 'netlify/functions/inquirer-recovery-upload-ui.mjs'
      - 'tests/inquirer-week4-run-auth.test.mjs'
      - 'tests/inquirer-week4-preflight.test.mjs'
      - 'tests/inquirer-recover-week-archive.test.mjs'
      - 'tests/inquirer-week4-editorial-brief.test.mjs'
      - 'tests/inquirer-week4-batch.test.mjs'
      - 'tests/inquirer-week4-staging.test.mjs'
      - 'tests/inquirer-week4-model-client.test.mjs'
      - 'tests/inquirer-week4-gateway.test.mjs'
      - 'scripts/generate-week4-style-review.mjs'
      - 'tests/generate-week4-style-review.test.mjs'
      - 'scripts/audit-fleeced-week5-live-published.mjs'
      - 'tests/week5-live-audit-depth.test.mjs'
      - 'scripts/approve-staged-inquirer.mjs'
      - '.github/workflows/fleeced-editorial-approve-reviewed-week.yml'
      - '.github/workflows/fleeced-editorial-publication-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed editorial regression and approval tests
        run: node --test tests/inquirer-publication-guard.test.mjs tests/forward-week-prose-source.test.mjs tests/inquirer-week4-editorial-brief.test.mjs tests/inquirer-week4-batch.test.mjs tests/inquirer-week4-staging.test.mjs tests/inquirer-week4-model-client.test.mjs tests/inquirer-week4-gateway.test.mjs tests/inquirer-week4-run-auth.test.mjs tests/inquirer-week4-preflight.test.mjs tests/inquirer-recover-week-archive.test.mjs tests/generate-week4-style-review.test.mjs tests/week5-live-audit-depth.test.mjs
      - name: Parse production entrypoints
        run: |
          node --check netlify/functions/inquirer-publication-guard.mjs
          node --check netlify/functions/inquirer-publish-scheduled.mjs
          node --check netlify/functions/league-hub.mjs
          node --check scripts/approve-staged-inquirer.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
          node --check netlify/functions/inquirer-week4-editorial-brief.mjs
          node --check netlify/functions/inquirer-week4-batch.mjs
          node --check netlify/functions/inquirer-week4-staging.mjs
          node --check netlify/functions/inquirer-week4-model-client.mjs
          node --check netlify/functions/inquirer-week4-gateway.mjs
          node --check netlify/functions/inquirer-week4-run-auth.mjs
          node --check netlify/functions/inquirer-week4-generate-review.mjs
          node --check netlify/functions/inquirer-week4-review-status.mjs
          node --check netlify/functions/inquirer-week4-preflight.mjs
          node --check netlify/functions/inquirer-recover-week-archive.mjs
          node --check netlify/functions/inquirer-recovery-upload-ui.mjs
          node --check scripts/generate-week4-style-review.mjs
          node --check scripts/audit-fleeced-week5-live-published.mjs
      - name: Verify gate cannot be bypassed by direct weekly entrypoint
        run: |
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('netlify/functions/league-hub.mjs','utf8');const guard=s.indexOf('inspectEditionBeforePublication(result)'),publish=s.indexOf('await s.setJSON(key,result);await syncReporterArchives');if(guard<0||publish<0||guard>publish)process.exit(1);"
