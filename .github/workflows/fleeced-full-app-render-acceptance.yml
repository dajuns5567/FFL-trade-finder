name: Full original FLEECED app read-only rendering acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fleeced-full-app-render-acceptance.yml'
      - 'scripts/check-isolated-full-app-render.mjs'
      - 'scripts/assess-week4-served-vs-preload.mjs'
      - 'scripts/verify-original-application-asset-graph.mjs'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: recovery
      - uses: actions/checkout@v4
        with:
          ref: af9067c751118cf33f688648cb78619d229f2214
          path: application
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: State fixed editorial recovery provenance
        run: echo 'Comparing against the exact feature-branch revision used by successful editorial restoration, af9067c751118cf33f688648cb78619d229f2214.'
      - name: Render actual original app without executing publishers or deploying
        run: node recovery/scripts/check-isolated-full-app-render.mjs application
      - name: Verify original app route and full rendered asset graph without requests or writes
        run: node recovery/scripts/verify-original-application-asset-graph.mjs application
      - name: Assess exact accepted Week 4 served prose against recovered preload
        run: node recovery/scripts/assess-week4-served-vs-preload.mjs application
