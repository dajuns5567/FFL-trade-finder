name: FLEECED existing-credential access probe (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - chore/inquirer-existing-credential-readonly-probe
    paths:
      - '.github/workflows/fleeced-new-site-existing-credential-probe.yml'

permissions:
  contents: read
concurrency:
  group: fleeced-credentials-readonly-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Blob SDK
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check whether existing repository credentials can read either site
        env:
          CANDIDATE_BLOBS: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          CANDIDATE_AUTH: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CANDIDATE_SANDBOX: ${{ secrets.NETLIFY_SANDBOX_DEPLOY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {getStore} from '@netlify/blobs';
          const sites=[
            ['published-source','8776d155-bc7b-4dcd-bafc-3d70d3d51800'],
            ['new-destination','3b9ae5bd-0d0f-4570-b2b7-89afae8a0e5f']
          ];
          const stores=['fleeced-league-hub','fleeced-consensus-lkg','fll-value-history-v2'];
          const credentials=[
            ['existing-blobs',process.env.CANDIDATE_BLOBS],
            ['existing-auth',process.env.CANDIDATE_AUTH],
            ['existing-sandbox',process.env.CANDIDATE_SANDBOX]
          ];
          let sourceReady=false,destinationReady=false;
          for(const [siteLabel,siteID] of sites){
            for(const [label,token] of credentials){
              if(!token){
                console.log(siteLabel+' / '+label+': not configured');
                continue;
              }
              let accessible=true;
              for(const name of stores){
                try{
                  const store=getStore({siteID,token,name,region:'us-east-2',consistency:'strong'});
                  const page=await store.list();
                  if(!Array.isArray(page?.blobs))accessible=false;
                }catch{
                  accessible=false;
                }
                if(!accessible)break;
              }
              console.log(siteLabel+' / '+label+': '+(accessible?'READ ACCESS':'NO READ ACCESS'));
              if(siteLabel==='published-source'&&accessible)sourceReady=true;
              if(siteLabel==='new-destination'&&accessible)destinationReady=true;
            }
          }
          console.log('Existing credentials cover both sites: '+(sourceReady&&destinationReady?'YES':'NO'));
          console.log('Probe is READ ONLY. No Blob data, keys, secret values, backups, deploys, or publisher settings were changed.');
          NODE
