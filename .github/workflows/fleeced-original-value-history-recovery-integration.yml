name: Original Value History read-path isolated recovery acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fleeced-original-value-history-recovery-integration.yml'
      - 'scripts/accept-original-value-history-recovery-integration.mjs'
permissions:
  contents: read
jobs:
  history-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: recovery
      - uses: actions/checkout@v4
        with:
          ref: af9067c751118cf33f688648cb78619d229f2214
          path: application
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated original and recovery runtime dependencies without scripts
        run: |
          cd application && npm install --ignore-scripts --no-audit --no-fund
          cd ../recovery && npm install --ignore-scripts --no-audit --no-fund
      - name: Run original Value History GET handler against 156 recovered historical snapshots
        working-directory: recovery
        env:
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          RECOVERY_DESTINATION_SITE_ID: '05a8ec65-a0a3-46f1-9f73-3da47dac662e'
        run: node scripts/accept-original-value-history-recovery-integration.mjs ../application
