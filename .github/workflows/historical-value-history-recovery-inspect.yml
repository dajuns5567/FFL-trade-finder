name: Historical Value History Recovery Inspect

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical preview exports
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            ['subtle-genie-6167c5','https://deploy-preview-385--subtle-genie-6167c5.netlify.app/.netlify/functions/value-history?archive_export=1'],
            ['precious-stroopwafel-196eae','https://deploy-preview-385--precious-stroopwafel-196eae.netlify.app/.netlify/functions/value-history?archive_export=1']
          ];
          const from=Date.parse('2026-09-19T22:01:38.323Z'),to=Date.parse('2026-09-21T04:00:00.000Z');
          for(const [name,url] of urls){
            try{
              const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
              console.log('SITE',name,'STATUS',r.status);
              const text=await r.text();
              if(!r.ok){console.log(text.slice(0,1200));continue}
              const j=JSON.parse(text);
              const rows=(j.snapshots||[]).filter(s=>{
                const ms=Date.parse(String(s?.t||''));
                return Number.isFinite(ms)&&ms>=from&&ms<to;
              }).map(s=>({
                t:String(s.t),
                source:String(s.source||'page-load'),
                fingerprint:String(s.fingerprint||''),
                count:Array.isArray(s.rows)?s.rows.length:0,
                pick_count:Array.isArray(s.picks)?s.picks.length:0,
                team_count:Array.isArray(s.teams)?s.teams.length:0,
                valuation_contract:s.valuation_contract||null
              }));
              console.log(JSON.stringify({site:name,source:j.source||null,total:j.snapshot_count||0,matching:rows.length,rows},null,2));
            }catch(e){console.log('SITE',name,'ERROR',String(e?.message||e))}
          }
          NODE
