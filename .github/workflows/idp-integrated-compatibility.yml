name: Integrated IDP identity, scoring and development
on:
  push:
    branches:
      - integration/idp-development-rookie-identity
  pull_request:
    paths:
      - 'valuation-idp-v21.js'
      - 'valuation-idp-v25-perf.js'
      - 'netlify/functions/consensus-composite-v3.mjs'
      - 'tests/idp-rookie-scoring-display.test.mjs'
      - 'tests/idp-dynasty-development.test.mjs'
      - '.github/workflows/idp-integrated-compatibility.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check valuation-idp-v21.js
          node --check valuation-idp-v25-perf.js
          node --check netlify/functions/consensus-composite-v3.mjs
          node --check ui-player-values-v139.js
      - name: IDP identity, population scoring, development and audited weighting
        run: node --test tests/idp-rookie-scoring-display.test.mjs tests/idp-dynasty-development.test.mjs tests/idp-20-45-35-calibration.test.mjs tests/idp-valuation-refresh-contract.test.mjs tests/consensus-composite-v3.test.mjs
