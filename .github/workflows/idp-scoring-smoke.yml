name: IDP scoring smoke
on:
  pull_request:
    paths:
      - 'valuation-idp-v21.js'
      - 'valuation-idp-v25-perf.js'
      - 'valuation-idp-v43.js'
      - 'nonblocking-consensus-v277.js'
      - 'modeled-player-values-v319.js'
      - 'netlify/functions/consensus-composite-v3.mjs'
      - 'tests/idp-valuation-refresh-contract.test.mjs'
      - 'ui-player-values-v139.js'
      - 'index.html'
      - 'tests/idp-rookie-scoring-display.test.mjs'
      - 'tests/consensus-composite-v3.test.mjs'
      - 'scripts/import-sleeper-history.mjs'
      - 'scripts/audit-qualified-player-games.mjs'
      - 'scripts/audit-idp-sleeper-identity.mjs'
      - 'scripts/qualified-player-game-audit-finality.mjs'
      - 'tests/sleeper-idp-audit-finality.test.mjs'
      - 'sleeper-history-client-v22.js'
      - 'netlify/functions/ppr-scoring.mjs'
      - 'netlify/functions/history-weights.mjs'
      - 'tests/ppr-history.test.mjs'
      - 'tests/idp-week1-weighting.test.mjs'
      - '.github/workflows/idp-scoring-smoke.yml'
  workflow_dispatch:
jobs:
  idp-scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PPG and game qualification
        run: node --test tests/ppr-history.test.mjs
      - name: Sleeper finalized-week scoring audit regression
        run: node --test tests/sleeper-idp-audit-finality.test.mjs
      - name: Read-only duplicate-ID and current scoring evidence audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin sleeper-data
          dir=/tmp/ffl-idp-source
          mkdir -p "$dir"
          git show FETCH_HEAD:data/sleeper/players.json > "$dir/players.json"
          git show FETCH_HEAD:data/sleeper/manifest.json > "$dir/manifest.json"
          season=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1])).currentSeason)" "$dir/manifest.json")
          mkdir -p "$dir/$season"
          git show "FETCH_HEAD:data/sleeper/$season/season-stats.json" > "$dir/$season/season-stats.json"
          node scripts/audit-idp-sleeper-identity.mjs "$dir"
      - name: Rehearse fresh Sleeper import without publishing or touching production
        shell: bash
        timeout-minutes: 8
        env:
          SLEEPER_DATA_DIR: /tmp/ffl-idp-fresh-preview
          SLEEPER_HISTORY_DEPTH: '4'
        run: |
          set -euo pipefail
          node scripts/import-sleeper-history.mjs > /tmp/idp-import-rehearsal.log
          node scripts/audit-qualified-player-games.mjs > /tmp/idp-fresh-qualification.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/idp-fresh-qualification.json'));
          const manifest=JSON.parse(fs.readFileSync(process.env.SLEEPER_DATA_DIR+'/manifest.json'));
          const n=Number(report.summary?.aggregateMismatches);
          console.log(JSON.stringify({
            report:'read-only fresh importer + strict IDP/offense audit',
            currentSeason:manifest.currentSeason,
            completedWeek:manifest.currentSeasonCompletedWeek,
            generatedAt:manifest.generatedAt,
            mismatches:n,
            idpMismatches:report.summary?.idp?.aggregateMismatches,
            offenseMismatches:report.summary?.offense?.aggregateMismatches
          },null,2));
          if(!Number.isFinite(n)||n!==0)throw Error('Fresh Sleeper qualification mismatches remain: '+n);
          NODE
          node scripts/audit-idp-sleeper-identity.mjs "$SLEEPER_DATA_DIR"
      - name: IDP Week 1 weighting invariants
        run: node --test tests/idp-week1-weighting.test.mjs
      - name: IDP rookies, scoring display and duplicate identity safety
        run: |
          node --test tests/idp-rookie-scoring-display.test.mjs
          node --test tests/consensus-composite-v3.test.mjs
      - name: IDP weekly refresh and rank-stability contract
        run: node --test tests/idp-valuation-refresh-contract.test.mjs
      - name: Scoring pipeline syntax
        run: |
          node --check scripts/import-sleeper-history.mjs
          node --check sleeper-history-client-v22.js
          node --check netlify/functions/ppr-scoring.mjs
          node --check valuation-idp-v21.js
          node --check valuation-idp-v25-perf.js
          node --check valuation-idp-v43.js
          node --check nonblocking-consensus-v277.js
          node --check modeled-player-values-v319.js
          node --check netlify/functions/consensus-composite-v3.mjs
