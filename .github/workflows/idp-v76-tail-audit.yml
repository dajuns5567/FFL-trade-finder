name: IDP V76 elite scoring source-matched counterfactual (draft)
on:
  pull_request:
    paths:
      - 'valuation-idp-v25-perf.js'
      - 'tests/idp-v76-tail.test.mjs'
      - 'scripts/audit-idp-v76-tail-full-league.mjs'
      - '.github/workflows/idp-v76-tail-audit.yml'
permissions:
  contents: read
jobs:
  v76-idp-only:
    if: github.event.pull_request.number == 477
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unmodified IDP blend/consensus constraints
        run: |
          node --check valuation-idp-v25-perf.js
          node --check scripts/audit-idp-v76-tail-full-league.mjs
          node --test tests/idp-v76-tail.test.mjs tests/idp-20-45-35-calibration.test.mjs
      - name: Install source adapter deps and read-only test browser
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Compare same seven verified dynasty inputs across full Sleeper league
        run: node scripts/audit-idp-v76-tail-full-league.mjs
