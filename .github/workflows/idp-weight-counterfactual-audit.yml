name: IDP weight counterfactual audit
on:
  pull_request:
    paths:
      - 'valuation-idp-v25-perf.js'
      - 'scripts/idp-weight-counterfactual-browser-audit.mjs'
      - '.github/workflows/idp-weight-counterfactual-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run settled preview counterfactual
        env:
          AUDIT_URL: https://inspiring-bombolone-be4489.netlify.app
          AUDIT_OUT: .tmp/idp-weight-counterfactual.json
        run: node scripts/idp-weight-counterfactual-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: idp-weight-counterfactual
          path: .tmp/idp-weight-counterfactual.json
          if-no-files-found: error
