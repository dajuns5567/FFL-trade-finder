name: Import Sleeper League History

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: Sleeper league ID
        required: false
        default: '1316867686394769408'
      history_depth:
        description: Number of linked league seasons to import for trade-history audit
        required: false
        default: '4'
  push:
    branches: [main]
    paths:
      - 'scripts/import-sleeper-history.mjs'
      - '.github/workflows/import-sleeper-history.yml'
      - 'netlify/functions/ppr-scoring.mjs'
      - 'netlify/functions/sleeper-imported-history.mjs'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import Sleeper history
        env:
          SLEEPER_LEAGUE_ID: ${{ inputs.league_id || '1316867686394769408' }}
          SLEEPER_HISTORY_DEPTH: ${{ inputs.history_depth || '4' }}
        run: node scripts/import-sleeper-history.mjs

      - name: Verify imported scoring snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s data/sleeper/manifest.json
          test -s data/sleeper/offense-history.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('data/sleeper/manifest.json','utf8'));
          const o=JSON.parse(fs.readFileSync('data/sleeper/offense-history.json','utf8'));
          if(!m.ok) throw new Error('manifest is not ok');
          if(!Array.isArray(m.productionSeasons) || m.productionSeasons.length < 3) throw new Error('missing production seasons');
          if(!o.ok || !o.complete || !o.weightPlan?.yearWeights || !o.stats) throw new Error('compact offense history is not complete');
          for(const year of m.productionSeasons){
            const p=`data/sleeper/${year}/season-stats.json`;
            if(!fs.existsSync(p)) throw new Error(`missing ${p}`);
            const rows=JSON.parse(fs.readFileSync(p,'utf8'));
            const values=Object.values(rows||{});
            const ppr=values.filter(r=>Number.isFinite(Number(r?.pts_ppr))).length;
            const games=values.filter(r=>Number(r?.gp)>0).length;
            if(values.length<100 || ppr<75 || games<75) throw new Error(`season ${year} failed validation rows=${values.length} ppr=${ppr} games=${games}`);
            const compact=Object.values(o.stats?.[year]||{});
            const compactPpr=compact.filter(r=>Number.isFinite(Number(r?.pts_ppr))).length;
            const compactGames=compact.filter(r=>Number(r?.gp)>0).length;
            if(compact.length<100 || compactPpr<75 || compactGames<75) throw new Error(`compact ${year} failed validation rows=${compact.length} ppr=${compactPpr} games=${compactGames}`);
          }
          console.log(JSON.stringify({ok:true,productionSeasons:m.productionSeasons,generatedAt:m.generatedAt,compactDiagnostics:m.compactDiagnostics},null,2));
          NODE

      - name: Publish snapshot to sleeper-data branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sleeper-data
          cp -R data/sleeper /tmp/sleeper-data/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin sleeper-data >/dev/null 2>&1; then
            git fetch origin sleeper-data:sleeper-data
            git switch sleeper-data
          else
            git switch --orphan sleeper-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf data/sleeper
          mkdir -p data
          cp -R /tmp/sleeper-data/sleeper data/
          git add data/sleeper
          if git diff --cached --quiet; then
            echo 'No Sleeper data changes to publish.'
            exit 0
          fi
          git commit -m 'Update Sleeper league data snapshot [skip ci]'
          git push origin sleeper-data
