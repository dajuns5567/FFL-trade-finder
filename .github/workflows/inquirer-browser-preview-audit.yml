name: Inquirer browser acceptance

on:
  pull_request:
    paths:
      - 'scripts/inquirer-browser-preview-audit.mjs'
      - 'scripts/inquirer-browser-local-audit.mjs'
      - '.github/workflows/inquirer-browser-preview-audit.yml'
      - 'league-hub-v451.js'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/league-hub-week4-fast.mjs'
      - 'netlify/functions/league-hub-week3-fast.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    name: Chromium - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [local, preview]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --with-deps
      - name: Exercise local site with locked Week 4 and Week 3 editions
        if: matrix.target == 'local'
        run: node scripts/inquirer-browser-local-audit.mjs
      - name: Exercise GitHub-reported Netlify deploy preview
        if: matrix.target == 'preview'
        env:
          INQUIRER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_CI_BROWSER_STORAGE_STATE: ${{ secrets.NETLIFY_CI_BROWSER_STORAGE_STATE }}
        run: node scripts/inquirer-browser-preview-audit.mjs
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inquirer-${{ matrix.target }}-browser-failure
          path: |
            /tmp/inquirer-browser-preview-failure.png
            /tmp/inquirer-local-browser-failure.png
          if-no-files-found: ignore
          retention-days: 7
