name: Inquirer current-site publisher identity safety
on:
  push:
    branches:
      - fix/inquirer-v101-current-site-publisher-identity
    paths:
      - 'netlify/functions/inquirer-publish-scheduled.mjs'
      - 'netlify/functions/inquirer-publish-background.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'tests/inquirer-current-site-publisher-identity.test.mjs'
      - '.github/workflows/inquirer-current-site-publisher-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-site-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing lockfile-free dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify active site is recognized without enabling writes
        run: node --test tests/inquirer-current-site-publisher-identity.test.mjs tests/inquirer-weekly-publication-consistency.test.mjs
