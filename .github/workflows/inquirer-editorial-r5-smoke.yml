name: Inquirer editorial revision 6

on:
  pull_request:
    paths:
      - 'netlify/functions/inquirer-*.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'scripts/inquirer-*.mjs'
      - 'scripts/one-time-generate-inquirer-week1.mjs'
      - 'scripts/one-time-generate-inquirer-week2.mjs'
      - 'docs/FLEECED-INQUIRER-VOICE-AND-REPORTERS.md'
      - 'docs/INQUIRER-V26.md'
      - '.github/workflows/inquirer-editorial-r5-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inquirer-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Syntax check active Inquirer
        run: |
          node --check netlify/functions/inquirer-reporting-v25.mjs
          node --check netlify/functions/inquirer-narrative-v17.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          node --check netlify/functions/league-hub.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
          node --check netlify/functions/inquirer-week2-editorial-r15.mjs
          node --check netlify/functions/inquirer-week2-editorial-r20.mjs
          node --check netlify/functions/inquirer-week2-editorial-r21.mjs
          node --check netlify/functions/inquirer-week2-editorial-r22.mjs
          node --check netlify/functions/inquirer-week2-editorial-r23.mjs
          node --check netlify/functions/inquirer-week2-editorial-r24.mjs
          node --check netlify/functions/inquirer-week2-editorial-r25.mjs
          node --check netlify/functions/inquirer-week2-editorial-r26.mjs
          node --check netlify/functions/inquirer-week2-editorial-r27.mjs
          node --check netlify/functions/inquirer-week2-editorial-r28.mjs
          node --check netlify/functions/inquirer-week2-editorial-r29.mjs
          node --check netlify/functions/inquirer-week2-editorial-r169.mjs
          node --check netlify/functions/player-signal-engine.mjs
          node --check netlify/functions/player-signals.mjs
          node --check scripts/player-signal-engine-smoke.mjs
          node --check netlify/functions/inquirer-publish-scheduled.mjs
          node --check scripts/one-time-generate-inquirer-week1.mjs
          node --check scripts/one-time-generate-inquirer-week2.mjs
          node --check scripts/inquirer-v25-audit.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
          node --check scripts/inquirer-forward-v31-smoke.mjs
          node --check scripts/inquirer-week2-voice-r15-smoke.mjs
          node --check scripts/inquirer-week2-r20-smoke.mjs
          node --check scripts/inquirer-week2-r21-smoke.mjs
          node --check scripts/inquirer-week2-r22-smoke.mjs
          node --check scripts/inquirer-week2-r23-smoke.mjs

      - name: Run source contract
        run: node scripts/inquirer-v25-audit.mjs
      - name: Fleeced player signal classifier contract
        run: node scripts/player-signal-engine-smoke.mjs
      - name: Week 2 reporter voice regression
        run: node scripts/inquirer-week2-voice-r15-smoke.mjs
      - name: Week 2 R20 scoring and recap regression
        run: node scripts/inquirer-week2-r20-smoke.mjs
      - name: Week 2 R21 all-team editorial regression
        run: node scripts/inquirer-week2-r21-smoke.mjs

      - name: Capture Week 2 R22 repetition, humor, and tag regression
        run: |
          set +e
          node scripts/inquirer-week2-r22-smoke.mjs > /tmp/week2-r22-smoke.log 2>&1
          code=$?
          echo "$code" > /tmp/week2-r22-smoke.exit
          cat /tmp/week2-r22-smoke.log
          exit 0
      - name: Upload Week 2 R22 smoke diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week2-r22-smoke-diagnostic
          path: |
            /tmp/week2-r22-smoke.log
            /tmp/week2-r22-smoke.exit
          retention-days: 2
      - name: Enforce Week 2 R22 repetition, humor, and tag regression
        run: |
          cat /tmp/week2-r22-smoke.log
          test "$(cat /tmp/week2-r22-smoke.exit)" = "0"

      - name: Week 2 R28 natural-language and semantic repetition regression
        run: node scripts/inquirer-week2-r23-smoke.mjs

      - name: Capture forward V31 season smoke
        run: |
          set +e
          node scripts/inquirer-forward-v31-smoke.mjs > /tmp/inquirer-forward-v31.log 2>&1
          code=$?
          echo "$code" > /tmp/inquirer-forward-v31.exit
          cat /tmp/inquirer-forward-v31.log
          exit 0

      - name: Upload forward V31 smoke diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: inquirer-forward-v31-smoke
          path: |
            /tmp/inquirer-forward-v31.log
            /tmp/inquirer-forward-v31.exit
          retention-days: 7

      - name: Enforce forward V31 season smoke
        run: |
          cat /tmp/inquirer-forward-v31.log
          test "$(cat /tmp/inquirer-forward-v31.exit)" = "0"

      - name: Generate Week 1 revision 6 candidate
        env:
          OUT: /tmp/week1-inquirer-r6.json
        run: |
          for attempt in 1 2 3; do
            echo "generation attempt $attempt"
            node scripts/one-time-generate-inquirer-week1.mjs && exit 0
            sleep 5
          done
          exit 1

      - name: Capture Week 1 generated audit diagnostic
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week1-inquirer-r6.json > /tmp/week1-generated-audit.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> /tmp/week1-generated-audit.log
          exit 0
      - name: Upload Week 1 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week1-generated-audit-diagnostic
          path: |
            /tmp/week1-inquirer-r6.json
            /tmp/week1-generated-audit.log
          retention-days: 2
      - name: Audit generated Week 1 prose
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week1-inquirer-r6.json

      - name: Materialize revised Week 2 edition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import rawWeek2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r29.mjs';
          const week2=applyWeek2EditorialR16(rawWeek2);
          if(!week2?.published_locked||Number(week2?.season)!==2026||Number(week2?.week)!==2||week2?.structure_revision!=='week2-r169')throw new Error('Active Week 2 editorial chain did not materialize from the locked preload');

          const expectedDivisions=['AFC EAST','AFC NORTH','AFC SOUTH','AFC WEST','NFC EAST','NFC NORTH','NFC SOUTH','NFC WEST'];
          const divisionTake=(week2?.league_overview?.hot_takes||[]).find(x=>/division board/i.test(String(x?.title||'')));
          assert.ok(divisionTake,'Active Week 2 output must retain the Division Board');
          const divisionBlocks=String(divisionTake.take||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
          assert.equal(divisionBlocks.length,8,'Active Division Board must render eight separate division paragraphs');
          const renderedDivisions=divisionBlocks.map(block=>String(block.match(/^((?:AFC|NFC)\s+(?:EAST|NORTH|SOUTH|WEST))\s+—\s+/i)?.[1]||'').toUpperCase());
          assert.deepEqual(renderedDivisions,expectedDivisions,'Active Division Board must render every division once in canonical order');
          for(const block of divisionBlocks){
            assert.match(block,/^(?:AFC|NFC)\s+(?:EAST|NORTH|SOUTH|WEST)\s+—\s+.+/i,'Each Division Board paragraph must begin with its division and analysis');
            assert.match(block,/\b\d+-\d+\b|\bunbeaten\b/i,'Each Division Board paragraph must retain standings/record context: '+block);
            assert.ok(block.trim().split(/\s+/).length>=20,'Each Division Board paragraph must retain substantive commentary: '+block);
          }

          fs.writeFileSync('/tmp/week2-inquirer-r6.json',JSON.stringify(week2,null,2)+'\n');

          // The shared legacy generated-audit still parses the retired colon/leader
          // Division Board syntax. Feed it a compatibility copy only after validating
          // the active rendered board above; every other generated-output gate runs
          // against unchanged R169 content.
          const auditWeek2=structuredClone(week2);
          const auditDivisionTake=(auditWeek2.league_overview.hot_takes||[]).find(x=>/division board/i.test(String(x?.title||'')));
          auditDivisionTake.take=divisionBlocks.map(block=>{
            const match=block.match(/^((?:AFC|NFC)\s+(?:EAST|NORTH|SOUTH|WEST))\s+—\s+(.+)$/i);
            const division=String(match?.[1]||'').toUpperCase(),body=String(match?.[2]||'');
            const record=String(body.match(/\b\d+-\d+\b/)?.[0]||(/\bunbeaten\b/i.test(body)?'2-0':'0-0'));
            return `${division}: Active board (${record}) — ${body}`;
          }).join('\n');
          fs.writeFileSync('/tmp/week2-inquirer-r6-audit.json',JSON.stringify(auditWeek2,null,2)+'\n');
          NODE

      - name: Capture revised Week 2 audit diagnostic
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r6-audit.json > /tmp/week2-generated-audit-r6.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> /tmp/week2-generated-audit-r6.log
          exit 0
      - name: Upload Week 2 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week2-generated-audit-diagnostic
          path: |
            /tmp/week2-inquirer-r6.json
            /tmp/week2-generated-audit-r6.log
          retention-days: 2
      - name: Audit revised Week 2 prose
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r6-audit.json
