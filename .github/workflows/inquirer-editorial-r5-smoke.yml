name: Inquirer editorial revision 6

on:
  pull_request:
    paths:
      - 'netlify/functions/inquirer-*.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/value-history.mjs'
      - 'netlify/functions/lib/inquirer-schedule-decision.mjs'
      - 'tests/inquirer-schedule-decision.test.mjs'
      - 'tests/inquirer-preview-context.test.mjs'
      - 'tests/inquirer-archive-lineage.test.mjs'
      - 'tests/inquirer-weekly-publication-consistency.test.mjs'
      - 'netlify/functions/lib/inquirer-preview-diagnostics.mjs'
      - 'league-hub-v451.js'
      - 'tests/inquirer-narrative-architecture.test.mjs'
      - 'tests/week5-forward-editorial-repair.test.mjs'
      - 'docs/INQUIRER-EDITORIAL-GENERATION-CONTRACT.md'
      - 'scripts/inquirer-*.mjs'
      - 'scripts/migrate-fleeced-blobs.mjs'
      - 'scripts/one-time-fleeced-archive-recovery.sh'
      - 'tests/fleeced-blob-migration.test.mjs'
      - 'scripts/one-time-generate-inquirer-week1.mjs'
      - 'scripts/one-time-generate-inquirer-week2.mjs'
      - 'docs/FLEECED-INQUIRER-VOICE-AND-REPORTERS.md'
      - 'docs/INQUIRER-V26.md'
      - '.github/workflows/inquirer-editorial-r5-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inquirer-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Syntax check active Inquirer
        run: |
          node --check netlify/functions/inquirer-reporting-v25.mjs
          node --check netlify/functions/inquirer-narrative-v17.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          node --check netlify/functions/league-hub.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
          node --check netlify/functions/inquirer-format-contract.mjs
          node --check netlify/functions/inquirer-narrative-architecture.mjs
          node --check netlify/functions/inquirer-publish-scheduled.mjs
          node --check scripts/one-time-generate-inquirer-week1.mjs
          node --check scripts/one-time-generate-inquirer-week2.mjs
          node --check scripts/inquirer-v25-audit.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
          node --check scripts/inquirer-forward-v31-smoke.mjs
          node --check scripts/migrate-fleeced-blobs.mjs

      - name: Validate one-time private recovery wrapper syntax
        run: bash -n scripts/one-time-fleeced-archive-recovery.sh
      - name: Offline migration safety regression tests
        run: node --test tests/fleeced-blob-migration.test.mjs

      - name: Run source contract
        run: node scripts/inquirer-v25-audit.mjs
      - name: Verify access-aware preview CI contract
        run: node --test tests/inquirer-private-preview-ci.test.mjs
      - name: Enforce Week 4 format regression contract
        run: node --test tests/inquirer-publication-guard.test.mjs tests/week5-forward-editorial-repair.test.mjs tests/inquirer-narrative-architecture.test.mjs tests/inquirer-schedule-decision.test.mjs tests/inquirer-preview-context.test.mjs tests/inquirer-archive-lineage.test.mjs tests/inquirer-weekly-publication-consistency.test.mjs

      - name: Capture forward V31 season smoke
        run: |
          set +e
          node scripts/inquirer-forward-v31-smoke.mjs > /tmp/inquirer-forward-v31.log 2>&1
          code=$?
          echo "$code" > /tmp/inquirer-forward-v31.exit
          cat /tmp/inquirer-forward-v31.log
          exit 0

      - name: Upload forward V31 smoke diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: inquirer-forward-v31-smoke
          path: |
            /tmp/inquirer-forward-v31.log
            /tmp/inquirer-forward-v31.exit
          retention-days: 7

      - name: Enforce forward V31 season smoke
        run: |
          cat /tmp/inquirer-forward-v31.log
          test "$(cat /tmp/inquirer-forward-v31.exit)" = "0"

      - name: Generate Week 1 revision 6 candidate
        env:
          OUT: /tmp/week1-inquirer-r6.json
        run: |
          for attempt in 1 2 3; do
            echo "generation attempt $attempt"
            node scripts/one-time-generate-inquirer-week1.mjs && exit 0
            sleep 5
          done
          exit 1

      - name: Capture Week 1 generated audit diagnostic
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week1-inquirer-r6.json > /tmp/week1-generated-audit.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> /tmp/week1-generated-audit.log
          exit 0
      - name: Upload Week 1 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week1-generated-audit-diagnostic
          path: |
            /tmp/week1-inquirer-r6.json
            /tmp/week1-generated-audit.log
          retention-days: 2
      - name: Audit generated Week 1 prose
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week1-inquirer-r6.json

      - name: Materialize frozen Week 2 edition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import week2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          if(!week2?.published_locked||Number(week2?.season)!==2026||Number(week2?.week)!==2)throw new Error('Week 2 preload is not the locked 2026 Week 2 edition');
          fs.writeFileSync('/tmp/week2-inquirer-r6.json',JSON.stringify(week2,null,2)+'\n');
          NODE

      - name: Capture frozen Week 2 audit diagnostic
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r6.json > /tmp/week2-generated-audit-r6.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> /tmp/week2-generated-audit-r6.log
          exit 0
      - name: Upload Week 2 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week2-generated-audit-diagnostic
          path: |
            /tmp/week2-inquirer-r6.json
            /tmp/week2-generated-audit-r6.log
          retention-days: 2
      - name: Audit frozen Week 2 prose
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r6.json

  seed-private-preview:
    needs: inquirer-r6
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enqueue draft through Netlify background function after preview deploy
        id: enqueue
        env:
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SITE: ${{ vars.INQUIRER_PREVIEW_SITE || 'transcendent-manatee-2f0123.netlify.app' }}
        run: |
          set -eu
          url="https://deploy-preview-${PREVIEW_NUMBER}--${PREVIEW_SITE}/.netlify/functions/inquirer-preview-background?start=1"
          for attempt in $(seq 1 36); do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 "$url" || true)
            if [ "$status" = '202' ]; then
              echo "Private Inquirer background generation queued (HTTP 202)."
              echo 'result=queued' >> "$GITHUB_OUTPUT"
              echo '### Private preview: background draft queued' >> "$GITHUB_STEP_SUMMARY"
              echo 'The protected Deploy Preview accepted the generation request. The edition must still pass its own publication and editorial gates.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$status" = '401' ] || [ "$status" = '403' ]; then
              echo 'result=requires-authenticated-reviewer' >> "$GITHUB_OUTPUT"
              echo '::warning title=Protected Netlify preview::Automatic draft enqueue needs a signed-in Netlify reviewer (HTTP 401/403). This is an access-control outcome, not an editorial pass or failure.'
              echo '### Private preview: authenticated reviewer required' >> "$GITHUB_STEP_SUMMARY"
              echo 'Netlify team-login protection rejected the unauthenticated CI request (HTTP 401/403). The private draft was **not automatically generated** by this job. An authorized reviewer must open the preview and start the background diagnostic; do not mistake this neutral CI result for a completed editorial audit.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Preview background enqueue attempt ${attempt}: HTTP ${status:-unavailable}"
            sleep 10
          done
          echo 'Preview generation was not enqueued; keep the edition unpublished.' >&2
          exit 1
      - name: Protected preview requires signed-in reviewer
        if: steps.enqueue.outputs.result == 'requires-authenticated-reviewer'
        run: echo 'Netlify visitor access stays private. Use the authenticated preview diagnostic to generate and review this draft; publication remains gated separately.'

