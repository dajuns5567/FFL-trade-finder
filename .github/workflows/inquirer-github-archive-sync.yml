name: Fleeced Inquirer published archive backup (GitHub only)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      recover_retired_public_archive:
        description: 'Recover only canonical old-site publicly locked editions from Weeks 3–10'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: inquirer-github-published-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout application verification code
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Checkout append-only Inquirer archive branch
        uses: actions/checkout@v4
        with:
          ref: inquirer-archive
          path: archive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover original public editions from retired site (never regenerate)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_retired_public_archive }}
        run: node source/scripts/recover-inquirer-public-archive.mjs archive/inquirer-archive
      - name: Copy only verified, indexed and awarded newspapers
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.recover_retired_public_archive }}
        env:
          INQUIRER_PUBLICATION_ORIGIN: ${{ vars.INQUIRER_PUBLICATION_ORIGIN }}
        run: node source/scripts/sync-inquirer-github-archive.mjs archive/inquirer-archive
      - name: Commit new immutable archival files only
        working-directory: archive
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- inquirer-archive)" ]]; then
            echo "No newly published verified newspaper editions"
            exit 0
          fi
          git config user.name "ffl-inquirer-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- inquirer-archive
          # Never accept deletions, modifications to historical editions, or
          # any staged path outside the dedicated newspaper archive.
          if git diff --cached --name-only | grep -Ev '^inquirer-archive/'; then
            echo "Unexpected staged path outside the newspaper archive" >&2
            exit 1
          fi
          if git diff --cached --name-status | grep -Ev '^(A[[:space:]]+inquirer-archive/[0-9]{4}/week-[0-9]{2}\.json|M[[:space:]]+inquirer-archive/manifest\.json)$'; then
            echo "Archived editions may only be added; manifest may be updated" >&2
            exit 1
          fi
          git commit -m "archive(inquirer): preserve newly verified published newspapers"
          git push origin HEAD:inquirer-archive
