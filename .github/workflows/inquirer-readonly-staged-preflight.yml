name: Verify Production Inquirer Staged Copy (Read Only)
on:
  push:
    branches:
      - chore/inquirer-readonly-staged-review-20261104
    paths:
      - scripts/audit-staged-inquirer-readonly.mjs
      - .github/workflows/inquirer-readonly-staged-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staged-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact production staging digest and editorial guards without publishing
        env:
          FLEECED_NEW_TEAM_SITE_ID: '8776d155-bc7b-4dcd-bafc-3d70d3d51800'
          NETLIFY_SANDBOX_DEPLOY_TOKEN: ${{ secrets.NETLIFY_SANDBOX_DEPLOY_TOKEN }}
        run: node scripts/audit-staged-inquirer-readonly.mjs
