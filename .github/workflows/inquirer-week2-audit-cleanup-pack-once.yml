name: One-time pack Week 2 audit cleanup

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/inquirer-week2-audit-cleanup-pack-once.yml'

permissions:
  contents: write

jobs:
  pack-week2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inquirer-editorial-depth-r5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Generate audited Week 2 candidate
        env:
          OUT: /tmp/week2-inquirer-audit-cleanup.json
        run: |
          for attempt in 1 2 3; do
            node scripts/one-time-generate-inquirer-week2.mjs && exit 0
            sleep 5
          done
          exit 1
      - name: Audit Week 2 candidate
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-audit-cleanup.json
      - name: Pack audited Week 2 preload
        run: node scripts/pack-inquirer-preload.mjs /tmp/week2-inquirer-audit-cleanup.json netlify/functions/inquirer-week2-2026-preload.mjs
      - name: Commit only audited Week 2 preload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week2-2026-preload.mjs
          git diff --cached --quiet && { echo "No preload change produced"; exit 1; }
          git commit -m "Publish audited Week 2 commentary cleanup"
          git push origin HEAD:inquirer-editorial-depth-r5
