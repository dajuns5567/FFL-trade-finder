name: Final Week 2 cross-reporter pack

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/inquirer-week2-crossreporter-pack.yml'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize surgical Week 2 patch
        env:
          OUT: /tmp/week2-cross-reporter-polished.json
        run: node scripts/one-time-polish-inquirer-week2-cross-reporter.mjs

      - name: Audit patched Week 2 prose
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-cross-reporter-polished.json

      - name: Deep-audit patched Week 2 prose
        run: |
          node scripts/inquirer-week2-deep-editorial-audit.mjs /tmp/week2-cross-reporter-polished.json \
            --out /tmp/week2-cross-reporter-deep.md \
            --json /tmp/week2-cross-reporter-deep.json \
            --strict

      - name: Pack exact patched Week 2 preload
        run: node scripts/pack-inquirer-preload.mjs /tmp/week2-cross-reporter-polished.json netlify/functions/inquirer-week2-2026-preload.mjs

      - name: Commit patched Week 2 preload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week2-2026-preload.mjs
          git diff --cached --quiet && { echo "No preload change produced"; exit 1; }
          git commit -m "Refresh Week 2 cross-reporter prose"
          git push origin HEAD:inquirer-editorial-depth-r5
