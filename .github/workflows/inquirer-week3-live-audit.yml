name: Inquirer Week 3 live audit

on:
  pull_request:
    paths:
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'netlify/functions/inquirer-forward-*.mjs'
      - 'scripts/inquirer-week3-live-audit.mjs'
      - '.github/workflows/inquirer-week3-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  week3-live-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check live audit
        run: |
          node --check scripts/inquirer-week3-live-audit.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Regenerate and audit stored live Week 3 snapshot
        run: node scripts/inquirer-week3-live-audit.mjs
      - name: Upload Week 3 candidate and audit
        uses: actions/upload-artifact@v4
        with:
          name: inquirer-week3-live-audit
          path: |
            /tmp/inquirer-week3-live-candidate.json
            /tmp/inquirer-week3-live-audit.json
          retention-days: 7
