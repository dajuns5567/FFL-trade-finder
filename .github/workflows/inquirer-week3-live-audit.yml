name: Inquirer Week 3 live audit

on:
  pull_request:
    paths:
      - 'netlify/functions/inquirer-editorial-v31.mjs'
      - 'netlify/functions/inquirer-forward-*.mjs'
      - 'scripts/inquirer-week3-direct-audit.mjs'
      - '.github/workflows/inquirer-week3-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  week3-live-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check live audit
        run: |
          node --check scripts/inquirer-week3-direct-audit.mjs
          node --check netlify/functions/inquirer-editorial-v31.mjs
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Generate and audit direct Sleeper Week 3 candidate
        run: node scripts/inquirer-week3-direct-audit.mjs
      - name: Upload Week 3 candidate and audit
        uses: actions/upload-artifact@v4
        with:
          name: inquirer-week3-live-audit
          path: |
            /tmp/inquirer-week3-direct-candidate.json
            /tmp/inquirer-week3-direct-audit.json
          retention-days: 7
      - name: Repair Week 3 preload from accepted candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const raw=fs.readFileSync('/tmp/inquirer-week3-direct-candidate.json');
          const encoded=zlib.gzipSync(raw,{level:9}).toString('base64');
          const out="import {gunzipSync} from 'node:zlib';\n\n// Exact accepted Week 3 candidate from the successful real-data Inquirer audit.\n// Generated directly from the accepted CI candidate; do not hand-truncate.\nconst encoded='"+encoded+"';\nlet memo=null;\nexport default function week3Preload2026(){\n  if(memo)return memo;\n  memo=JSON.parse(gunzipSync(Buffer.from(encoded,'base64')).toString('utf8'));\n  return memo;\n}\n";
          fs.writeFileSync('netlify/functions/inquirer-week3-2026-preload.mjs',out);
          console.log('preload bytes',Buffer.byteLength(out),'candidate bytes',raw.length);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week3-2026-preload.mjs
          if git diff --cached --quiet; then
            echo "Week 3 preload already matches accepted candidate"
          else
            git commit -m "Repair full Week 3 Inquirer preload"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
