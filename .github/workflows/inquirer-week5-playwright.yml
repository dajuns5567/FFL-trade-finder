name: Fleeced private Week 5 browser audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/inquirer-week5-playwright.yml'
      - 'scripts/inquirer-week5-playwright-audit.mjs'
      - 'netlify/functions/inquirer-preview-diagnostic.mjs'
      - 'netlify/functions/lib/inquirer-preview-diagnostics.mjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate missing SSO authentication without claiming success
        id: auth
        env:
          HAS_BROWSER_STATE: ${{ secrets.INQUIRER_PLAYWRIGHT_STORAGE_STATE != '' }}
        run: |
          if [ "$HAS_BROWSER_STATE" != "true" ]; then
            echo 'SSO browser state unavailable: live browser verification is NOT complete.' >> "$GITHUB_STEP_SUMMARY"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Playwright only when authenticated
        if: steps.auth.outputs.available == 'true'
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect protected Week 5 preview
        if: steps.auth.outputs.available == 'true'
        env:
          INQUIRER_PLAYWRIGHT_STORAGE_STATE: ${{ secrets.INQUIRER_PLAYWRIGHT_STORAGE_STATE }}
        run: node scripts/inquirer-week5-playwright-audit.mjs
      - name: Save private browser audit and screenshot
        if: always() && steps.auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fleeced-week5-private-browser-audit
          path: |
            /tmp/inquirer-week5-browser-audit.json
            /tmp/inquirer-week5-browser.png
          if-no-files-found: warn
          retention-days: 2
