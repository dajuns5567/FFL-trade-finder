name: Fleeced private Week 5 browser audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/inquirer-week5-playwright.yml'
      - 'scripts/inquirer-authenticated-browser-audit.mjs'
      - 'scripts/inquirer-reader-browser-regression.mjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://deploy-preview-402--transcendent-manatee-2f0123.netlify.app/?inquirer_preview=1&preview_week=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require valid private audit credentials (do not report a skipped audit as passed)
        env:
          STATE_B64: ${{ secrets.FLEECED_PLAYWRIGHT_STORAGE_STATE_B64 }}
        shell: bash
        run: |
          if [ -z "$STATE_B64" ]; then
            echo "::error::Private browser audit BLOCKED: authenticated SSO state unavailable."
            exit 1
          fi
          umask 077
          printf '%s' "$STATE_B64" | base64 --decode | gzip -dc > "$RUNNER_TEMP/netlify-playwright-state.json"
          node -e "const s=require(process.argv[1]);if(!Array.isArray(s.cookies)||!Array.isArray(s.origins))process.exit(1)" "$RUNNER_TEMP/netlify-playwright-state.json"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Inspect actual protected Week 5 newspaper
        env:
          PLAYWRIGHT_STATE_FILE: ${{ runner.temp }}/netlify-playwright-state.json
        run: node scripts/inquirer-authenticated-browser-audit.mjs
      - name: Upload truthful browser diagnostic (never credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5-protected-browser-audit
          path: playwright-audit-result.json
          if-no-files-found: ignore
      - name: Destroy ephemeral browser authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/netlify-playwright-state.json"

  reader-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify actual reader in Chromium using synthetic Week 5 fixtures
        run: node scripts/inquirer-reader-browser-regression.mjs
