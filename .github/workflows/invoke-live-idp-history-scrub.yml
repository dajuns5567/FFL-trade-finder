name: Invoke live IDP history scrub

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke exact live-store scrub
        shell: bash
        run: |
          URL='https://deploy-preview-387--inspiring-bombolone-be4489.netlify.app/.netlify/functions/idp-history-live-scrub?confirm=delete-idp-before-20260921-2345-et'
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i"
            CODE=$(curl -L -sS -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' -o /tmp/live-scrub.json -w '%{http_code}' "$URL" || true)
            echo "HTTP $CODE"
            cat /tmp/live-scrub.json || true
            echo
            if [ "$CODE" = "200" ]; then
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const r=JSON.parse(fs.readFileSync('/tmp/live-scrub.json','utf8'));
              if(r?.ok!==true)throw new Error('Scrub endpoint did not return ok');
              if(Number(r?.remainingPreCutoffIdpRows)!==0)throw new Error('Pre-cutoff IDP rows remain');
              if(Number(r?.offenseRowsBefore)!==Number(r?.offenseRowsAfter))throw new Error('Offensive rows changed');
              console.log('Verified live scrub',JSON.stringify(r));
              NODE
              exit 0
            fi
            sleep 10
          done
          echo "Unable to invoke preview scrub endpoint" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-idp-history-scrub-response
          path: /tmp/live-scrub.json
          if-no-files-found: warn
