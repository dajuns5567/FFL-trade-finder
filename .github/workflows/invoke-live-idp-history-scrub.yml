name: Invoke production IDP history scrub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production maintenance endpoint and scrub live buffer
        shell: bash
        run: |
          set -euo pipefail
          URL='https://inspiring-bombolone-be4489.netlify.app/.netlify/functions/idp-history-live-scrub?confirm=delete-idp-before-20260921-2345-et'
          rm -f /tmp/live-scrub.json
          for i in $(seq 1 120); do
            CODE=$(curl -L -sS -o /tmp/live-scrub.json -w '%{http_code}' "$URL" || true)
            echo "Attempt $i HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/live-scrub.json
              node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/live-scrub.json','utf8'));if(r?.ok!==true)throw new Error('scrub endpoint did not return ok');if(Number(r?.remainingPreCutoffIdpRows)!==0)throw new Error('pre-cutoff IDP rows remain');if(Number(r?.offenseRowsBefore)!==Number(r?.offenseRowsAfter))throw new Error('offensive rows changed');if(Number(r?.verifiedOffenseRows)!==Number(r?.offenseRowsBefore))throw new Error('offensive verification mismatch');console.log('Verified production live scrub',JSON.stringify(r));"
              exit 0
            fi
            sleep 10
          done
          echo "Production maintenance endpoint did not become available" >&2
          cat /tmp/live-scrub.json || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-live-idp-history-scrub-response
          path: /tmp/live-scrub.json
          if-no-files-found: warn
