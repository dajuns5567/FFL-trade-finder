name: Invoke atomic preview IDP history scrub

on:
  push:
    branches:
      - maintenance/idp-history-reset-20260921-2345-et
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke exact atomic deploy scrub
        shell: bash
        run: |
          set -euo pipefail
          URL='https://6ab1ff8e53af580008a0afb4--inspiring-bombolone-be4489.netlify.app/.netlify/functions/idp-history-live-scrub?confirm=delete-idp-before-20260921-2345-et'
          CODE=$(curl -L -sS -o /tmp/live-scrub.json -w '%{http_code}' "$URL" || true)
          echo "HTTP $CODE"
          cat /tmp/live-scrub.json || true
          echo
          if [ "$CODE" != "200" ]; then exit 1; fi
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/live-scrub.json','utf8'));if(r?.ok!==true)throw new Error('scrub endpoint did not return ok');if(Number(r?.remainingPreCutoffIdpRows)!==0)throw new Error('pre-cutoff IDP rows remain');if(Number(r?.offenseRowsBefore)!==Number(r?.offenseRowsAfter))throw new Error('offensive rows changed');if(Number(r?.verifiedOffenseRows)!==Number(r?.offenseRowsBefore))throw new Error('offensive verification mismatch');console.log('Verified atomic live scrub',JSON.stringify(r));"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-live-idp-history-scrub-response
          path: /tmp/live-scrub.json
          if-no-files-found: warn
