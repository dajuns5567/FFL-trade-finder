name: All-Time Highs independent capture CI
on:
  pull_request:
    paths:
      - '.github/workflows/league-all-time-highs-independent-capture.yml'
      - '.github/workflows/league-all-time-highs-independent-ci.yml'
      - 'scripts/archive-league-all-time-highs.mjs'
      - 'netlify/functions/league-hub.mjs'
      - 'scripts/approved-all-time-highs-status-overlay.mjs'
      - 'scripts/verify-durable-all-time-highs-readback.mjs'
      - 'tests/league-all-time-highs-independent-capture.test.mjs'
      - 'scripts/award-highs-verified-export.js'
      - 'scripts/validate-all-time-highs-blob-export.mjs'
      - 'tests/verified-all-time-highs-blob-export.test.mjs'
      - 'netlify/functions/lib/league-all-time-highs.mjs'
      - 'scripts/approved-highs-bootstrap-reader-overlay.mjs'
      - 'tests/league-all-time-highs-bootstrap-reader.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  all-time-highs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse independent writer workflow as YAML and verify trigger safety
        run: |
          ruby -ryaml -e 'w = YAML.safe_load_file(".github/workflows/league-all-time-highs-independent-capture.yml"); triggers = w["on"] || w[true]; abort "unexpected triggers" unless triggers.keys.sort == ["schedule", "workflow_dispatch"]; j = w.fetch("jobs").fetch("capture-verified-highs"); abort "writer guard missing" unless j.fetch("if").include?("refs/heads/main"); abort "readback step missing" unless j.fetch("steps").any? { |s| s["name"] == "Acceptance: independently read back durable GitHub records" }; puts "AWARDS WORKFLOW YAML PASS"'
      - name: Validate scheduled capture/readback files
        run: |
          node --check scripts/archive-league-all-time-highs.mjs
          node --check scripts/verify-durable-all-time-highs-readback.mjs
      - name: Verify source-valid persistent highs, archive timestamps and safe branch gating
        run: |
          node --test tests/league-all-time-highs-independent-capture.test.mjs
          node --test tests/league-all-time-highs-durable.test.mjs
          node --test tests/verified-all-time-highs-blob-export.test.mjs
          node --test tests/league-all-time-highs-bootstrap-reader.test.mjs
