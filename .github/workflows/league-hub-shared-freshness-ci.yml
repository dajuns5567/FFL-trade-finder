name: League Hub live shared-data freshness
on:
  pull_request:
    paths:
      - 'league-hub-v451.js'
      - 'netlify/functions/site-v29.mjs'
      - 'tests/league-hub-shared-freshness.test.mjs'
      - '.github/workflows/league-hub-shared-freshness-ci.yml'
  push:
    branches:
      - fix/league-hub-shared-cache-freshness-20261122
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shared-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live Hall, Awards, Daily and draft shared-cache freshness
        run: |
          node --check league-hub-v451.js
          node --check netlify/functions/site-v29.mjs
          node --test tests/league-hub-shared-freshness.test.mjs
