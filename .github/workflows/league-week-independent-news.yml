name: League Hub independent weekly visibility
on:
  push:
    branches:
      - fix/league-week-independent-of-inquirer-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-independent-week:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Check edited JavaScript syntax
        run: |
          node --check league-hub-v451.js
          node --check netlify/functions/league-hub.mjs
          node --check netlify/functions/lib/league-completed-week.mjs
      - name: Test finalized-week independence and existing newsroom isolation
        run: |
          node --test tests/league-week-independent-news.test.mjs
          node --test tests/inquirer-github-archive-reader.test.mjs tests/inquirer-schedule-decision.test.mjs tests/inquirer-week9-unattended-publish-regression.test.mjs
