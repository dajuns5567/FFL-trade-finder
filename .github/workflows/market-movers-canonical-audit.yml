name: Market Movers canonical accuracy audit
on:
  pull_request:
    paths:
      - 'netlify/functions/value-history.mjs'
      - 'value-history-v276.js'
      - 'netlify/functions/site-v29.mjs'
      - 'tests/market-movers-canonical-era-audit.test.mjs'
      - '.github/workflows/market-movers-canonical-audit.yml'
permissions:
  contents: read
jobs:
  market-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check value-history-v276.js
      - run: node --check netlify/functions/value-history.mjs
      - run: node --test tests/market-movers-canonical-era-audit.test.mjs tests/market-period-canonical-parity-v116.test.mjs tests/market-intelligence-refresh-consistency.test.mjs
