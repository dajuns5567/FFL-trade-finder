name: One-time approved Netlify release gate (read-only)
on:
  pull_request:
    paths:
      - 'netlify.toml'
      - 'tests/netlify-third-account-preview-build.test.mjs'
      - 'tests/netlify-v101-one-time-release.test.mjs'
      - 'tests/inquirer-replacement-bootstrap.test.mjs'
      - 'tests/inquirer-approved-cutover.test.mjs'
      - '.github/workflows/netlify-v101-one-time-release-gate-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production deploy fail-closed outside exact release commit
        run: node --test tests/netlify-third-account-preview-build.test.mjs tests/netlify-v101-one-time-release.test.mjs
      - name: Confirm no unauthorized files changed
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          // Exact preview-only combined candidate; legacy release checks remain unchanged elsewhere.
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-paired-comparisons-20261125'){
            execFileSync('node',['scripts/audit-mobile-pairs-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-information-density-20261125'){
            execFileSync('node',['scripts/audit-mobile-density-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/inquirer-daily-default-closed-20261125'){
            execFileSync('node',['scripts/audit-inquirer-closed-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='integration/mobile-shared-regressions-20261125'){
            execFileSync('node',['scripts/audit-mobile-shared-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          // Combined preview acceptance only: original isolated gates remain
          // mandatory on every other branch. No production authorization.
          if(process.env.HEAD_REF==='integration/verified-site-reconciliation-20261124'){
            const frozen='b58e76a0e5ebc01115a4a76bc269253a91dbf109',base='d18470cc44ab35841a65eee94bdd4391f15d4faa';
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','origin/main'),base,'Main moved; reconcile and re-audit');
            git('merge-base','--is-ancestor',frozen,'HEAD');
            const permitted=new Set([".github/workflows/release-v107-recorder-after-market-ui-isolated.yml",".github/workflows/release-v112-team-trade-linkage-ci.yml",".github/workflows/release-v114-historical-pick-projection-ci.yml",".github/workflows/release-v116-market-period-parity-ci.yml",".github/workflows/release-canonical-value-sync-isolated.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml"]);
            const delta=git('diff','--name-only',frozen,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(delta.length,permitted.size,'Exact reconciliation CI-only delta required');
            for(const p of delta)assert(permitted.has(p),'Audited application content changed: '+p);
            const expected=new Set([...git('diff','--name-only',base,frozen).split(String.fromCharCode(10)).filter(Boolean),...permitted]);
            const actual=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(actual.length,expected.size,'Combined audited inventory changed');
            for(const p of actual)assert(expected.has(p),'Unreviewed combined change: '+p);
            assert.equal(git('rev-parse','HEAD:netlify.toml'),git('rev-parse',frozen+':netlify.toml'),'Audited deployment gate must remain unchanged');
            console.log('Frozen 87-pass preview content verified; only six acceptance workflows differ. No production release granted.');
            process.exit(0);
          }
          // Owner-authorized one-time deployment, no application modifications.
          if(process.env.HEAD_REF==='release/verified-630-one-time-production-20261124'){
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='379101e110f58db88aa1a79bcb42df3c0a3439e1';
            assert.equal(git('rev-parse','origin/main'),base,'Audited parent changed');
            const expected=new Set(["netlify.toml","tests/netlify-v101-one-time-release.test.mjs",".github/workflows/netlify-v101-one-time-release-gate-ci.yml"]);
            const files=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(files.length,expected.size,'Exact deployment-only inventory');
            for(const p of files)assert(expected.has(p),'Application change not authorized: '+p);
            assert.equal(git('rev-parse','HEAD:netlify.toml'),'6344a7fa8374c677026bbd1086968d5ae57f57b2');
            assert.equal(git('rev-parse','HEAD:tests/netlify-v101-one-time-release.test.mjs'),'a1a6e461005806460587a938732d591c47a5f8a9');
            console.log('Exact reviewed release gate and unchanged application verified');
            process.exit(0);
          }
          // Isolated mobile presentation preview; no production authorization.
          if(process.env.HEAD_REF==='feature/mobile-presentation-v631'){
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            const base='a1f3d19fe3524f97da9c51c2827607d74de4b38c';
            assert.equal(git('rev-parse','origin/main'),base,'Desktop base changed; re-audit first');
            const expected=new Set(['fleeced-view-mode-v631.js','fleeced-mobile-v631.css','netlify/functions/site-v29.mjs','scripts/mobile-presentation-browser-v631.mjs','.github/workflows/mobile-presentation-v631.yml','netlify.toml','.github/workflows/netlify-v101-one-time-release-gate-ci.yml']);
            const paths=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(paths.length,expected.size);
            paths.forEach(p=>assert(expected.has(p),'Unapproved path '+p));
            assert.equal(git('show','HEAD:netlify.toml'),git('show',base+':netlify.toml').replace("'574','630'].includes","'574','630','637'].includes"),'Only preview 637 permitted, production gate identical');
            console.log('Mobile preview-only gate verified; desktop release unchanged');
            process.exit(0);
          }
          const paths=execFileSync('git',['diff','--name-only','origin/'+process.env.BASE_REF+'...HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          // Preserve the original V101 exact six-file gate for every other PR.
          // The separately owner-authorized V110 cutover must match its own
          // exact, audited 38-file Inquirer-only release manifest.
          const legacy=new Set(['netlify.toml','tests/netlify-third-account-preview-build.test.mjs','tests/netlify-v101-one-time-release.test.mjs','tests/inquirer-replacement-bootstrap.test.mjs','tests/inquirer-approved-cutover.test.mjs','.github/workflows/netlify-v101-one-time-release-gate-ci.yml']);
          const release=new Set([".github/workflows/inquirer-combined-review-only.yml",".github/workflows/inquirer-current-site-publisher-identity.yml",".github/workflows/inquirer-github-archive-reader.yml",".github/workflows/inquirer-immutable-archive-restore.yml",".github/workflows/inquirer-pinned-originals-integrity.yml",".github/workflows/inquirer-publisher-archive-readiness.yml",".github/workflows/inquirer-v110-approved-cutover.yml",".github/workflows/inquirer-v110-editorial-retry.yml",".github/workflows/netlify-v101-inquirer-pr-previews-only.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml","netlify.toml","netlify/functions/inquirer-editorial-v31.mjs","netlify/functions/inquirer-original-archive-restore-background.mjs","netlify/functions/inquirer-publication-status.mjs","netlify/functions/inquirer-publish-background.mjs","netlify/functions/inquirer-publish-scheduled.mjs","netlify/functions/league-hub.mjs","netlify/functions/lib/inquirer-archive-restore-runtime.mjs","netlify/functions/lib/inquirer-github-archive.mjs","netlify/functions/lib/inquirer-immutable-archive-restore.mjs","netlify/functions/lib/inquirer-minor-repetition.mjs","netlify/functions/lib/inquirer-publisher-archive-readiness.mjs","scripts/verify-inquirer-github-archive-pinned.mjs","tests/inquirer-current-site-publisher-identity.test.mjs","tests/inquirer-forward-copy-regression.test.mjs","tests/inquirer-github-archive-reader.test.mjs","tests/inquirer-immutable-archive-restore.test.mjs","tests/inquirer-live-cutover-gates.test.mjs","tests/inquirer-week5-owner-signoff.test.mjs","tests/inquirer-private-edition-audit.test.mjs","tests/inquirer-publisher-archive-readiness.test.mjs","tests/inquirer-replacement-bootstrap.test.mjs","tests/inquirer-schedule-decision.test.mjs","tests/inquirer-v110-editorial-candidate-retry.test.mjs","tests/inquirer-week9-unattended-publish-regression.test.mjs","tests/inquirer-weekly-publication-consistency.test.mjs","tests/netlify-v101-inquirer-pr-previews-only.test.mjs","tests/netlify-v110-inquirer-one-time-release.test.mjs"]);
          const hostFix=new Set(['.github/workflows/inquirer-v110-uuid-host-fix.yml','.github/workflows/netlify-v101-one-time-release-gate-ci.yml','netlify.toml','netlify/functions/lib/inquirer-archive-restore-runtime.mjs','tests/inquirer-live-cutover-gates.test.mjs','tests/netlify-v110-inquirer-one-time-release.test.mjs']);
          const authorized=process.env.HEAD_REF==='release/inquirer-verified-cutover-v110';
          const authorizedHostFix=process.env.HEAD_REF==='fix/inquirer-v110-canonical-scheduled-host';
          const week9Reader=new Set([".github/workflows/inquirer-week09-voice-correction.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml","netlify.toml","netlify/functions/inquirer-editorial-v31.mjs","netlify/functions/league-hub.mjs","netlify/functions/lib/inquirer-attribution-audit.mjs","netlify/functions/lib/inquirer-week09-editorial-correction.mjs","scripts/verify-inquirer-week09-attribution-correction.mjs","tests/inquirer-attribution-audit.test.mjs","tests/netlify-inquirer-week9-reader-release.test.mjs","tests/netlify-v101-inquirer-pr-previews-only.test.mjs"]);
          const authorizedReader=process.env.HEAD_REF==='fix/inquirer-week09-attributed-recap-correction';
          // This new release changes only the separate Inquirer publisher.
          // Exact-scoped PR verification, never permission for a production deploy.
          const githubNative=new Set([
            '.github/workflows/inquirer-github-native-publisher.yml',
            '.github/workflows/netlify-v101-one-time-release-gate-ci.yml',
            'netlify.toml','netlify/functions/league-hub.mjs',
            'netlify/functions/inquirer-editorial-v31.mjs',
            'netlify/functions/lib/inquirer-github-published.mjs',
            'netlify/functions/lib/inquirer-week09-editorial-correction.mjs',
            'scripts/inquirer-v25-audit.mjs',
            'scripts/publish-inquirer-github-native.mjs',
            'tests/inquirer-github-native-publisher.test.mjs',
            'tests/inquirer-schedule-decision.test.mjs',
            'tests/inquirer-weekly-publication-consistency.test.mjs'
          ]);
          const authorizedGithubNative=process.env.HEAD_REF==='fix/inquirer-github-native-publication-20261121';
          const leagueWeek=new Set([
            '.github/workflows/league-week-independent-news.yml',
            '.github/workflows/netlify-v101-one-time-release-gate-ci.yml',
            'league-hub-v451.js','netlify.toml',
            'netlify/functions/league-hub.mjs',
            'netlify/functions/lib/league-completed-week.mjs',
            'netlify/functions/site-v29.mjs',
            'tests/inquirer-week9-unattended-publish-regression.test.mjs',
            'tests/league-week-independent-news.test.mjs',
            'tests/inquirer-private-preview-ci.test.mjs',
            'tests/presentation-copy-cleanup-v539.test.mjs'
          ]);
          const authorizedLeagueWeek=process.env.HEAD_REF==='fix/league-week-independent-of-inquirer-20261121';
          const allowed=authorizedLeagueWeek?leagueWeek:authorizedGithubNative?githubNative:authorizedReader?week9Reader:authorizedHostFix?hostFix:authorized?release:legacy;
          assert.equal(paths.length,allowed.size,authorizedLeagueWeek?'League Hub weekly visibility must contain exactly eleven audited files':authorizedGithubNative?'GitHub Inquirer publisher must contain exactly twelve audited files':authorizedReader?'Week 9 editorial reader correction must contain exactly 11 audited files':authorizedHostFix?'V110 UUID-host correction must contain exactly six approved files':authorized?'V110 cutover must contain the exact audited Inquirer files':'Netlify deploy release must contain the exact six approved files');
          for(const path of paths)assert(allowed.has(path),'Out-of-scope file: '+path);
          JS
