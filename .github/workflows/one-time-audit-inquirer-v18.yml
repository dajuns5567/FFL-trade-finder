name: One-time audit Fleeced Inquirer V18

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-audit-inquirer-v18.yml'

permissions:
  contents: read

jobs:
  audit-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check V18 newsroom
        run: |
          node --check netlify/functions/inquirer-human-v18.mjs
          node --check netlify/functions/inquirer-overview-v18.mjs
          node --check netlify/functions/inquirer-narrative-v17.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          node --check netlify/functions/league-hub.mjs
      - name: Generate V18 Week 1 candidate
        run: |
          OUT=/tmp/week1-v18.json node scripts/one-time-generate-inquirer-week1.mjs
          node -e "const x=require('/tmp/week1-v18.json'); console.log(JSON.stringify({version:x.inquirer_version,teams:x.teams.length,overview_sections:x.league_overview.sections.length,hot_takes:x.league_overview.hot_takes.map(t=>t.kind)},null,2))"
      - name: Diagnose Nate Landman from generated edition
        run: |
          node <<'NODE'
          const x=require('/tmp/week1-v18.json');
          const hits=[];
          for(const t of x.teams){
            for(const p of [...(t.inquirer_article?.facts?.starter_details||[]),t.inquirer_article?.facts?.best_bench,t.inquirer_article?.facts?.worst_starter].filter(Boolean)){
              if(/Nate Landman/i.test(String(p.name||''))) hits.push({team:t.team_name,roster_id:t.roster_id,...p});
            }
          }
          console.log(JSON.stringify(hits,null,2));
          NODE
      - name: Diagnose Nate Landman raw Sleeper Week 1 row
        run: |
          node <<'NODE'
          const players=await fetch('https://api.sleeper.app/v1/players/nfl').then(r=>r.json());
          const stats=await fetch('https://api.sleeper.app/v1/stats/nfl/regular/2026/1').then(r=>r.json());
          const ids=Object.keys(players).filter(id=>/Nate Landman/i.test(String(players[id]?.full_name||'')));
          console.log(JSON.stringify(ids.map(id=>({id,meta:players[id],stats:stats[id]||null})),null,2));
          NODE
      - name: Run V18 overview audit
        run: node scripts/inquirer-overview-quality-audit.mjs /tmp/week1-v18.json
      - name: Measure V18 team prose against current gate
        continue-on-error: true
        run: node scripts/inquirer-prose-quality-audit.mjs /tmp/week1-v18.json
      - name: Print V18 team prose metrics
        run: |
          node <<'NODE'
          const x=require('/tmp/week1-v18.json');
          const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean);
          const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?(a[(a.length-1)>>1]+a[a.length>>1])/2:0};
          const rows=x.teams.map(t=>{const ps=t.inquirer_article.sections.flatMap(s=>s.paragraphs||[]);return{team:t.team_name,reporter:t.inquirer_article.reporter.name,words:words(ps.join(' ')).length,median:med(ps.map(p=>words(p).length))}});
          console.log(JSON.stringify({min_words:Math.min(...rows.map(r=>r.words)),max_words:Math.max(...rows.map(r=>r.words)),avg_words:Math.round(rows.reduce((n,r)=>n+r.words,0)/rows.length),min_median:Math.min(...rows.map(r=>r.median)),avg_median:(rows.reduce((n,r)=>n+r.median,0)/rows.length).toFixed(1),rows},null,2));
          NODE
