name: One-time publish audited Inquirer V20 — pass 5

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-publish-inquirer-v20.yml'

permissions:
  contents: write

jobs:
  publish-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check newsroom
        run: |
          node --check netlify/functions/inquirer-human-v19.mjs
          node --check netlify/functions/inquirer-human-v20.mjs
          node --check netlify/functions/inquirer-narrative-v17.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          node --check netlify/functions/league-hub.mjs
          node --check league-hub-v451.js
      - name: Generate V20 Week 1 candidate
        run: OUT=/tmp/week1-v20.json node scripts/one-time-generate-inquirer-week1.mjs
      - name: Audit human writing and League Notebook
        run: |
          node scripts/inquirer-prose-quality-audit.mjs /tmp/week1-v20.json
          node scripts/inquirer-overview-quality-audit.mjs /tmp/week1-v20.json
      - name: Verify lineup eligibility and sample newsroom copy
        run: |
          node <<'NODE'
          const x=require('/tmp/week1-v20.json');
          if(x.inquirer_version!==20)throw Error('expected V20');
          const saints=x.teams.find(t=>String(t.roster_id)==='27');
          const body=saints?.inquirer_article?.sections?.flatMap(s=>s.paragraphs||[]).join(' ')||'';
          const mgmt=saints?.inquirer_article?.sections?.find(s=>s.kind==='management')?.paragraphs?.join(' ')||'';
          if(/Nate Landman.*J\.K\. Dobbins|J\.K\. Dobbins.*Nate Landman/i.test(mgmt))throw Error('LB/RB cross-position hindsight survived');
          const miss=saints?.best_lineup_miss;
          if(miss?.reserve?.position==='LB'&&String(miss?.slot||'').toUpperCase()==='RB')throw Error('illegal IDP->RB best_lineup_miss');
          const det=x.teams.find(t=>/Detroit Lions/i.test(t.team_name||''));
          console.log(JSON.stringify({
            saints:{headline:saints?.inquirer_article?.headline,section_order:saints?.inquirer_article?.sections?.map(s=>s.kind),management:mgmt,excerpt:body.slice(0,1400)},
            detroit:{headline:det?.inquirer_article?.headline,section_order:det?.inquirer_article?.sections?.map(s=>s.kind),excerpt:det?.inquirer_article?.paragraphs?.join(' ').slice(0,1400)}
          },null,2));
          NODE
      - name: Build immutable V20 preload and metadata
        run: |
          node <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const raw=fs.readFileSync('/tmp/week1-v20.json');
          const x=JSON.parse(raw);
          if(x.inquirer_version!==20||x.teams?.length!==32)throw Error('invalid V20 candidate');
          const gz=z.gzipSync(raw,{level:9}).toString('base64');
          fs.writeFileSync('netlify/functions/inquirer-week1-2026-preload.mjs',"import {gunzipSync} from 'node:zlib';\nconst payload='"+gz+"';\nconst week1=JSON.parse(gunzipSync(Buffer.from(payload,'base64')).toString('utf8'));\nexport default week1;\n");
          const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
          const teamWords=x.teams.map(t=>words((t.inquirer_article?.paragraphs||[]).join(' ')));
          const orders=[...new Set(x.teams.map(t=>(t.inquirer_article?.sections||[]).map(s=>s.kind).join('>')))];
          fs.writeFileSync('data/inquirer/2026/week-01.meta.json',JSON.stringify({
            schema_version:4,season:2026,week:1,inquirer_version:20,generated_at:x.generated_at,teams:x.teams.length,
            reporters:x.reporters.map(r=>r.name),reporter_distribution:'8 team articles per reporter',
            team_article_sections:6,minimum_team_article_paragraphs:14,average_team_article_words:Math.round(teamWords.reduce((a,b)=>a+b,0)/teamWords.length),
            distinct_section_orders:orders.length,league_overview_sections:x.league_overview?.sections?.length||0,
            hot_takes:x.league_overview?.hot_takes?.length||0,hot_take_types:(x.league_overview?.hot_takes||[]).map(t=>t.kind),
            prose_quality_audits:['scripts/inquirer-prose-quality-audit.mjs','scripts/inquirer-overview-quality-audit.mjs'],
            legal_lineup_swap_only:true,idp_cannot_replace_offensive_slot:true,
            archive_filters:['year','week','team'],archive_default:'current completed week',
            replaces:'V19/V18 templated presentation edition',source:'Completed Sleeper Week 1 data through V20 passionate newsroom',
            preload_module:'netlify/functions/inquirer-week1-2026-preload.mjs'
          },null,2)+'\n');
          NODE
          node --check netlify/functions/inquirer-week1-2026-preload.mjs
      - name: Commit audited V20 Week 1 archive
        run: |
          git config user.name "Fleeced Inquirer Archive"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/inquirer-week1-2026-preload.mjs data/inquirer/2026/week-01.meta.json
          git commit -m "Replace Week 1 Inquirer with audited V20 newsroom edition"
          git push origin HEAD:release/precision-idp-runtime-20260919
