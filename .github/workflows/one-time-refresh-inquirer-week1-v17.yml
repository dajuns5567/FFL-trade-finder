name: One-time refresh corrected Week 1 V17 preload

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-refresh-inquirer-week1-v17.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate corrected audited Week 1
        run: |
          node --check netlify/functions/inquirer-narrative-v17.mjs
          OUT=/tmp/week1.json node scripts/one-time-generate-inquirer-week1.mjs
          node scripts/inquirer-prose-quality-audit.mjs /tmp/week1.json
      - name: Rewrite immutable preload
        run: |
          node <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const raw=fs.readFileSync('/tmp/week1.json');
          const x=JSON.parse(raw);
          if(x.inquirer_version!==17||x.teams?.length!==32) process.exit(2);
          const payload=z.gzipSync(raw,{level:9}).toString('base64');
          fs.writeFileSync('netlify/functions/inquirer-week1-2026-preload.mjs',"import {gunzipSync} from 'node:zlib';\nconst payload='"+payload+"';\nconst week1=JSON.parse(gunzipSync(Buffer.from(payload,'base64')).toString('utf8'));\nexport default week1;\n");
          const articleWords=x.teams.map(t=>(t.inquirer_article.paragraphs||[]).join(' ').trim().split(/\s+/).filter(Boolean).length);
          fs.writeFileSync('data/inquirer/2026/week-01.meta.json',JSON.stringify({
            schema_version:2,season:2026,week:1,inquirer_version:17,generated_at:x.generated_at,
            teams:32,reporters:x.reporters.map(r=>r.name),reporter_distribution:'8 team articles per reporter',
            team_article_sections:6,league_overview_sections:x.league_overview.sections.length,hot_takes:x.league_overview.hot_takes.length,
            average_team_article_words:Math.round(articleWords.reduce((a,b)=>a+b,0)/articleWords.length),
            prose_quality_audit:'passed scripts/inquirer-prose-quality-audit.mjs before commit',
            replaces:'V16 Week 1 checklist-style edition',
            source:'Completed Sleeper Week 1 data via corrected V17 narrative writer',
            preload_module:'netlify/functions/inquirer-week1-2026-preload.mjs'
          },null,2)+'\n');
          NODE
          node --check netlify/functions/inquirer-week1-2026-preload.mjs
      - name: Commit corrected preload
        run: |
          git config user.name "Fleeced Inquirer Archive"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/inquirer-week1-2026-preload.mjs data/inquirer/2026/week-01.meta.json
          git commit -m "Refresh audited Week 1 V17 narrative archive"
          git push origin HEAD:release/precision-idp-runtime-20260919
