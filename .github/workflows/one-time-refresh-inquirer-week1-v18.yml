name: One-time publish audited Week 1 Inquirer V18

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-refresh-inquirer-week1-v18.yml'

permissions:
  contents: write

jobs:
  publish-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Week 1 V18 candidate
        run: |
          node --check netlify/functions/inquirer-human-v18.mjs
          node --check netlify/functions/inquirer-overview-v18.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          OUT=/tmp/week1-v18.json node scripts/one-time-generate-inquirer-week1.mjs
      - name: Require both writing audits
        run: |
          node scripts/inquirer-prose-quality-audit.mjs /tmp/week1-v18.json
          node scripts/inquirer-overview-quality-audit.mjs /tmp/week1-v18.json
      - name: Verify bench-player real-stat enrichment
        run: |
          node <<'NODE'
          const x=require('/tmp/week1-v18.json');
          const matches=[];
          for(const t of x.teams){
            for(const p of [...(t.inquirer_article?.facts?.starter_details||[]),t.inquirer_article?.facts?.best_bench,t.inquirer_article?.facts?.worst_starter].filter(Boolean)){
              if(String(p.id)==='8659')matches.push({team:t.team_name,name:p.name,real_stat_line:p.real_stat_line,season_games:p.season_games,season_avg:p.season_avg});
            }
          }
          console.log(JSON.stringify(matches,null,2));
          if(!matches.length||!matches.some(p=>/5 solo/.test(p.real_stat_line)&&/3 ast/.test(p.real_stat_line)&&/1 QB hits/.test(p.real_stat_line)&&/1 PD/.test(p.real_stat_line)))process.exit(18);
          NODE
      - name: Build immutable V18 preload
        run: |
          node <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const raw=fs.readFileSync('/tmp/week1-v18.json');
          const x=JSON.parse(raw);
          if(x.inquirer_version!==18||x.teams?.length!==32||x.league_overview?.hot_takes?.length<5)process.exit(2);
          const gz=z.gzipSync(raw,{level:9}).toString('base64');
          const source="import {gunzipSync} from 'node:zlib';\nconst payload='"+gz+"';\nconst week1=JSON.parse(gunzipSync(Buffer.from(payload,'base64')).toString('utf8'));\nexport default week1;\n";
          fs.writeFileSync('netlify/functions/inquirer-week1-2026-preload.mjs',source);
          const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
          const teamWords=x.teams.map(t=>words((t.inquirer_article?.paragraphs||[]).join(' ')));
          const overviewWords=words((x.league_overview?.sections||[]).flatMap(s=>s.paragraphs||[]).join(' '));
          fs.writeFileSync('data/inquirer/2026/week-01.meta.json',JSON.stringify({
            schema_version:3,
            season:2026,
            week:1,
            inquirer_version:18,
            generated_at:x.generated_at,
            teams:x.teams.length,
            reporters:x.reporters.map(r=>r.name),
            reporter_distribution:'8 team articles per reporter',
            team_article_sections:6,
            average_team_article_words:Math.round(teamWords.reduce((a,b)=>a+b,0)/teamWords.length),
            league_overview_sections:x.league_overview.sections.length,
            league_overview_words:overviewWords,
            hot_takes:x.league_overview.hot_takes.length,
            hot_take_types:x.league_overview.hot_takes.map(t=>t.kind),
            prose_quality_audits:[
              'scripts/inquirer-prose-quality-audit.mjs',
              'scripts/inquirer-overview-quality-audit.mjs'
            ],
            nate_landman_real_stat_line_verified:true,
            replaces:'V17 Week 1 narrative edition',
            source:'Completed Sleeper Week 1 data via V18 human-first newsroom',
            preload_module:'netlify/functions/inquirer-week1-2026-preload.mjs'
          },null,2)+'\n');
          NODE
          node --check netlify/functions/inquirer-week1-2026-preload.mjs
      - name: Commit V18 Week 1 archive
        run: |
          git config user.name "Fleeced Inquirer Archive"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/inquirer-week1-2026-preload.mjs data/inquirer/2026/week-01.meta.json
          git commit -m "Replace Week 1 Inquirer with audited V18 newsroom edition"
          git push origin HEAD:release/precision-idp-runtime-20260919
