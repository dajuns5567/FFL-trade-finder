name: One-time rewrite Fleeced Inquirer Week 1 V17 — grammar-final

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-rewrite-inquirer-week1-v17.yml'

permissions:
  contents: write

jobs:
  rewrite-week1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check V17 Inquirer
        run: |
          node --check netlify/functions/inquirer-narrative-v17.mjs
          node --check netlify/functions/inquirer-reporters.mjs
          node --check scripts/one-time-generate-inquirer-week1.mjs
          node --check scripts/inquirer-prose-quality-audit.mjs
      - name: Generate rewritten Week 1 edition
        run: |
          OUT=/tmp/week1-inquirer-v17.json node scripts/one-time-generate-inquirer-week1.mjs
          node -e "const x=require('/tmp/week1-inquirer-v17.json'); if(x.inquirer_version!==17||x.week!==1||x.teams?.length!==32) process.exit(1); console.log('generated 32 V17 team stories')"
      - name: Audit finished prose
        run: |
          node scripts/inquirer-prose-quality-audit.mjs /tmp/week1-inquirer-v17.json > /tmp/prose-audit.json.log
          tail -n 25 /tmp/prose-audit.json.log
      - name: Show headline variety
        run: |
          node <<'NODE'
          const x=require('/tmp/week1-inquirer-v17.json');
          for(const r of x.reporters){
            console.log('\n'+r.name);
            for(const t of x.teams.filter(t=>t.inquirer_article?.reporter?.id===r.id)) console.log(' - '+t.inquirer_article.headline);
          }
          NODE
      - name: Build immutable V17 preload
        run: |
          node <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const raw=fs.readFileSync('/tmp/week1-inquirer-v17.json');
          const x=JSON.parse(raw);
          const gz=z.gzipSync(raw,{level:9}).toString('base64');
          const source="import {gunzipSync} from 'node:zlib';\nconst payload='"+gz+"';\nconst week1=JSON.parse(gunzipSync(Buffer.from(payload,'base64')).toString('utf8'));\nexport default week1;\n";
          fs.writeFileSync('netlify/functions/inquirer-week1-2026-preload.mjs',source);
          fs.mkdirSync('data/inquirer/2026',{recursive:true});
          const articleWords=x.teams.map(t=>(t.inquirer_article.paragraphs||[]).join(' ').trim().split(/\s+/).filter(Boolean).length);
          fs.writeFileSync('data/inquirer/2026/week-01.meta.json',JSON.stringify({
            schema_version:2,season:2026,week:1,inquirer_version:17,
            generated_at:x.generated_at,teams:x.teams.length,
            reporters:x.reporters.map(r=>r.name),
            reporter_distribution:'8 team articles per reporter',
            team_article_sections:6,
            league_overview_sections:x.league_overview.sections.length,
            hot_takes:x.league_overview.hot_takes.length,
            average_team_article_words:Math.round(articleWords.reduce((a,b)=>a+b,0)/articleWords.length),
            prose_quality_audit:'passed scripts/inquirer-prose-quality-audit.mjs before commit',
            replaces:'V16 Week 1 checklist-style edition',
            source:'Completed Sleeper Week 1 data via V17 narrative writer',
            preload_module:'netlify/functions/inquirer-week1-2026-preload.mjs'
          },null,2)+'\n');
          NODE
          node --check netlify/functions/inquirer-week1-2026-preload.mjs
      - name: Commit replacement Week 1 edition
        run: |
          git config user.name "Fleeced Inquirer Archive"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/inquirer-week1-2026-preload.mjs data/inquirer/2026/week-01.meta.json
          git commit -m "Replace Week 1 Inquirer with audited V17 narrative edition"
          git push origin HEAD:release/precision-idp-runtime-20260919
