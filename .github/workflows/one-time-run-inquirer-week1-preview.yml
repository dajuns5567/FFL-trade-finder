name: One-time generate Fleeced Inquirer Week 1 archive

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-run-inquirer-week1-preview.yml'

jobs:
  generate-week1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Week 1 Inquirer V16 from Sleeper
        run: |
          OUT=/tmp/week1-inquirer.json node scripts/one-time-generate-inquirer-week1.mjs
          node -e "const x=require('/tmp/week1-inquirer.json'); if(x.inquirer_version!==16||x.week!==1||x.teams?.length!==32||x.league_overview?.sections?.length!==4||x.league_overview?.hot_takes?.length!==4) process.exit(1); console.log('validated Week 1 V16 archive')"
      - uses: actions/upload-artifact@v4
        with:
          name: week1-inquirer-v16
          path: /tmp/week1-inquirer.json
          retention-days: 1
