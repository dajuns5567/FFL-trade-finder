name: One-time publish Fleeced Inquirer Week 1 preload

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919
    paths:
      - '.github/workflows/one-time-run-inquirer-week1-preview.yml'

permissions:
  contents: write

jobs:
  publish-week1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/precision-idp-runtime-20260919
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Week 1 Inquirer V16 from Sleeper
        run: |
          OUT=/tmp/week1-inquirer.json node scripts/one-time-generate-inquirer-week1.mjs
          node -e "const x=require('/tmp/week1-inquirer.json'); if(x.inquirer_version!==16||x.week!==1||x.teams?.length!==32||x.league_overview?.sections?.length!==4||x.league_overview?.hot_takes?.length!==4) process.exit(1); console.log('validated Week 1 V16 archive')"
      - name: Build compact immutable preload module
        run: |
          node <<'NODE'
          const fs=require('fs'),z=require('zlib');
          const raw=fs.readFileSync('/tmp/week1-inquirer.json');
          const x=JSON.parse(raw);
          const gz=z.gzipSync(raw,{level:9}).toString('base64');
          const source="import {gunzipSync} from 'node:zlib';\nconst payload='"+gz+"';\nconst week1=JSON.parse(gunzipSync(Buffer.from(payload,'base64')).toString('utf8'));\nexport default week1;\n";
          fs.writeFileSync('netlify/functions/inquirer-week1-2026-preload.mjs',source);
          fs.mkdirSync('data/inquirer/2026',{recursive:true});
          fs.writeFileSync('data/inquirer/2026/week-01.meta.json',JSON.stringify({
            schema_version:1,season:2026,week:1,inquirer_version:16,
            generated_at:x.generated_at,teams:x.teams.length,
            reporters:x.reporters.map(r=>r.name),
            league_overview_sections:x.league_overview.sections.length,
            hot_takes:x.league_overview.hot_takes.length,
            source:'Sleeper Week 1 completed data via scripts/one-time-generate-inquirer-week1.mjs',
            preload_module:'netlify/functions/inquirer-week1-2026-preload.mjs'
          },null,2)+'\n');
          console.log('preload bytes',fs.statSync('netlify/functions/inquirer-week1-2026-preload.mjs').size);
          NODE
          node --check netlify/functions/inquirer-week1-2026-preload.mjs
      - name: Commit Week 1 immutable preload
        run: |
          git config user.name "Fleeced Inquirer Archive"
          git config user.email "actions@users.noreply.github.com"
          git add netlify/functions/inquirer-week1-2026-preload.mjs data/inquirer/2026/week-01.meta.json
          if git diff --cached --quiet; then
            echo "Week 1 preload already current"
            exit 0
          fi
          git commit -m "Publish immutable Fleeced Inquirer Week 1 V16 archive"
          git push origin HEAD:release/precision-idp-runtime-20260919
