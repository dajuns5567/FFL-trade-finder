name: Player of the Week completed-week scoring gapfill
on:
  pull_request:
    paths:
      - 'netlify/functions/value-history.mjs'
      - 'tests/player-weekly-awards-partial-live-week-gap.test.mjs'
      - '.github/workflows/player-weekly-award-gapfill-ci.yml'
permissions:
  contents: read
jobs:
  scoring-gapfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check netlify/functions/value-history.mjs
      - run: node --test tests/player-weekly-awards-partial-live-week-gap.test.mjs tests/player-weekly-milestone-awards.test.mjs tests/player-weekly-badge-completion-readback.test.mjs
