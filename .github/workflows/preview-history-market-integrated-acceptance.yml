name: Review-only integrated Market / Value History acceptance
on:
  pull_request:
    paths:
      - 'netlify/functions/value-history.mjs'
      - 'value-history-v276.js'
      - 'netlify/functions/value-history-inventory-audit.mjs'
      - 'tests/value-history-inventory-audit.test.mjs'
      - 'tests/market-model-provenance-v110.test.mjs'
      - '.github/workflows/preview-history-market-integrated-acceptance.yml'
permissions:
  contents: read
jobs:
  read-only-integration:
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all review-only source syntax
        run: |
          node --check netlify/functions/value-history.mjs
          node --check value-history-v276.js
          node --check netlify/functions/value-history-inventory-audit.mjs
          node --check scripts/audit-value-history-durable.mjs
      - name: Install declared read-only unit-test dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Audit actual immutable GitHub index, snapshot provenance and timestamp gaps
        run: |
          git fetch --no-tags origin value-history-data:refs/remotes/origin/value-history-data
          node scripts/audit-value-history-durable.mjs --git-archive
      - name: Run both histories, live mover, market heat and chart regressions
        run: |
          node --test tests/value-history-inventory-audit.test.mjs tests/assess-archive-continuity.test.mjs tests/market-model-provenance-v110.test.mjs tests/market-live-movers-v109.test.mjs tests/value-history-dense-charts.test.mjs tests/market-intelligence-original-recovery.test.mjs tests/trade-history-hindsight-reconciled.test.mjs tests/trade-history-original-pick-projection.test.mjs
      - name: Assert review isolation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const policy=readFileSync('netlify.toml','utf8');
          assert(policy.includes("e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2'"));
          assert(policy.includes("e.CONTEXT==='deploy-preview'"));
          assert(!policy.includes("CONTEXT==='production'"));
          assert(!policy.includes('schedule = "*/5 * * * *"'));
          assert(readFileSync('netlify/functions/value-history.mjs','utf8').includes("url.searchParams.get('inventory_audit')==='1'"));
          console.log('Preview site and zero-scheduled-functions policy confirmed');
          JS
      # No production secrets, archive writes, merges or releases permitted.
