name: Preview 616 Player-of-Week badge parity
on:
  pull_request:
    paths:
      - 'netlify/functions/value-history.mjs'
      - 'tests/preview616-weekly-badge-parity.test.mjs'
      - '.github/workflows/preview616-weekly-badge-parity.yml'
  workflow_dispatch:
jobs:
  verify-weekly-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Value History function syntax
        run: node --check netlify/functions/value-history.mjs
      - name: Test verified Week 6 and Week 10 badge readback without self-fetch
        run: node --test tests/preview616-weekly-badge-parity.test.mjs
