name: Public release write boundary (read-only CI)
on:
  pull_request:
    paths:
      - 'netlify/functions/**'
      - 'value-history-v276.js'
      - 'league-hub-v451.js'
      - 'tests/public-release-*.test.mjs'
      - 'scripts/build-public-site.mjs'
      - 'scripts/archive-scheduled-award-records.mjs'
      - 'netlify.toml'
      - '.github/workflows/public-release-write-boundary.yml'
permissions:
  contents: read
jobs:
  access-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: |
          node --check value-history-v276.js
          node --check league-hub-v451.js
          node --check netlify/functions/lib/public-release-authorization.mjs
          node --test tests/public-release-*.test.mjs
          node scripts/build-public-site.mjs
          node --check scripts/archive-scheduled-award-records.mjs

  staged-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/build-public-site.mjs
      - name: Exercise accepted application with only the restricted asset directory
        env:
          PUBLIC_SITE_STATIC_ROOT: .public-site
        run: node scripts/navigation-live-runner-v656.mjs
