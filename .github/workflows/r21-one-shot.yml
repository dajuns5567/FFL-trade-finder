name: Week 2 R21 one-shot

on:
  workflow_dispatch:
  push:
    branches:
      - player-signal-layer-r1
    paths:
      - '.github/workflows/r21-one-shot.yml'
      - 'netlify/functions/inquirer-week2-editorial-r21.mjs'
      - 'scripts/inquirer-week2-r21-smoke.mjs'
      - 'scripts/r21-one-shot-patch.mjs'
      - 'scripts/r21-voice-patch.mjs'

permissions:
  contents: write

jobs:
  verify-r21:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply content/runtime/audit patch
        run: node scripts/r21-one-shot-patch.mjs
      - name: Apply voice-distribution patch
        run: node scripts/r21-voice-patch.mjs
      - name: Syntax check R21
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r21.mjs
          node --check scripts/inquirer-week2-r21-smoke.mjs
          node --check netlify/functions/league-hub.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
      - name: Run R20 regression
        run: node scripts/inquirer-week2-r20-smoke.mjs
      - name: Run R21 all-team editorial regression
        run: node scripts/inquirer-week2-r21-smoke.mjs
      - name: Materialize R21 Week 2
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import rawWeek2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r21.mjs';
          const d=applyWeek2EditorialR16(rawWeek2);
          if(Number(d?.editorial_revision)!==21||d?.voice_revision!=='week2-r21'||(d?.teams||[]).length!==32)throw new Error('R21 did not materialize correctly');
          fs.writeFileSync('/tmp/week2-r21.json',JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Run full generated Week 2 audit
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-r21.json
      - name: Upload R21 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week2-r21-generated-diagnostic
          path: /tmp/week2-r21.json
          retention-days: 2
      - name: Commit verified runtime wiring
        run: |
          rm scripts/r21-one-shot-patch.mjs scripts/r21-voice-patch.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/inquirer-week2-editorial-r21.mjs netlify/functions/league-hub.mjs scripts/inquirer-v25-generated-audit.mjs scripts/inquirer-week2-r21-smoke.mjs scripts/r21-one-shot-patch.mjs scripts/r21-voice-patch.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Wire verified Week 2 editorial R21"
          git push origin HEAD:player-signal-layer-r1
