name: Release candidate — canonical shared Player Values refresh (read-only)
on:
  pull_request:
    paths:
      - 'modeled-player-values-v319.js'
      - 'nonblocking-consensus-v277.js'
      - 'ui-player-values-v139.js'
      - 'tests/model-v319-metadata-boot-guard.test.mjs'
      - 'tests/canonical-live-values-refresh-isolated.test.mjs'
      - '.github/workflows/release-canonical-value-sync-isolated.yml'
permissions:
  contents: read
jobs:
  canonical-currency-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse canonical live source and Player Values presentation
        run: |
          node --check modeled-player-values-v319.js
          node --check nonblocking-consensus-v277.js
          node --check ui-player-values-v139.js
      - name: Confirm source-backed canonical player map, metadata gate and consumer events
        run: node --test tests/model-v319-metadata-boot-guard.test.mjs tests/canonical-live-values-refresh-isolated.test.mjs
      - name: Verify only shared Player Values refresh subsystem changed
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const files=execFileSync('git',['diff','--name-only','origin/release/idp-v101-isolated-draft...HEAD'],{encoding:'utf8'}).trim().split(String.fromCharCode(10)).filter(Boolean);
          const allowed=new Set(["modeled-player-values-v319.js","nonblocking-consensus-v277.js","ui-player-values-v139.js","tests/model-v319-metadata-boot-guard.test.mjs","tests/canonical-live-values-refresh-isolated.test.mjs",".github/workflows/release-canonical-value-sync-isolated.yml"]);
          assert(files.length>0);
          for(const file of files)assert(allowed.has(file),'Out-of-scope subsystem: '+file);
          console.log('Canonical shared-price refresh source only:',files);
          JS
      - name: Install read-only Chromium to test existing site and Finder behavior
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rehearse current site with shared canonical price refresh, no external writes
        run: node scripts/rehearse-full-original-app-browser.mjs .
