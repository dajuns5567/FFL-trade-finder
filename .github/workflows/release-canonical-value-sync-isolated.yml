name: Release candidate — canonical shared Player Values refresh (read-only)
on:
  pull_request:
    paths:
      - 'modeled-player-values-v319.js'
      - 'nonblocking-consensus-v277.js'
      - 'ui-player-values-v139.js'
      - 'tests/model-v319-metadata-boot-guard.test.mjs'
      - 'tests/canonical-live-values-refresh-isolated.test.mjs'
      - '.github/workflows/release-canonical-value-sync-isolated.yml'
permissions:
  contents: read
jobs:
  canonical-currency-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse canonical live source and Player Values presentation
        run: |
          node --check modeled-player-values-v319.js
          node --check nonblocking-consensus-v277.js
          node --check ui-player-values-v139.js
      - name: Confirm source-backed canonical player map, metadata gate and consumer events
        run: node --test tests/model-v319-metadata-boot-guard.test.mjs tests/canonical-live-values-refresh-isolated.test.mjs
      - name: Verify only shared Player Values refresh subsystem changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          // Combined preview acceptance only: original isolated gates remain
          // mandatory on every other branch. No production authorization.
          if(process.env.HEAD_REF==='integration/verified-site-reconciliation-20261124'){
            const frozen='b58e76a0e5ebc01115a4a76bc269253a91dbf109',base='d18470cc44ab35841a65eee94bdd4391f15d4faa';
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','origin/main'),base,'Main moved; reconcile and re-audit');
            git('merge-base','--is-ancestor',frozen,'HEAD');
            const permitted=new Set([".github/workflows/release-v107-recorder-after-market-ui-isolated.yml",".github/workflows/release-v112-team-trade-linkage-ci.yml",".github/workflows/release-v114-historical-pick-projection-ci.yml",".github/workflows/release-v116-market-period-parity-ci.yml",".github/workflows/release-canonical-value-sync-isolated.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml"]);
            const delta=git('diff','--name-only',frozen,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(delta.length,permitted.size,'Exact reconciliation CI-only delta required');
            for(const p of delta)assert(permitted.has(p),'Audited application content changed: '+p);
            const expected=new Set([...git('diff','--name-only',base,frozen).split(String.fromCharCode(10)).filter(Boolean),...permitted]);
            const actual=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(actual.length,expected.size,'Combined audited inventory changed');
            for(const p of actual)assert(expected.has(p),'Unreviewed combined change: '+p);
            assert.equal(git('rev-parse','HEAD:netlify.toml'),git('rev-parse',frozen+':netlify.toml'),'Audited deployment gate must remain unchanged');
            console.log('Frozen 87-pass preview content verified; only six acceptance workflows differ. No production release granted.');
            process.exit(0);
          }
          const files=execFileSync('git',['diff','--name-only','origin/release/idp-v101-isolated-draft...HEAD'],{encoding:'utf8'}).trim().split(String.fromCharCode(10)).filter(Boolean);
          const allowed=new Set(["modeled-player-values-v319.js","nonblocking-consensus-v277.js","ui-player-values-v139.js","tests/model-v319-metadata-boot-guard.test.mjs","tests/canonical-live-values-refresh-isolated.test.mjs",".github/workflows/release-canonical-value-sync-isolated.yml" ,".github/workflows/release-idp-v101-isolated.yml"]);
          assert(files.length>0);
          for(const file of files)assert(allowed.has(file),'Out-of-scope subsystem: '+file);
          console.log('Canonical shared-price refresh source only:',files);
          JS
      - name: Install read-only Chromium to test existing site and Finder behavior
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rehearse current site with shared canonical price refresh, no external writes
        run: node scripts/rehearse-full-original-app-browser.mjs .
