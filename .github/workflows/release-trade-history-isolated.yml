name: Release candidate — Trade History original picks and canonical Hindsight (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/release-value-history-ui-isolated.yml'
      - 'value-history-v276.js'
      - 'tests/draft-pick-order-5050.test.mjs'
      - 'tests/trade-history-original-pick-projection.test.mjs'
      - 'tests/trade-history-ranked-unrostered-hindsight.test.mjs'
      - '.github/workflows/release-trade-history-isolated.yml'
permissions:
  contents: read
jobs:
  trade-history-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Trade History renderer syntax
        run: node --check value-history-v276.js
      - name: Install declared test dependencies only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund
      - name: Validate transaction-time pick projection, today-currency Hindsight and live trade refresh
        run: node --test tests/draft-pick-order-5050.test.mjs tests/trade-history-original-pick-projection.test.mjs tests/trade-history-ranked-unrostered-hindsight.test.mjs tests/trade-history-live-sleeper.test.mjs
      - name: Enforce Trade History-only release scope
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const files=execFileSync('git',['diff','--name-only','origin/release/value-history-ui-v108-isolated-draft...HEAD'],{encoding:'utf8'}).trim().split(String.fromCharCode(10)).filter(Boolean);
          const allowed=new Set([".github/workflows/release-value-history-ui-isolated.yml","value-history-v276.js","tests/draft-pick-order-5050.test.mjs","tests/trade-history-original-pick-projection.test.mjs","tests/trade-history-ranked-unrostered-hindsight.test.mjs",".github/workflows/release-trade-history-isolated.yml"]);
          assert(files.length===6);
          for(const file of files)assert(allowed.has(file),'Non-Trade-History subsystem modified: '+file);
          console.log('Trade History release only:',files);
          JS
      - name: Install isolated Chromium for full current-site smoke
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Rehearse live UI without outbound network or archive writes
        run: node scripts/rehearse-full-original-app-browser.mjs .
