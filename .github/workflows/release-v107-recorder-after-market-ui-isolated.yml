name: V107 history recorder after canonical Value History UI (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/value-history-headless-refresh.yml'
      - '.github/workflows/release-v107-recorder-after-market-ui-isolated.yml'
      - '.github/workflows/value-history-v107-scheduled-rollout.yml'
      - '.github/workflows/value-history-v107-shadow-acceptance.yml'
      - '.github/workflows/value-history-candidate-headless-acceptance.yml'
      - 'scripts/value-history-headless-refresh.mjs'
      - 'value-history-v276.js'
      - 'scripts/archive-value-history.mjs'
      - 'scripts/value-history-scheduled-due.mjs'
      - 'scripts/value-history-v107-shadow-acceptance.mjs'
      - 'tests/value-history-model-era-v90.test.mjs'
      - 'tests/value-history-v107-scheduled-promotion.test.mjs'
      - 'tests/value-history-candidate-headless-contract.test.mjs'
      - 'scripts/value-history-data-hub-v331-smoke.mjs'
permissions:
  contents: read
jobs:
  history-recorder-only:
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce exact history-writer-only change scope
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_REF"
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          // Combined preview acceptance only: original isolated gates remain
          // mandatory on every other branch. No production authorization.
          if(process.env.HEAD_REF==='integration/verified-site-reconciliation-20261124'){
            const frozen='b58e76a0e5ebc01115a4a76bc269253a91dbf109',base='d18470cc44ab35841a65eee94bdd4391f15d4faa';
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','origin/main'),base,'Main moved; reconcile and re-audit');
            git('merge-base','--is-ancestor',frozen,'HEAD');
            const permitted=new Set([".github/workflows/release-v107-recorder-after-market-ui-isolated.yml",".github/workflows/release-v112-team-trade-linkage-ci.yml",".github/workflows/release-v114-historical-pick-projection-ci.yml",".github/workflows/release-v116-market-period-parity-ci.yml",".github/workflows/release-canonical-value-sync-isolated.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml"]);
            const delta=git('diff','--name-only',frozen,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(delta.length,permitted.size,'Exact reconciliation CI-only delta required');
            for(const p of delta)assert(permitted.has(p),'Audited application content changed: '+p);
            const expected=new Set([...git('diff','--name-only',base,frozen).split(String.fromCharCode(10)).filter(Boolean),...permitted]);
            const actual=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(actual.length,expected.size,'Combined audited inventory changed');
            for(const p of actual)assert(expected.has(p),'Unreviewed combined change: '+p);
            assert.equal(git('rev-parse','HEAD:netlify.toml'),git('rev-parse',frozen+':netlify.toml'),'Audited deployment gate must remain unchanged');
            console.log('Frozen 87-pass preview content verified; only six acceptance workflows differ. No production release granted.');
            process.exit(0);
          }
          const paths=execFileSync('git',['diff','--name-only','origin/'+process.env.BASE_REF+'...HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([
            '.github/workflows/value-history-headless-refresh.yml',
            '.github/workflows/release-v107-recorder-after-market-ui-isolated.yml',
            '.github/workflows/value-history-v107-scheduled-rollout.yml',
            '.github/workflows/value-history-v107-shadow-acceptance.yml',
            '.github/workflows/value-history-candidate-headless-acceptance.yml',
            'scripts/value-history-headless-refresh.mjs',
            'scripts/archive-value-history.mjs',
            'scripts/value-history-scheduled-due.mjs',
            'scripts/value-history-v107-shadow-acceptance.mjs',
            'value-history-v276.js',
            'tests/value-history-model-era-v90.test.mjs',
            'tests/value-history-v107-scheduled-promotion.test.mjs',
            'tests/value-history-candidate-headless-contract.test.mjs',
            'scripts/value-history-data-hub-v331-smoke.mjs'
          ]);
          assert.equal(paths.length,allowed.size,'Unexpected history recorder file inventory: '+JSON.stringify(paths));
          for(const path of paths)assert(allowed.has(path),'Out-of-scope subsystem change '+path);
          console.log('Exact single-subsystem V107 recorder patch verified');
          JS
      - name: Validate browser, scheduler, history and archive scripts
        run: |
          node --check scripts/value-history-headless-refresh.mjs
          node --check scripts/value-history-scheduled-due.mjs
          node --check scripts/archive-value-history.mjs
          node --check scripts/value-history-v107-shadow-acceptance.mjs
          node --check value-history-v276.js
      - name: Model-era conservation, V96 default, explicit V101 approval, candidate no-write
        run: |
          node --test tests/value-history-v107-scheduled-promotion.test.mjs tests/value-history-model-era-v90.test.mjs tests/value-history-candidate-headless-contract.test.mjs
      - name: Verify archived snapshots remain immutable and collector rejects incomplete payloads
        run: |
          node --test tests/assess-archive-continuity.test.mjs
          node scripts/value-history-data-hub-v331-smoke.mjs
      # GitHub read-only; no scheduled writes or Netlify deploys in acceptance.
