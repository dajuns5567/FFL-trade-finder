name: V114 Original Trade Analysis historical pick slots (read-only)
on:
  pull_request:
    paths:
      - 'value-history-v276.js'
      - 'tests/trade-history-original-pick-projection-v114.test.mjs'
      - 'tests/draft-pick-order-5050.test.mjs'
      - '.github/workflows/release-v114-historical-pick-projection-ci.yml'
permissions:
  contents: read
jobs:
  original-pick:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical pick slot and original evaluator consistency
        run: |
          node --check value-history-v276.js
          node --check tests/trade-history-original-pick-projection-v114.test.mjs
          node --test tests/trade-history-original-pick-projection-v114.test.mjs tests/draft-pick-order-5050.test.mjs tests/trade-history-hindsight-live-sync.test.mjs tests/trade-history-live-sleeper.test.mjs
      - name: Keep original pick history fix isolated
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          // Exact preview-only combined candidate; legacy release checks remain unchanged elsewhere.
          if(process.env.GITHUB_HEAD_REF==='fix/presentation-consistency-20261125'){
            execFileSync('node',['scripts/audit-presentation-consistency-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='integration/verified-preview-653-ci-reconciliation-20261125'){
            execFileSync('node',['scripts/audit-verified-preview-653-continuation.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-home-market-navigation-20261125'){
            execFileSync('node',['scripts/audit-mobile-home-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-aligned-rows-touch-20261125'){
            execFileSync('node',['scripts/audit-mobile-aligned-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-clean-presentation-20261125'){
            execFileSync('node',['scripts/audit-mobile-clean-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-compact-all-views-20261125'){
            execFileSync('node',['scripts/audit-mobile-compact-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-paired-comparisons-20261125'){
            execFileSync('node',['scripts/audit-mobile-pairs-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/mobile-information-density-20261125'){
            execFileSync('node',['scripts/audit-mobile-density-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='fix/inquirer-daily-default-closed-20261125'){
            execFileSync('node',['scripts/audit-inquirer-closed-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          if(process.env.GITHUB_HEAD_REF==='integration/mobile-shared-regressions-20261125'){
            execFileSync('node',['scripts/audit-mobile-shared-preview-scope.mjs'],{stdio:'inherit'});
            process.exit(0);
          }
          // Combined preview acceptance only: original isolated gates remain
          // mandatory on every other branch. No production authorization.
          if(process.env.HEAD_REF==='integration/verified-site-reconciliation-20261124'){
            const frozen='b58e76a0e5ebc01115a4a76bc269253a91dbf109',base='d18470cc44ab35841a65eee94bdd4391f15d4faa';
            const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
            assert.equal(git('rev-parse','origin/main'),base,'Main moved; reconcile and re-audit');
            git('merge-base','--is-ancestor',frozen,'HEAD');
            const permitted=new Set([".github/workflows/release-v107-recorder-after-market-ui-isolated.yml",".github/workflows/release-v112-team-trade-linkage-ci.yml",".github/workflows/release-v114-historical-pick-projection-ci.yml",".github/workflows/release-v116-market-period-parity-ci.yml",".github/workflows/release-canonical-value-sync-isolated.yml",".github/workflows/netlify-v101-one-time-release-gate-ci.yml"]);
            const delta=git('diff','--name-only',frozen,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(delta.length,permitted.size,'Exact reconciliation CI-only delta required');
            for(const p of delta)assert(permitted.has(p),'Audited application content changed: '+p);
            const expected=new Set([...git('diff','--name-only',base,frozen).split(String.fromCharCode(10)).filter(Boolean),...permitted]);
            const actual=git('diff','--name-only',base,'HEAD').split(String.fromCharCode(10)).filter(Boolean);
            assert.equal(actual.length,expected.size,'Combined audited inventory changed');
            for(const p of actual)assert(expected.has(p),'Unreviewed combined change: '+p);
            assert.equal(git('rev-parse','HEAD:netlify.toml'),git('rev-parse',frozen+':netlify.toml'),'Audited deployment gate must remain unchanged');
            console.log('Frozen 87-pass preview content verified; only six acceptance workflows differ. No production release granted.');
            process.exit(0);
          }
          const paths=execFileSync('git',['diff','--name-only','origin/main...HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['value-history-v276.js','tests/draft-pick-order-5050.test.mjs','tests/trade-history-original-pick-projection-v114.test.mjs','.github/workflows/release-v114-historical-pick-projection-ci.yml']);
          assert(paths.length===allowed.size,'Unreviewed historical pick release file inventory');
          for(const path of paths)assert(allowed.has(path),'Unrelated subsystem changed: '+path);
          JS
      # Read-only tests only. No archive write or production deployment.
