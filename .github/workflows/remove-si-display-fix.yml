name: Remove SI display fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-si-display-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update displayed consensus total and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '${consensusCount}/9'
          new = '${consensusCount}/8'
          if old not in s:
              raise SystemExit('Expected /9 status marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/remove-si-display-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update consensus display total to eight'
          git push origin main
