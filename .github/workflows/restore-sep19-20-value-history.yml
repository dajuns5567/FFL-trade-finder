name: Restore Sep 19-20 Value History

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: value-history-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact Sep 19-20 page-load snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const url='https://deploy-preview-385--precious-stroopwafel-196eae.netlify.app/.netlify/functions/value-history?archive_export=1';
          const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
          if(!r.ok)throw new Error('Recovery export '+r.status+': '+(await r.text()).slice(0,1000));
          const payload=await r.json();
          const wanted=(payload.snapshots||[]).filter(s=>{
            const t=String(s?.t||''),source=String(s?.source||'page-load').toLowerCase();
            return /^2026-09-(19|20)T/.test(t)&&source!=='scheduled'&&Array.isArray(s?.rows)&&s.rows.length>=100;
          }).sort((a,b)=>String(a.t).localeCompare(String(b.t)));
          if(!wanted.length)throw new Error('No recoverable Sep 19-20 page-load snapshots found');

          const indexPath='value-history/index.json';
          const index=JSON.parse(fs.readFileSync(indexPath,'utf8'));
          const byT=new Map((index.items||[]).map(x=>[String(x.t),x]));
          const safeName=t=>String(t).replace(/[:.]/g,'-');

          for(const snap of wanted){
            const t=String(snap.t),p='value-history/snapshots/2026/09/'+safeName(t)+'.json';
            fs.mkdirSync(path.dirname(p),{recursive:true});
            fs.writeFileSync(p,JSON.stringify(snap,null,2)+'\n');
            byT.set(t,{
              t,
              path:p,
              fingerprint:snap.fingerprint||null,
              count:snap.rows.length,
              source:snap.source||'page-load'
            });
          }

          const items=[...byT.values()].filter(x=>!/^2026-09-(08|09)T/.test(String(x.t))).sort((a,b)=>String(a.t).localeCompare(String(b.t)));
          index.items=items;
          index.snapshot_count=items.length;
          index.tracking_since=items[0]?.t||null;
          index.latest=items.at(-1)?.t||null;
          index.months=['2026-09'];
          fs.writeFileSync(indexPath,JSON.stringify(index,null,2)+'\n');

          const snaps=[];
          for(const item of items){
            if(!item?.path||!fs.existsSync(item.path))continue;
            const snap=JSON.parse(fs.readFileSync(item.path,'utf8'));
            if(/^2026-09-(08|09)T/.test(String(snap?.t||'')))continue;
            snaps.push(snap);
          }
          snaps.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
          fs.mkdirSync('value-history/months',{recursive:true});
          fs.writeFileSync('value-history/months/2026-09.json',JSON.stringify({
            schema_version:1,
            league_id:String(index.league_id||'1316867686394769408'),
            month:'2026-09',
            snapshots:snaps
          },null,2)+'\n');

          const last=items.at(-1)||null;
          fs.writeFileSync('value-history/latest.json',JSON.stringify({
            schema_version:1,
            league_id:String(index.league_id||'1316867686394769408'),
            latest:last?{
              t:last.t,
              path:last.path,
              fingerprint:last.fingerprint||null,
              count:last.count||null,
              source:Object.prototype.hasOwnProperty.call(last,'source')?last.source:null
            }:null
          },null,2)+'\n');

          const restored=wanted.map(s=>({t:s.t,source:s.source||'page-load',fingerprint:s.fingerprint||null,count:s.rows.length}));
          console.log(JSON.stringify({restored_count:restored.length,restored,index_count:items.length,tracking_since:index.tracking_since,latest:index.latest},null,2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add value-history
          git diff --cached --quiet && { echo "No recovery changes"; exit 0; }
          git commit -m "Restore Sep 19-20 page-load Value History snapshots"
          git push origin HEAD:value-history-data
