name: Run one-time production IDP history maintenance

on:
  push:
    branches:
      - main
    paths:
      - 'netlify/functions/idp-history-live-scrub.mjs'
      - '.github/workflows/run-one-time-idp-history-scrub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run maintenance and verify result
        shell: bash
        run: |
          set -euo pipefail
          URL='https://inspiring-bombolone-be4489.netlify.app/.netlify/functions/idp-history-live-scrub?confirm=maintenance-20260922-0345z'
          rm -f /tmp/maintenance-result.json
          for i in $(seq 1 120); do
            CODE=$(curl -L -sS -o /tmp/maintenance-result.json -w '%{http_code}' "$URL" || true)
            echo "attempt=$i status=$CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/maintenance-result.json
              node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/maintenance-result.json','utf8'));if(r.ok!==true)throw new Error('not ok');if(Number(r.remainingPreCutoffIdpRows)!==0)throw new Error('verification failed');if(Number(r.offenseRowsBefore)!==Number(r.offenseRowsAfter))throw new Error('row preservation failed');if(Number(r.verifiedOffenseRows)!==Number(r.offenseRowsBefore))throw new Error('row verification failed');console.log(JSON.stringify(r,null,2));"
              exit 0
            fi
            sleep 10
          done
          echo "Maintenance endpoint never became ready" >&2
          cat /tmp/maintenance-result.json || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-time-maintenance-result
          path: /tmp/maintenance-result.json
          if-no-files-found: warn
