name: Run one-time production IDP history scrub

on:
  push:
    branches:
      - main
    paths:
      - 'netlify/functions/idp-history-live-scrub.mjs'
      - '.github/workflows/run-one-time-idp-history-scrub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production function, execute scrub, and verify
        shell: bash
        run: |
          set -euo pipefail
          URL='https://inspiring-bombolone-be4489.netlify.app/.netlify/functions/idp-history-live-scrub?confirm=delete-idp-before-20260921-2345-et'
          rm -f /tmp/idp-live-scrub.json
          for i in $(seq 1 120); do
            CODE=$(curl -L -sS -X POST -o /tmp/idp-live-scrub.json -w '%{http_code}' "$URL" || true)
            echo "attempt=$i status=$CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/idp-live-scrub.json
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const r=JSON.parse(fs.readFileSync('/tmp/idp-live-scrub.json','utf8'));
              if(r?.ok!==true)throw new Error('scrub endpoint did not report ok');
              if(Number(r?.remainingPreCutoffIdpRows)!==0)throw new Error('pre-cutoff IDP rows remain');
              if(Number(r?.offenseRowsBefore)!==Number(r?.offenseRowsAfter))throw new Error('offensive player rows changed');
              if(Number(r?.verifiedOffenseRows)!==Number(r?.offenseRowsBefore))throw new Error('offensive player verification mismatch');
              console.log(JSON.stringify({verified:true,report:r},null,2));
              NODE
              exit 0
            fi
            sleep 10
          done
          echo "Production scrub endpoint never became ready" >&2
          cat /tmp/idp-live-scrub.json || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-time-production-idp-history-scrub
          path: /tmp/idp-live-scrub.json
          if-no-files-found: warn
