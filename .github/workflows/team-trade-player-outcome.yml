name: Trade-linked player outcome parity
on:
  pull_request:
    paths:
      - 'value-history-v276.js'
      - 'tests/team-trade-player-outcome.test.mjs'
      - '.github/workflows/team-trade-player-outcome.yml'
permissions:
  contents: read
jobs:
  outcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check value-history-v276.js
      - run: node --test tests/team-trade-player-outcome.test.mjs tests/value-history-team-trade-linkage-v112.test.mjs
