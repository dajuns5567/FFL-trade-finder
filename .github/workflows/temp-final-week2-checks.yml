name: Temporary Week 2 final checks

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/temp-final-week2-checks.yml'

permissions:
  contents: read

jobs:
  verify-week2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inquirer-editorial-depth-r5
          fetch-depth: 0
      - name: Verify frozen Week 1 preload
        run: |
          git diff 5a744346d87a818900521d21b1f7bcaf9136a2e6...HEAD -- netlify/functions/inquirer-week1-2026-preload.mjs
          test -z "$(git diff 5a744346d87a818900521d21b1f7bcaf9136a2e6...HEAD -- netlify/functions/inquirer-week1-2026-preload.mjs)"
          test "$(git rev-parse HEAD:netlify/functions/inquirer-week1-2026-preload.mjs)" = "69c5e5e6abadb853630a5576b74824a40d65ebe2"
          echo "Week 1 preload diff from handoff baseline: clean"
      - name: Run maintained Inquirer smoke tests
        run: |
          node scripts/inquirer-reporters-smoke.mjs
          node --input-type=module <<'NODE'
          import week1 from './netlify/functions/inquirer-week1-2026-preload.mjs';
          import week2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          assert(week1?.season===2026&&week1?.week===1,'Week 1 preload import failed');
          assert(week1?.published_locked===true,'Week 1 preload must remain locked');
          assert(Array.isArray(week1?.teams)&&week1.teams.length===32,'Week 1 preload must contain 32 teams');
          assert(week2?.season===2026&&week2?.week===2,'Week 2 preload import failed');
          assert(week2?.published_locked===true,'Week 2 preload must be locked');
          assert(Number(week2?.inquirer_version)===26&&Number(week2?.editorial_revision)===6,'Week 2 preload version mismatch');
          assert(Array.isArray(week2?.teams)&&week2.teams.length===32,'Week 2 preload must contain 32 teams');
          assert(week2.teams.every(t=>t?.inquirer_article?.headline&&Array.isArray(t?.inquirer_article?.sections)&&t.inquirer_article.sections.length>=8),'Week 2 preload contains incomplete team article');
          assert(Array.isArray(week2?.league_overview?.sections)&&week2.league_overview.sections.length===4,'Week 2 preload must contain four recap desks');
          console.log(JSON.stringify({ok:true,week1_teams:week1.teams.length,week2_teams:week2.teams.length,week2_version:week2.inquirer_version,week2_revision:week2.editorial_revision}));
          NODE
