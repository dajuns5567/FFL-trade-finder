name: Temporary Week 2 final checks

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/temp-final-week2-checks.yml'

permissions:
  contents: read

jobs:
  verify-week2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inquirer-editorial-depth-r5
          fetch-depth: 0
      - name: Verify frozen Week 1 preload
        run: |
          git diff 5a744346d87a818900521d21b1f7bcaf9136a2e6...HEAD -- netlify/functions/inquirer-week1-2026-preload.mjs
          test -z "$(git diff 5a744346d87a818900521d21b1f7bcaf9136a2e6...HEAD -- netlify/functions/inquirer-week1-2026-preload.mjs)"
          test "$(git rev-parse HEAD:netlify/functions/inquirer-week1-2026-preload.mjs)" = "69c5e5e6abadb853630a5576b74824a40d65ebe2"
          echo "Week 1 preload diff from handoff baseline: clean"
      - name: Run preload smoke test
        run: node scripts/inquirer-preload-smoke-test.mjs
