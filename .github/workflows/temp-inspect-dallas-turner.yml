name: Temporary Dallas Turner and Nakobe Dean Week 2 inspection

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/temp-inspect-dallas-turner.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inquirer-editorial-depth-r5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Generate current Week 2
        env:
          OUT: /tmp/week2-inquirer.json
        run: node scripts/one-time-generate-inquirer-week2.mjs
      - name: Inspect Dallas Turner and Nakobe Dean
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('/tmp/week2-inquirer.json','utf8'));
          const found=[];
          const seen=new Set();
          for(const t of d.teams||[]){
            const pools=[
              ...(t.starter_details||[]).map(p=>({where:'starter',p,owner:t.team_name})),
              ...(t.opponent_roster?.players||[]).map(p=>({where:'opponent_roster',p,owner:p.current_fantasy_team_name||null})),
              ...(t.next_opponent_roster?.players||[]).map(p=>({where:'next_opponent_roster',p,owner:p.current_fantasy_team_name||null}))
            ];
            for(const x of pools){
              if(!/(?:Dallas Turner and Nakobe Dean|Nakobe Dean)/i.test(String(x.p?.name||'')))continue;
              const key=String(x.p.id)+'|'+String(x.owner||'');
              if(seen.has(key))continue;seen.add(key);
              found.push({where:x.where,owner:x.owner,team_article:t.team_name,player:x.p});
            }
          }
          const mentions=(d.teams||[]).filter(t=>/(?:Dallas Turner and Nakobe Dean|Nakobe Dean)/i.test((t.inquirer_article?.paragraphs||[]).join(' '))).map(t=>({team:t.team_name,reporter:t.inquirer_article?.reporter?.name,paragraphs:(t.inquirer_article?.paragraphs||[]).filter(p=>/(?:Dallas Turner and Nakobe Dean|Nakobe Dean)/i.test(String(p)))}));
          console.log(JSON.stringify({found,mentions,hot_takes:(d.league_overview?.hot_takes||[]).filter(x=>/(?:Dallas Turner and Nakobe Dean|Nakobe Dean)/i.test(String(x.title)+' '+String(x.take)))},null,2));
          NODE
