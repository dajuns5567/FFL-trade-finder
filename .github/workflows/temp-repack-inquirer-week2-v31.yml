name: Temporary repack Week 2 Inquirer V31

on:
  push:
    branches:
      - inquirer-editorial-depth-r5
    paths:
      - '.github/workflows/temp-repack-inquirer-week2-v31.yml'

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inquirer-editorial-depth-r5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Generate exact Week 2 V31
        env:
          OUT: /tmp/week2-inquirer-v31.json
        run: node scripts/one-time-generate-inquirer-week2.mjs
      - name: Full edition audit
        run: node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-v31.json
      - name: Deep editorial audit
        run: node scripts/inquirer-week2-deep-editorial-audit.mjs /tmp/week2-inquirer-v31.json --out /tmp/week2-deep.md --json /tmp/week2-deep.json --strict
      - name: Pack audited preload
        run: node scripts/pack-inquirer-preload.mjs /tmp/week2-inquirer-v31.json netlify/functions/inquirer-week2-2026-preload.mjs
      - name: Commit preload only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week2-2026-preload.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repack audited Week 2 Inquirer V31 preload"
          git push origin HEAD:inquirer-editorial-depth-r5
