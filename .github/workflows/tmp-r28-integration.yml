name: Temporary R28 integration verifier

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - '.github/workflows/tmp-r28-integration.yml'
      - 'scripts/tmp-r28-integration.py'
      - 'netlify/functions/inquirer-week2-editorial-r28.mjs'

permissions:
  contents: write

jobs:
  verify-r28:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply R28 integration patch
        run: python scripts/tmp-r28-integration.py
      - name: Syntax check R28 and integration files
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r28.mjs
          node --check scripts/inquirer-week2-r23-smoke.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
          node --check netlify/functions/league-hub.mjs
      - name: Run prior Week 2 regressions
        run: |
          node scripts/inquirer-week2-r20-smoke.mjs
          node scripts/inquirer-week2-r21-smoke.mjs
          node scripts/inquirer-week2-r22-smoke.mjs
      - name: Capture R28 all-32 natural-language regression
        run: |
          set +e
          node scripts/inquirer-week2-r23-smoke.mjs > /tmp/r28-smoke.log 2>&1
          code=$?
          echo "$code" > /tmp/r28-smoke.exit
          cat /tmp/r28-smoke.log
          exit 0
      - name: Upload R28 smoke diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: r28-smoke-diagnostic
          path: |
            /tmp/r28-smoke.log
            /tmp/r28-smoke.exit
          retention-days: 2
      - name: Enforce R28 all-32 natural-language regression
        run: |
          cat /tmp/r28-smoke.log
          test "$(cat /tmp/r28-smoke.exit)" = "0"
      - name: Materialize R28 and run full generated audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import rawWeek2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r28.mjs';
          const week2=applyWeek2EditorialR16(rawWeek2);
          if(Number(week2?.editorial_revision)!==28||week2?.voice_revision!=='week2-r28') throw new Error('R28 did not materialize');
          fs.writeFileSync('/tmp/week2-r28.json',JSON.stringify(week2,null,2)+'\n');
          NODE
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-r28.json
      - name: Commit verified non-workflow R28 integration
        run: |
          git checkout -- .github/workflows/inquirer-editorial-r5-smoke.yml .github/workflows/tmp-r28-integration.yml
          rm -f scripts/tmp-r28-integration.py
          git config user.name 'fleeced-r28-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add netlify/functions/league-hub.mjs scripts/inquirer-week2-r23-smoke.mjs scripts/inquirer-v25-generated-audit.mjs scripts/tmp-r28-integration.py
          git commit -m 'Wire verified R28 Week 2 editorial cleanup'
          git push origin HEAD:player-signal-layer-r1
