name: Trade History ranked free-agent Hindsight consistency
on:
  pull_request:
    paths:
      - 'value-history-v276.js'
      - 'tests/trade-history-ranked-unrostered-hindsight.test.mjs'
      - 'tests/trade-history-original-pick-projection.test.mjs'
      - 'tests/trade-history-hindsight-live-sync.test.mjs'
      - '.github/workflows/trade-history-hindsight-consistency.yml'
  push:
    branches:
      - fix/trade-history-ranked-unrostered-hindsight
permissions:
  contents: read
jobs:
  hindsight-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and Hindsight/History regression contracts
        run: |
          node --check value-history-v276.js
          node --test tests/trade-history-original-pick-projection.test.mjs tests/trade-history-ranked-unrostered-hindsight.test.mjs tests/trade-history-hindsight-live-sync.test.mjs tests/trade-history-live-sleeper.test.mjs tests/value-history-all-time-milestones.test.mjs tests/value-history-dense-charts.test.mjs
