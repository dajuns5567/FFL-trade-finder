name: V102 local browser full-player parity (private preview protected)
on:
  pull_request:
    paths:
      - 'scripts/audit-preview-canonical-currency-v102.mjs'
      - '.github/workflows/v102-deploy-preview-canonical-parity.yml'
      - 'modeled-player-values-v319.js'
      - 'value-history-v276.js'
      - 'nonblocking-consensus-v277.js'
      - 'ui-player-values-v139.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-full-player-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm private Netlify protection remains unmodified
        run: |
          node --check scripts/audit-preview-canonical-currency-v102.mjs
          node --check scripts/value-history-headless-refresh.mjs
          test -f valuation-idp-v25-perf.js
      - name: Pin verified Sleeper regular-season source input
        run: |
          SHA="$(git ls-remote origin refs/heads/sleeper-data | cut -f1)"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "V100_SLEEPER_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Set up local temporary headless browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Keep actual V102 consumer code, adapt only local history-model verification
        run: |
          # This local-only collector accepts only V96 IDs. Its temporary
          # V101 alias is not deployed, archived, or used outside this runner.
          # Preserve every actual V102 live market and history function.
          grep -q "const V101_PREVIEW_VALUATION_MODEL='idp-v101-verified-role-growth-v100-source-free-lineage'" value-history-v276.js
          sed -i 's/idp-v101-verified-role-growth-v100-source-free-lineage/idp-v96-single-source-continuous-v95-evidence/' value-history-v276.js
          node --check value-history-v276.js
      - name: Validate all canonical Player Values through live local browser consumers
        env:
          VALUE_HISTORY_SOURCE_COMMIT: '4d276527c6e7a724de55e4a7fd2c167887fa3ea8'
          VALUE_HISTORY_SNAPSHOT_FILE: '.tmp/v102-local-unpublished-parity.json'
        run: node scripts/value-history-headless-refresh.mjs
      - name: Enforce full-population consumer parity without archiving data
        run: |
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import assert from 'node:assert/strict';
            const r=JSON.parse(readFileSync('.tmp/v102-local-unpublished-parity.json','utf8'));
            assert.ok(r.rows.length>=1000,'Incomplete canonical Player Values population');
            assert.ok(r.picks.length>=96,'Incomplete current draft pick population');
            assert.equal(r.teams.length,32);
            assert.equal(r.provenance.canonical_parity,'exact','Finder/Evaluator/Value History mismatch');
            assert.ok(r.provenance.consensus_sources>=7);
            console.log(JSON.stringify({contract:'V102 local current-value consumers parity, NOT historical V96 archive',players:r.rows.length,picks:r.picks.length,teams:r.teams.length,parity:r.provenance.canonical_parity,consensusSources:r.provenance.consensus_sources,archiveWrites:false}));
          "
          rm -f .tmp/v102-local-unpublished-parity.json
