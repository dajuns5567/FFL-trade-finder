name: Regenerate V258 compiled runtimes
on:
  push:
    branches: [v258-search-dedupe]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  compile:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v258-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v258-search-dedupe
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/compile-v256-runtimes.cjs
      - run: node --check trade-finder-v256-compiled.js && node --check trade-runtime-v256-compiled.js
      - name: Commit generated runtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade-finder-v256-compiled.js trade-runtime-v256-compiled.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V258: generate fully flattened runtimes [v258-generated]"
          git push origin HEAD:v258-search-dedupe
