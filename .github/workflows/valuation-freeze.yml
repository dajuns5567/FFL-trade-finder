name: Valuation calculation freeze

on:
  pull_request:
  push:
    branches: [main]

jobs:
  valuation-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify frozen valuation calculations
        run: node scripts/check-valuation-freeze.mjs
