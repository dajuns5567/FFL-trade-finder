name: Archive Value History

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: value-history-durable-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install archive runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve latest production Netlify site for main
        id: active_site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_BLOBS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VALUE_HISTORY_DEPLOY_BRANCH: main
        run: node scripts/resolve-active-netlify-site.mjs

      - name: Report unavailable current Netlify live buffer
        if: steps.active_site.outputs.matched_target_sha != 'true'
        run: |
          echo "Current main is not deployed to a Netlify site accessible to this token."
          echo "Skipping live Netlify Blob ingestion; scheduled GitHub-native history remains unaffected."

      - name: Archive new Value History snapshots
        if: steps.active_site.outputs.matched_target_sha == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.active_site.outputs.site_id }}
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN || secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_BLOBS_TOKEN }}
          VALUE_HISTORY_SOURCE_URL: ${{ steps.active_site.outputs.site_url }}.netlify/functions/value-history
        run: node scripts/archive-value-history.mjs
