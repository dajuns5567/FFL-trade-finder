name: Archive Value History

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: value-history-durable-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install archive runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve latest production Netlify site for main
        id: active_site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VALUE_HISTORY_DEPLOY_BRANCH: main
          VALUE_HISTORY_PRODUCTION_SITE_ID: 'b1a7f3c4-7c1c-4a5b-8d5f-01fa768b9323'
        run: node scripts/resolve-active-netlify-site.mjs

      - name: Report production commit drift without blocking authenticated archival
        if: steps.active_site.outputs.matched_target_sha != 'true'
        run: echo '::notice::GitHub main is ahead of the verified deployed production commit; ingesting the pinned production site read-only anyway.'

      - name: Archive new Value History snapshots
        if: steps.active_site.outputs.site_id == 'b1a7f3c4-7c1c-4a5b-8d5f-01fa768b9323'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.active_site.outputs.site_id }}
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VALUE_HISTORY_SOURCE_URL: ${{ steps.active_site.outputs.site_url }}.netlify/functions/value-history
        run: node scripts/archive-value-history.mjs
