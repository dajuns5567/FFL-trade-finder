name: Scheduled Value History Browser Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_run:
    workflows:
      - Archive Value History
      - Import Sleeper League History
      - Sync MIDA team context
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: value-history-durable-write
  cancel-in-progress: false

# No V101 activation is authorized in this draft. Even if this workflow
# eventually lands on main, V96 remains the default until BOTH explicit
# repository variables are set following release approval. No production
# Netlify deploy is involved in the scheduled history workflow.
env:
  VALUE_HISTORY_SCHEDULED_MODEL: ${{ vars.FFL_HISTORY_SCHEDULED_MODEL || 'idp-v96-single-source-continuous-v95-evidence' }}
  VALUE_HISTORY_V101_APPROVED: ${{ vars.FFL_HISTORY_V101_APPROVED || '0' }}

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trade ingestion runs on EVERY scheduled/workflow wake, even when
      # Value History has no new valuation snapshot due. It is read-only.
      - name: Check current Sleeper completed trades
        run: node scripts/trade-history-scheduled-check.mjs

      - name: Check whether scheduled history is due
        id: due
        env:
          VALUE_HISTORY_DUE_MINUTES: '165'
          VALUE_HISTORY_STALE_MINUTES: '240'
          # First explicitly approved V101 run is due immediately even when
          # V96 has a fresh entry; subsequent runs use usual 165/240 minutes.
          VALUE_HISTORY_EXPECTED_MODEL: ${{ vars.FFL_HISTORY_V101_APPROVED == '1' && vars.FFL_HISTORY_SCHEDULED_MODEL == 'idp-v101-verified-role-growth-v100-source-free-lineage' && 'idp-v101-verified-role-growth-v100-source-free-lineage' || '' }}
          FORCE_SCHEDULED_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/value-history-scheduled-due.mjs

      - name: Report healthy scheduled history
        if: steps.due.outputs.due != 'true'
        run: |
          echo "Scheduled Value History is current."
          echo "Wake event: ${{ github.event_name }}"
          echo "Trigger workflow: ${{ github.event.workflow_run.name || 'n/a' }}"
          echo "Last scheduled point: ${{ steps.due.outputs.last_scheduled }}"
          echo "Age (minutes): ${{ steps.due.outputs.age_minutes }}"

      - name: Install browser runtime
        if: steps.due.outputs.due == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate requested model activation before any browser refresh
        if: steps.due.outputs.due == 'true'
        run: |
          node --check scripts/value-history-headless-refresh.mjs
          node --check scripts/archive-value-history.mjs
          # V101 fails closed unless verified on main with a pinned audited
          # source blob, seven publishers, Sleeper and canonical price parity.
          if [ "$VALUE_HISTORY_SCHEDULED_MODEL" != 'idp-v96-single-source-continuous-v95-evidence' ] &&
             [ "$VALUE_HISTORY_V101_APPROVED" != '1' ]; then
            echo 'V101 scheduled writing not explicitly approved' >&2; exit 1
          fi

      - name: Run current main locally and record scheduled observation
        if: steps.due.outputs.due == 'true'
        env:
          VALUE_HISTORY_SNAPSHOT_FILE: .tmp/value-history-scheduled.json
        run: node scripts/value-history-headless-refresh.mjs

      - name: Persist scheduled observation directly to durable Value History archive
        if: steps.due.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUE_HISTORY_SNAPSHOT_FILE: .tmp/value-history-scheduled.json
        run: node scripts/archive-value-history.mjs
