name: Scheduled Value History Browser Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_run:
    workflows:
      - Archive Value History
      - Import Sleeper League History
      - Sync MIDA team context
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: value-history-durable-write
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Scheduled workflows are defined on main, but pricing must be collected
      # from the exact fully accepted V96/PR499 valuation source. A mutable branch is
      # not safe: future preview changes must undergo acceptance and explicit
      # pin update before any scheduled historical writes.
      - uses: actions/checkout@v4
        with:
          ref: '4d276527c6e7a724de55e4a7fd2c167887fa3ea8'

      - name: Verify pinned valuation release for scheduled capture
        run: test "$(git rev-parse HEAD)" = '4d276527c6e7a724de55e4a7fd2c167887fa3ea8'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trade ingestion runs on EVERY scheduled/workflow wake, even when
      # Value History has no new valuation snapshot due. It is read-only.
      - name: Check current Sleeper completed trades
        run: node scripts/trade-history-scheduled-check.mjs

      - name: Check whether scheduled history is due
        id: due
        env:
          VALUE_HISTORY_DUE_MINUTES: '165'
          VALUE_HISTORY_STALE_MINUTES: '240'
          FORCE_SCHEDULED_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/value-history-scheduled-due.mjs

      - name: Report healthy scheduled history
        if: steps.due.outputs.due != 'true'
        run: |
          echo "Scheduled Value History is current."
          echo "Wake event: ${{ github.event_name }}"
          echo "Trigger workflow: ${{ github.event.workflow_run.name || 'n/a' }}"
          echo "Last scheduled point: ${{ steps.due.outputs.last_scheduled }}"
          echo "Age (minutes): ${{ steps.due.outputs.age_minutes }}"

      - name: Install browser runtime
        if: steps.due.outputs.due == 'true'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run pinned V96 source locally and record scheduled observation
        if: steps.due.outputs.due == 'true'
        env:
          VALUE_HISTORY_SNAPSHOT_FILE: .tmp/value-history-scheduled.json
          VALUE_HISTORY_SOURCE_COMMIT: '4d276527c6e7a724de55e4a7fd2c167887fa3ea8'
        run: node scripts/value-history-headless-refresh.mjs

      - name: Reject mismatched valuation models, provenance or incomplete snapshots
        if: steps.due.outputs.due == 'true'
        env:
          EXPECTED_SOURCE_COMMIT: '4d276527c6e7a724de55e4a7fd2c167887fa3ea8'
        run: |
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import assert from 'node:assert/strict';
            const s=JSON.parse(readFileSync('.tmp/value-history-scheduled.json','utf8'));
            assert.equal(s.league,'1316867686394769408');
            assert.equal(s.source,'scheduled');
            assert.equal(s.valuation_contract,'precision-idp-runtime-20260919');
            assert.equal(s.valuation_model,'idp-v96-single-source-continuous-v95-evidence');
            assert.equal(s.provenance?.git_commit,process.env.EXPECTED_SOURCE_COMMIT);
            assert.equal(s.provenance?.canonical_parity,'exact');
            assert.ok(Number(s.provenance?.consensus_sources)>=7);
            assert.ok(Array.isArray(s.rows)&&s.rows.length>=700);
            assert.ok(Array.isArray(s.picks)&&s.picks.length>=96);
            assert.ok(Array.isArray(s.teams)&&s.teams.length===32);
            assert.ok(s.rows.every(r=>Number.isFinite(Number(r.value))&&Number.isFinite(Number(r.overall))));
            assert.ok(Number.isFinite(Date.parse(s.t))&&Math.abs(Date.now()-Date.parse(s.t))<30*60000);
            console.log(JSON.stringify({verified:true,source:s.provenance.git_commit,model:s.valuation_model,rows:s.rows.length,picks:s.picks.length,teams:s.teams.length}));
          "

      - name: Persist scheduled observation directly to durable Value History archive
        if: steps.due.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUE_HISTORY_SNAPSHOT_FILE: .tmp/value-history-scheduled.json
        run: node scripts/archive-value-history.mjs
