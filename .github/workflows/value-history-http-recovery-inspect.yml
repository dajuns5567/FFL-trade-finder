name: Value History HTTP Recovery Inspect

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect preview Value History export
        run: |
          node --input-type=module <<'NODE'
          const url='https://inspiring-bombolone-be4489.netlify.app/.netlify/functions/value-history?archive_export=1';
          const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
          console.log('status',r.status);
          const text=await r.text();
          if(!r.ok){console.log(text.slice(0,2000));process.exit(1)}
          const j=JSON.parse(text),rows=(j.snapshots||[]).filter(s=>{
            const ms=Date.parse(String(s?.t||''));
            return Number.isFinite(ms)&&ms>=Date.parse('2026-09-19T22:01:38.323Z')&&ms<Date.parse('2026-09-21T04:00:00.000Z');
          }).map(s=>({t:s.t,source:s.source||'page-load',fingerprint:s.fingerprint||'',count:Array.isArray(s.rows)?s.rows.length:0,valuation_contract:s.valuation_contract||null}));
          console.log(JSON.stringify({source:j.source||null,total:j.snapshot_count||0,matching:rows.length,rows},null,2));
          NODE
