name: Value History Public Recovery Inspect

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify active preview history sources
        run: |
          node --input-type=module <<'NODE'
          const base='https://deploy-preview-385--inspiring-bombolone-be4489.netlify.app/.netlify/functions/value-history';
          for(const [label,suffix] of [['health','?health=1'],['live','?archive_export=1']]){
            const r=await fetch(base+suffix,{headers:{accept:'application/json'},cache:'no-store'});
            console.log(label,'status',r.status);
            const text=await r.text();
            if(!r.ok){console.log(text.slice(0,2000));continue}
            const j=JSON.parse(text);
            if(label==='health')console.log(JSON.stringify(j,null,2));
            else console.log(JSON.stringify({
              source:j.source||null,
              snapshot_count:j.snapshot_count||0,
              snapshots:(j.snapshots||[]).map(s=>({t:s.t,source:s.source||'page-load',fingerprint:s.fingerprint||'',count:Array.isArray(s.rows)?s.rows.length:0}))
            },null,2));
          }
          NODE
