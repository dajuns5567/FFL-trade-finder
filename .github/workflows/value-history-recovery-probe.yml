name: Value History Recovery Probe

on:
  push:
    branches:
      - release/precision-idp-runtime-20260919

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Blob runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Read-only probe of historical Value History buffers
        env:
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node scripts/value-history-recovery-probe.mjs
