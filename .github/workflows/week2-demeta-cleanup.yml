name: Week 2 meta-language cleanup

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - .github/workflows/week2-demeta-cleanup.yml
      - scripts/tmp-week2-demeta-cleanup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/tmp-week2-demeta-cleanup.py
      - name: Check syntax and Week 2 voice regression
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r15.mjs
          node --check scripts/inquirer-week2-voice-r15-smoke.mjs
          node scripts/inquirer-week2-voice-r15-smoke.mjs
      - name: Commit cleanup and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/week2-demeta-cleanup.yml scripts/tmp-week2-demeta-cleanup.py
          git add netlify/functions/inquirer-week2-editorial-r15.mjs scripts/inquirer-week2-voice-r15-smoke.mjs
          git diff --cached --check
          git commit -m "Remove residual Week 2 newsroom meta language"
          git push origin HEAD:player-signal-layer-r1
