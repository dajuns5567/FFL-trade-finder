name: Week 2 meta cleanup grammar fix

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - .github/workflows/week2-demeta-grammar-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
          fetch-depth: 0
      - name: Fix alias-safe grammar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/inquirer-week2-editorial-r15.mjs')
          s=p.read_text()
          old="tm+' has already given supporters enough confidence to make several irresponsible predictions.'"
          new="'Supporters around '+tm+' already have enough confidence to make several irresponsible predictions.'"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          node --check netlify/functions/inquirer-week2-editorial-r15.mjs
          node scripts/inquirer-week2-voice-r15-smoke.mjs
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/week2-demeta-grammar-fix.yml
          git add netlify/functions/inquirer-week2-editorial-r15.mjs
          git diff --cached --check
          git commit -m "Fix Week 2 team alias grammar"
          git push origin HEAD:player-signal-layer-r1
