name: Week 2 editorial core cleanup

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - .github/workflows/week2-editorial-core-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/tmp-week2-core-cleanup.py
      - name: Check syntax
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r15.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week2-editorial-r15.mjs scripts/inquirer-v25-generated-audit.mjs
          git diff --cached --check
          git commit -m "Remove robotic Week 2 suffix diversification"
          git push origin HEAD:player-signal-layer-r1
