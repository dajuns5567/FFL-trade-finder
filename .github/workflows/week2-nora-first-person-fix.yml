name: Week 2 Nora first-person voice fix

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - .github/workflows/week2-nora-first-person-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
          fetch-depth: 0
      - name: Restore Nora first-person judgment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/inquirer-week2-editorial-r15.mjs')
          s=p.read_text()
          replacements={
            'Those are the division facts; the useful question is which team changes them next.':'I see the division facts clearly; the useful question is which team changes them next.',
            'The table is early, but the leverage attached to the next result is already measurable.':'I treat the table as early, but the leverage attached to the next result is already measurable.',
            'The standings do not settle anything yet; they do make the cost of another mistake easier to see.':'I do not think the standings settle anything yet; they do make the cost of another mistake easier to see.',
            'The division position is real enough to matter without pretending September has finished the argument.':'I would treat the division position as real enough to matter without pretending September has finished the argument.'
          }
          for old,new in replacements.items():
            if s.count(old)!=1:
              raise SystemExit(f'expected one Nora division phrase, found {s.count(old)}: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check netlify/functions/inquirer-week2-editorial-r15.mjs
          node scripts/inquirer-week2-voice-r15-smoke.mjs
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/week2-nora-first-person-fix.yml
          git add netlify/functions/inquirer-week2-editorial-r15.mjs
          git diff --cached --check
          git commit -m "Restore Nora first-person Week 2 voice"
          git push origin HEAD:player-signal-layer-r1
