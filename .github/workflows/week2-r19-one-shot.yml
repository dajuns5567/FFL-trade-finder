name: Week 2 editorial R19 one-shot

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - .github/workflows/week2-r19-one-shot.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
          fetch-depth: 0

      - name: Create R19 article-wide voice layer
        shell: bash
        run: |
          cat > netlify/functions/inquirer-week2-editorial-r19.mjs <<'EOF'
          import {applyWeek2EditorialR16 as applyWeek2EditorialR18} from './inquirer-week2-editorial-r15.mjs';

          export const WEEK2_EDITORIAL_REVISION=19;

          const sentenceParts=s=>String(s||'').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
          const upper=s=>s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';
          const rid=t=>String(t?.inquirer_article?.reporter?.id||'');
          const tm=t=>String(t?.team_name||'This team');
          const opp=t=>String(t?.next_opponent_name||'the next opponent');
          const won=t=>Number(t?.points)>Number(t?.opponent_points);
          const coreKinds=new Set(['lede','players','management','hot-seat','cool-throne','value','sentiment','outlook']);

          function slotFor(kind,index){
            if(kind==='lede')return [1,3].includes(index)?Math.floor(index/2):-1;
            if(kind==='players')return [0,2,4,6,8,10].includes(index)?Math.floor(index/2):-1;
            if(kind==='management')return index<2?index:-1;
            if(kind==='sentiment')return [0,2,4].includes(index)?Math.floor(index/2):-1;
            if(kind==='outlook')return [0,2].includes(index)?Math.floor(index/2):-1;
            if(['hot-seat','cool-throne','value'].includes(kind))return index===0?0:-1;
            return -1;
          }

          function reporterBank(t,id,kind){
            const name=tm(t),next=opp(t),isWin=won(t);
            const banks={
              'walter-mercer':{
                lede:[
                  isWin?name+' won, so the manager gets the result and none of my silence. Winning does not cancel criticism.':name+' lost, and I am not sanding the rough edges off that Sunday. Bad Sundays should feel bad.',
                  name+' has a week of actual football to live with before the next kickoff. I suggest living with all of it.',
                  isWin?'The win belongs to '+name+'. So does every ugly decision hiding underneath it.':'The loss belongs to '+name+'. Nobody needs a motivational speech before admitting that.'
                ],
                players:[
                  name+' can enjoy that player line for a day. September compliments expire fast around here.',
                  'I will give '+name+' the credit it earned here and criticism everywhere else; charity is not a roster strategy.',
                  name+' has enough talent that a weak line deserves criticism, not a weather report.',
                  'A good Sunday earns praise. It does not buy '+name+' a month of immunity from me.',
                  name+' should remember exactly who delivered when the matchup got uncomfortable. That is useful memory, not nostalgia.',
                  'If '+name+' gets this version of the player again, wonderful. If not, Monday will get loud in a hurry.'
                ],
                management:[
                  name+' can call it a lesson only if next week’s lineup looks like somebody learned it.',
                  'I have seen managers survive worse than this. I have also seen them repeat it, which is how the jokes get mean.',
                  'Management around '+name+' had a full week to make the decision. Sunday gets to grade it without mercy.'
                ],
                sentiment:[
                  name+' supporters are entitled to be loud; the roster volunteered for this mood.',
                  'Patience is easier to request than to earn, and '+name+' has fans checking the balance.',
                  name+' fans can smell a bad lineup decision from three states away. Managers should stop acting surprised.'
                ],
                outlook:[
                  'Week 3 can settle this the old-fashioned way: '+name+' either handles '+next+' or spends Monday explaining why it did not.',
                  name+' does not need a speech before '+next+'. It needs the right lineup and enough points.',
                  'I am giving '+name+' exactly one more Sunday before today’s optimism or irritation gets upgraded.'
                ],
                value:[name+' can move in the market all week. I still grade Sundays in points and wins.'],
                'hot-seat':['If '+name+' wants this criticism gone, score enough next week to make me look foolish. I can live with that.'],
                'cool-throne':['Credit where it is due: '+name+' earned a quiet minute. I doubt the quiet lasts.']
              },
              'tess-delaney':{
                lede:[
                  isWin?name+' won and now gets to be insufferable for several business days. I support this limited license.':name+' lost, which means all the cute explanations are competing for second place behind the score.',
                  name+' gave us enough material for admiration, mockery, or both. My favorite Sundays refuse to choose.',
                  isWin?'The result is pretty. '+name+' should enjoy it before management touches anything else.':'The result is ugly. '+name+' can dress it up, but I will still recognize it.'
                ],
                players:[
                  'That part of '+name+'’s Sunday deserves applause. Please enjoy it before the next lineup decision ruins the mood.',
                  'I adore a useful stat line. I adore it more when '+name+' does not immediately waste it.',
                  name+' has enough talent to make a dud look personally insulting. I am choosing to take it that way.',
                  'Praise has been issued to '+name+'. Nobody get comfortable; I have more numbers.',
                  name+' got something worth celebrating here, which is inconvenient for anyone committed to complaining full-time.',
                  'A player doing his job this loudly is beautiful. '+name+' should try the concept again next Sunday.'
                ],
                management:[
                  'Management had seven days to avoid looking silly. '+name+' somehow made the deadline exciting.',
                  name+' can blame chaos if it wants. I prefer blaming the person who clicked the lineup together.',
                  'If management wanted privacy, fantasy football was a terrible hobby to choose.'
                ],
                sentiment:[
                  name+' fans have chosen volume over perspective. At last, a decision I can endorse.',
                  'The '+name+' crowd is either planning a parade or sharpening complaints. Moderation has left the building.',
                  'Supporters around '+name+' have earned the right to be dramatic. The roster keeps paying for the costumes.'
                ],
                outlook:[
                  name+' gets '+next+' next, and I would like the matchup to be every bit as rude as the buildup deserves.',
                  'Week 3 has expectations now. If '+name+' trips over them, I will not be gentle about the landing.',
                  name+' can make all of this look smart against '+next+'. How convenient that football has scheduled a test.'
                ],
                value:[name+' can flirt with the market all week. Sunday remains the jealous part of this relationship.'],
                'hot-seat':[name+' has officially earned the kind of attention managers pretend they do not read. Delicious.'],
                'cool-throne':['Fine, '+name+', enjoy the applause. I am capable of generosity in carefully rationed doses.']
              },
              'mack-hollis':{
                lede:[
                  isWin?name+' won with enough flourish to make subtlety feel unemployed. I respect the commitment.':name+' lost with the confidence of a team that expected the curtain to fall before anyone noticed.',
                  name+' made Sunday loud. Whether that was triumph or public embarrassment is exactly why I kept watching.',
                  isWin?'The win gives '+name+' the stage for a week. Try not to trip over the furniture.':'The loss gives '+name+' one very bright spotlight and nowhere tasteful to stand.'
                ],
                players:[
                  name+' produced a number with entrance music. If it vanishes next week, I reserve the right to boo the encore.',
                  'A stat line this useful deserves a little swagger. '+name+' should resist turning swagger into a hostage situation.',
                  name+' got real production here. The tasteful response is applause; naturally, I prefer louder applause.',
                  'That player gave '+name+' something worth admiring instead of explaining. What a luxurious change of pace.',
                  name+' can put that performance in formalwear if it likes. It still has to survive another Sunday.',
                  'If this is the version '+name+' gets again, the rest of the league may begin developing very ugly feelings.'
                ],
                management:[
                  name+' chose the lineup. The lineup responded by judging management in public.',
                  'A manager can make one ugly choice. Repeating it turns '+name+' into a touring comedy.',
                  'Management wanted drama and '+name+' supplied it at full volume. Everybody involved should own the production.'
                ],
                sentiment:[
                  name+' supporters are reacting with the restraint of people handed free champagne near an open flame.',
                  'The '+name+' crowd has decided emotional excess is a civic duty. I admire the discipline.',
                  name+' fans are not asking for calm. They are asking management to stop giving them material.'
                ],
                outlook:[
                  name+' meets '+next+' with the lights already too bright. Splendid; pressure improves the scenery.',
                  'Week 3 has handed '+name+' an encore. The only rude thing left would be forgetting the performance.',
                  name+' can make the whole room louder against '+next+'. A flop will be equally audible.'
                ],
                value:[name+' has a market number wearing formal clothes. Sunday still gets to decide whether the outfit fits.'],
                'hot-seat':[name+' has reached the portion of the program where management hears every cough from the audience.'],
                'cool-throne':['Give '+name+' the applause while it is warm. Fantasy football has dreadful manners about keeping praise fresh.']
              },
              'nora-voss':{
                lede:[
                  isWin?name+' won. Good. The score also left management a few things it should be embarrassed to repeat.':name+' lost, and the score already made the problem plain. Management can fix it or keep pretending numbers are rude.',
                  name+' has enough real Week 2 information to stop hiding behind first impressions.',
                  isWin?'The win buys '+name+' confidence, not immunity from obvious mistakes.':'The loss gives '+name+' a simple assignment: stop repeating the choices that helped create it.'
                ],
                players:[
                  name+' can stop negotiating with that number. The number already happened.',
                  'Management has enough information to make a better choice next week; repeating the same mistake would be stubbornness.',
                  name+' got the production. Now management has to prove it knows what to do with it.',
                  name+' should reward what worked and stop protecting what did not. There is no mystery in that.',
                  'If '+name+' wants patience, it can buy some with points next Sunday.',
                  'That performance deserves a reaction stronger than a polite nod. '+name+' needed it and got it.'
                ],
                management:[
                  'The manager can call it variance once. Call it twice and '+name+' fans can call it a habit.',
                  name+' does not need another explanation for the lineup. It needs a better lineup.',
                  'Management made the choice. The score made the consequences difficult to ignore.'
                ],
                sentiment:[
                  name+' supporters already know what bothered them. Management should assume they noticed the same Sunday.',
                  'Fans around '+name+' are short on patience because the scoreboard keeps sending them itemized reasons.',
                  name+' supporters can handle bad luck. Repeated bad choices are where the mood gets expensive.'
                ],
                outlook:[
                  name+' gets '+next+' next. The opponent does not care about this week’s explanation.',
                  'Week 3 gives '+name+' a clean chance to make the obvious corrections before they become habits.',
                  name+' can quiet the criticism against '+next+' by doing the revolutionary thing: making the better decisions.'
                ],
                value:[name+' moved in the market. Management should know why before it starts chasing the movement.'],
                'hot-seat':[name+' has reached the point where another bad Sunday will sound less like bad luck and more like a pattern.'],
                'cool-throne':['Credit to '+name+'. Something worked well enough that criticism can take one paragraph off.']
              }
            };
            return banks[id]?.[kind]||[];
          }

          function cleanClinicalR19(t,text){
            const name=tm(t);
            return String(text||'')
              .replace(/Strong production deserves to be stated plainly\./gi,name+' earned the praise. I am done whispering it.')
              .replace(/Now the role has to sustain it\./gi,'Do it again before '+name+' gets comfortable.')
              .replace(/The next question is what underlying player changes caused it\./gi,name+' should know exactly what caused the move before management chases the next one.')
              .replace(/The movement matters; the cause matters more\./gi,'The move has our attention. '+name+' still has to know what created it.')
              .replace(/That is enough movement to track without pretending it settles the roster[’']s quality\./gi,name+' moved enough to get attention; nobody gets to call the roster fixed.')
              .replace(/The expectation is clear; the result will tell us whether it was useful\./gi,'If '+name+' wastes that edge on Sunday, the projection gets mocked and management gets the harder questions.')
              .replace(/That creates a concrete benchmark without pretending the game is settled\./gi,'That gives '+name+' a number everybody can laugh at if Sunday goes sideways.')
              .replace(/That is the standard the actual result will be measured against\./gi,'If '+name+' misses that number badly, the excuses can start immediately.')
              .replace(/The next game should tell us which Week 2 traits are structural and which were matchup noise\./gi,'Week 3 can make this simple for '+name+': repeat what worked and quit feeding what did not.')
              .replace(/The useful question is which parts are likely to happen again\./gi,name+' should care about one thing now: do the useful parts again.')
              .replace(/There is enough information to move beyond first impressions\./gi,name+' has enough information to stop hiding behind first impressions.');
          }

          const CONTRAST_RE=/\b(?:that|this|it)\s+(?:is|was)\s+not\s+([^.!?;,]{1,90})(?:;|,)\s*(?:it|that|this)\s+(?:is|was)\s+([^.!?]+)([.!?])/i;
          function limitContrast(paragraph,state){
            return sentenceParts(paragraph).map(sentence=>{
              if(!CONTRAST_RE.test(sentence))return sentence;
              state.count++;
              if(state.count===1)return sentence;
              return sentence.replace(CONTRAST_RE,(_,a,b,punct)=>'Forget '+String(a).trim()+'. '+upper(String(b).trim())+punct);
            }).join(' ');
          }

          function teamVoiceLine(t,id,kind,index){
            if(!coreKinds.has(kind))return'';
            const slot=slotFor(kind,index);
            if(slot<0)return'';
            const bank=reporterBank(t,id,kind);
            return bank.length?bank[slot%bank.length]:'';
          }

          function reviseTeamR19(t){
            const a=t?.inquirer_article;
            if(!a)return t;
            const id=rid(t),contrast={count:0};
            a.sections=(a.sections||[]).map(sec=>{
              const kind=String(sec?.kind||'');
              const paragraphs=(sec?.paragraphs||[]).map((p,index)=>{
                let x=cleanClinicalR19(t,p);
                x=limitContrast(x,contrast);
                const line=teamVoiceLine(t,id,kind,index);
                if(line&&!x.includes(line))x=(x+' '+line).trim();
                return x;
              }).filter(Boolean);
              return {...sec,paragraphs};
            });
            a.paragraphs=a.sections.flatMap(sec=>(sec?.paragraphs||[]).filter(Boolean));
            a.editorial_revision=WEEK2_EDITORIAL_REVISION;
            a.voice_revision='week2-r19';
            return t;
          }

          function recapContext(text){
            const x=String(text||'');
            if(/\b(?:bench|lineup|start-sit|manager|management)\b/i.test(x))return'management';
            if(/\b(?:value|market|roster-value)\b/i.test(x))return'value';
            if(/\b(?:trade|received|pick)\b/i.test(x))return'trade';
            if(/\b(?:projected|projection|Week 3)\b/i.test(x))return'outlook';
            if(/\b(?:2-0|0-2|standings|record)\b/i.test(x))return'standings';
            return'general';
          }

          function recapBank(id,context){
            const banks={
              'walter-mercer':{
                management:['Bench points are always louder on Monday. Managers pretend otherwise because dignity is cheaper than admitting the mistake.','One bad lineup call is survivable. Making the same one twice is how a manager becomes the league’s weekly entertainment.','I have seen enough benches to know regret scores beautifully after the games are over.'],
                value:['Market value can strut all week. Sunday still charges admission in points.','A rising number is pleasant. It cannot set a lineup or win a matchup.','The market loves optimism; I prefer a roster that earns it twice.'],
                trade:['A trade victory lap before the next kickoff is how managers tempt fate for free.','A good deal is useful. A good deal followed by a bad lineup is still an embarrassing Sunday.','Managers can celebrate the trade after the players finish proving it was worth celebrating.'],
                outlook:['Week 3 will be rude to somebody’s confidence. That is the only projection I trust completely.','A favorite still has to play the game; decimals have never made a tackle.','The next Sunday is where every September theory gets charged rent.'],
                standings:['Two weeks is enough for bragging and nowhere near enough for wisdom. Naturally, the league chose bragging.','The unbeaten teams may enjoy the view. The winless teams have officially lost the right to call everything noise.','September standings are old enough to start arguments and young enough to make several of them look stupid later.'],
                general:['I have watched enough fantasy football to know dignity usually leaves before the first waiver claim.','Every quiet Sunday eventually finds a manager to embarrass. This league remains extremely efficient.','The league has supplied plenty of reasons to complain and just enough reasons to keep watching.']
              },
              'tess-delaney':{
                management:['A bench mistake this obvious does not need sympathy; it needs better taste next Sunday.','Management had all week to avoid the joke and still walked directly into it. Gorgeous commitment.','I support second chances. I support them less when they involve starting the same wrong player again.'],
                value:['The market is flirting again. I approve of the energy and distrust the relationship.','Value moved, everyone gasped, and Sunday remained aggressively unimpressed.','A prettier roster number is lovely. Points remain the accessory that actually matters.'],
                trade:['Every manager wins a trade in the first five minutes. Sunday is such a rude second opinion.','A deal should improve the roster or at least improve the gossip. Anything less is poor hospitality.','The trade celebration may begin immediately after the players provide transportation.'],
                outlook:['A projection this confident is practically begging football to spill a drink on it.','Week 3 has expectations now. I hope somebody trips over them spectacularly.','Favorites are adorable right up until kickoff gives them responsibilities.'],
                standings:['Two weeks has given everyone exactly enough information to become irresponsibly confident. Delicious.','The unbeaten teams may strut and the winless teams may sulk. The 1-1 crowd is pretending ambiguity is a personality.','September has barely begun and several managers are already acting like the trophy knows their address.'],
                general:['The league keeps serving beauty and stupidity on the same plate. I continue to order seconds.','Restraint had an opportunity. The managers rejected it unanimously.','Somebody somewhere is calling this “a long season.” I call it an excellent excuse with terrible timing.']
              },
              'mack-hollis':{
                management:['One lineup mistake can be forgiven. Two starts looking like a touring production.','Management wanted suspense and accidentally cast itself as the villain.','A bench gap this ugly should come with an intermission so the manager can reconsider the plot.'],
                value:['The market put on formalwear for numbers that still have to survive Sunday.','A roster-value swing is financial theater with shoulder pads waiting nearby.','The market may bow. The scoreboard has not agreed to applaud.'],
                trade:['Every trade is a love story until one side checks the next box score.','A manager celebrating a trade early is basically asking Sunday for a dramatic entrance.','The deal can take a bow after the roster stops giving the audience reasons to boo.'],
                outlook:['The projection has entered under a spotlight. Football is already reaching for the dimmer switch.','Week 3 has encore energy: everybody expects more and somebody will forget the lyrics.','A favorite under bright lights is either glamorous or one mistake away from slapstick.'],
                standings:['The standings are young, loud and overdressed. I could not be happier.','A 2-0 team walks differently in September. An 0-2 team checks the exits.','The 1-1 crowd has achieved perfect dramatic tension by accomplishing almost nothing definitive.'],
                general:['This league has once again mistaken restraint for a character flaw. Splendid.','Fantasy football remains theater for people who insist they are simply checking scores.','The week had heroes, disasters and several managers auditioning for both roles.']
              },
              'nora-voss':{
                management:['Management had all week to avoid the lineup mistake. Monday has been assigned to explaining it.','One bad choice can happen. Repeating it gives fans permission to stop calling it an accident.','Bench regret is useful only when the next lineup proves the manager noticed.'],
                value:['The market moved. Nobody on the roster learned to score because of the movement alone.','Value can create options, but management still has to use those options intelligently.','A rising number is useful leverage. It is also a terrible substitute for winning.'],
                trade:['Managers love declaring a trade won early. Sunday enjoys making those declarations expensive.','A trade gets credit when the roster gets better, not when the manager feels clever.','The deal can keep its victory lap until the new roster actually earns one.'],
                outlook:['A projection can create expectations. It cannot rescue a bad lineup after kickoff.','Week 3 gives every manager another chance to make the obvious correction before it becomes a habit.','The favorite gets the advantage on paper and the responsibility everywhere else.'],
                standings:['Two weeks is plenty of time for confidence to become annoying. The league is right on schedule.','The standings are early. The bragging is already fully grown.','At 0-2, patience gets expensive. At 2-0, humility apparently becomes optional.'],
                general:['Several managers have requested patience. The scoreboard has declined to participate.','The league keeps creating obvious problems and then acting surprised when fans notice them.','A manager can blame variance for almost anything once. The second time needs better material.']
              }
            };
            return banks[id]?.[context]||banks[id]?.general||[];
          }

          function reviseOverviewR19(o){
            if(!o)return o;
            o.sections=(o.sections||[]).map(s=>{
              const id=String(s?.reporter?.id||'');
              const paragraphs=(s?.paragraphs||[]).map((p,index)=>{
                let x=String(p||'');
                x=cleanClinicalR19({team_name:'the league'},x);
                if(index%2===0){
                  const bank=recapBank(id,recapContext(x));
                  const line=bank.length?bank[(index/2)%bank.length]:'';
                  if(line&&!x.includes(line))x=(x+' '+line).trim();
                }
                return x;
              }).filter(Boolean);
              return {...s,paragraphs};
            });
            o.editorial_revision=WEEK2_EDITORIAL_REVISION;
            o.voice_revision='week2-r19';
            return o;
          }

          export function applyWeek2EditorialR16(raw){
            const out=applyWeek2EditorialR18(raw);
            if(!out||Number(out.season)!==2026||Number(out.week)!==2)return out;
            out.teams=(out.teams||[]).map(reviseTeamR19);
            out.league_overview=reviseOverviewR19(out.league_overview);
            out.editorial_revision=WEEK2_EDITORIAL_REVISION;
            out.voice_revision='week2-r19';
            return out;
          }

          export const applyWeek2EditorialR19=applyWeek2EditorialR16;
          export const applyWeek2EditorialR15=applyWeek2EditorialR16;
          EOF

      - name: Wire R19 into the serving path and strengthen smoke coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hub=Path('netlify/functions/league-hub.mjs')
          text=hub.read_text()
          old="import {applyWeek2EditorialR16} from './inquirer-week2-editorial-r15.mjs';"
          new="import {applyWeek2EditorialR16} from './inquirer-week2-editorial-r19.mjs';"
          if text.count(old)!=1:
              raise SystemExit(f'expected one Week 2 editorial import, found {text.count(old)}')
          hub.write_text(text.replace(old,new))

          smoke=Path('scripts/inquirer-week2-voice-r15-smoke.mjs')
          s=smoke.read_text()
          old_import="import {applyWeek2EditorialR16,WEEK2_EDITORIAL_REVISION} from '../netlify/functions/inquirer-week2-editorial-r15.mjs';"
          new_import="import {applyWeek2EditorialR16 as applyWeek2EditorialR18} from '../netlify/functions/inquirer-week2-editorial-r15.mjs';\nimport {applyWeek2EditorialR16,WEEK2_EDITORIAL_REVISION} from '../netlify/functions/inquirer-week2-editorial-r19.mjs';"
          if s.count(old_import)!=1:
              raise SystemExit('unexpected Week 2 smoke import shape')
          s=s.replace(old_import,new_import)
          marker="const rawSnapshot=JSON.stringify(rawWeek2);\nconst revised=applyWeek2EditorialR16(rawWeek2);"
          replacement="const rawSnapshot=JSON.stringify(rawWeek2);\nconst r18Baseline=applyWeek2EditorialR18(rawWeek2);\nconst revised=applyWeek2EditorialR16(rawWeek2);"
          if marker not in s:
              raise SystemExit('missing revised baseline marker')
          s=s.replace(marker,replacement)
          s=s.replace("assert.equal(Number(WEEK2_EDITORIAL_REVISION),18);","assert.equal(Number(WEEK2_EDITORIAL_REVISION),19);")
          s=s.replace("assert.equal(Number(revised?.editorial_revision),18);","assert.equal(Number(revised?.editorial_revision),19);")
          s=s.replace("'week2-r18'","'week2-r19'")
          s=s.replace("const rawTeams=new Map((rawWeek2?.teams||[]).map(t=>[String(t.roster_id),t]));\nconst revisedTeams=revised?.teams||[];","const rawTeams=new Map((rawWeek2?.teams||[]).map(t=>[String(t.roster_id),t]));\nconst r18Teams=new Map((r18Baseline?.teams||[]).map(t=>[String(t.roster_id),t]));\nconst revisedTeams=revised?.teams||[];")
          s=s.replace("assert.equal(Number(t?.inquirer_article?.editorial_revision),18,'Article revision missing for '+t.team_name);","assert.equal(Number(t?.inquirer_article?.editorial_revision),19,'Article revision missing for '+t.team_name);")
          insert_after=" assert.deepEqual(stripArticleProse(t.inquirer_article),stripArticleProse(before.inquirer_article),'Article metadata/facts changed outside prose for '+t.team_name);"
          material="""
 const r18Team=r18Teams.get(String(t.roster_id));
 assert(r18Team,'Missing R18 comparison team '+t.roster_id);
 const coreKinds=['lede','players','management','sentiment','outlook'];
 let changedCore=0,changedParagraphs=0;
 for(const kind of coreKinds){
  const oldPs=(r18Team?.inquirer_article?.sections||[]).find(s=>String(s?.kind||'')===kind)?.paragraphs||[];
  const newPs=(t?.inquirer_article?.sections||[]).find(s=>String(s?.kind||'')===kind)?.paragraphs||[];
  if(JSON.stringify(oldPs)!==JSON.stringify(newPs))changedCore++;
  const n=Math.max(oldPs.length,newPs.length);
  for(let i=0;i<n;i++)if(String(oldPs[i]||'')!==String(newPs[i]||''))changedParagraphs++;
 }
 assert.equal(changedCore,coreKinds.length,'R19 must visibly rewrite every core article area for '+t.team_name);
 assert(changedParagraphs>=10,'R19 is still too shallow for '+t.team_name+': only '+changedParagraphs+' changed core paragraphs');"""
          if insert_after not in s:
              raise SystemExit('missing article metadata marker for R19 materiality guard')
          s=s.replace(insert_after,insert_after+material)
          s=s.replace("assert(contrastCount<=2,'The not-X/it-is-Y contrast crutch is still overused for '+t.team_name+': '+contrastCount);","assert(contrastCount<=1,'The not-X/it-is-Y contrast crutch is still overused for '+t.team_name+': '+contrastCount);")
          s=s.replace("assert.equal(Number(overview.editorial_revision),18);","assert.equal(Number(overview.editorial_revision),19);")
          overview_marker="const overviewText=overviewParagraphs.join(' ');"
          overview_material="""
const r18Overview=r18Baseline?.league_overview||{};
for(const id of ['walter-mercer','tess-delaney','mack-hollis','nora-voss']){
 const oldPs=(r18Overview.sections||[]).filter(s=>String(s?.reporter?.id||'')===id).flatMap(s=>s?.paragraphs||[]);
