name: Week 2 R20 one-shot

on:
  push:
    branches:
      - player-signal-layer-r1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch R20 runtime and CI
        run: node scripts/week2-r20-wire-helper.mjs
      - name: Syntax check R20
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r20.mjs
          node --check scripts/inquirer-week2-r20-smoke.mjs
          node --check netlify/functions/league-hub.mjs
      - name: Preserve R19 reporter baseline
        run: node scripts/inquirer-week2-voice-r15-smoke.mjs
      - name: Verify R20 scoring and recap rewrite
        run: node scripts/inquirer-week2-r20-smoke.mjs
      - name: Audit generated R20 edition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import raw from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r20.mjs';
          fs.writeFileSync('/tmp/week2-r20.json',JSON.stringify(applyWeek2EditorialR16(raw),null,2));
          NODE
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-r20.json
      - name: Commit verified R20 and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/inquirer-week2-editorial-r20.mjs netlify/functions/league-hub.mjs .github/workflows/inquirer-editorial-r5-smoke.yml scripts/inquirer-v25-generated-audit.mjs
          git commit -m "Wire Week 2 R20 scoring-aware recap rewrite"
          git rm scripts/week2-r20-wire-helper.mjs .github/workflows/week2-r20-one-shot.yml
          git commit -m "Remove temporary Week 2 R20 helpers"
          git push origin HEAD:player-signal-layer-r1
