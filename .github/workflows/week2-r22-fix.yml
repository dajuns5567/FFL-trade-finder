name: Week 2 R22 one-shot fix

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - '.github/workflows/week2-r22-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply R22 finishing patch
        run: python scripts/tmp-r22-finish-patch.py
      - name: Syntax check R22
        run: node --check netlify/functions/inquirer-week2-editorial-r22.mjs
      - name: Capture R22 smoke
        run: |
          set +e
          node scripts/inquirer-week2-r22-smoke.mjs > /tmp/r22.log 2>&1
          code=$?
          echo "$code" > /tmp/r22.exit
          cat /tmp/r22.log
          exit 0
      - name: Upload R22 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week2-r22-fix-diagnostic
          path: |
            /tmp/r22.log
            /tmp/r22.exit
          retention-days: 2
      - name: Enforce R22 smoke
        run: test "$(cat /tmp/r22.exit)" = "0"
      - name: Commit verified R22 patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/inquirer-week2-editorial-r22.mjs
          git rm scripts/tmp-r22-finish-patch.py
          git commit -m 'Finish Week 2 R22 repetition and tag cleanup'
          git push origin HEAD:player-signal-layer-r1