name: Week 2 R22 one-shot fix

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - '.github/workflows/week2-r22-fix.yml'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Apply generic R22 finishing fixes and runtime wiring
        run: |
          python scripts/tmp-r22-plural-grammar.py
          python scripts/tmp-r22-cool-throne.py
          python scripts/tmp-r22-wire.py
      - name: Syntax check permanent R22 wiring
        run: |
          node --check netlify/functions/league-hub.mjs
          node --check netlify/functions/inquirer-week2-editorial-r22.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
      - name: Preserve prior Week 2 regressions
        run: |
          node scripts/inquirer-week2-r20-smoke.mjs
          node scripts/inquirer-week2-r21-smoke.mjs
      - name: Run all-32 R22 repetition, humor, and tag regression
        run: node scripts/inquirer-week2-r22-smoke.mjs
      - name: Materialize R22 candidate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import rawWeek2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r22.mjs';
          const week2=applyWeek2EditorialR16(rawWeek2);
          if(!week2?.published_locked||Number(week2?.season)!==2026||Number(week2?.week)!==2||Number(week2?.editorial_revision)!==22||week2?.voice_revision!=='week2-r22')throw new Error('Week 2 revision 22 did not materialize from the locked preload');
          fs.writeFileSync('/tmp/week2-inquirer-r22.json',JSON.stringify(week2,null,2)+'\n');
          NODE
      - name: Capture full generated R22 audit
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r22.json > /tmp/week2-r22-generated-audit.log 2>&1
          code=$?
          echo "$code" > /tmp/week2-r22-generated-audit.exit
          cat /tmp/week2-r22-generated-audit.log
          exit 0
      - name: Upload R22 generated diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week2-r22-generated-diagnostic
          path: |
            /tmp/week2-inquirer-r22.json
            /tmp/week2-r22-generated-audit.log
            /tmp/week2-r22-generated-audit.exit
          retention-days: 2
      - name: Enforce full generated R22 audit
        run: test "$(cat /tmp/week2-r22-generated-audit.exit)" = "0"
      - name: Commit verified R22 runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/inquirer-week2-editorial-r22.mjs netlify/functions/league-hub.mjs scripts/inquirer-v25-generated-audit.mjs
          git rm -f scripts/tmp-r22-plural-grammar.py scripts/tmp-r22-cool-throne.py scripts/tmp-r22-wire.py scripts/r22-fix-patch.mjs
          git commit -m 'Wire verified Week 2 R22 editorial layer'
          git push origin HEAD:player-signal-layer-r1