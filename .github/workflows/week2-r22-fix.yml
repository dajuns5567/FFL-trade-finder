name: Week 2 R22 one-shot fix

on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - '.github/workflows/week2-r22-fix.yml'
      - 'netlify/functions/inquirer-week2-editorial-r22.mjs'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-signal-layer-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch R22 commentary quality
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/functions/inquirer-week2-editorial-r22.mjs')
          s=p.read_text()
          anchor="if(/That difference is large enough to track directly into Week 3/i.test(x))return'One lousy Sunday below the established baseline is worth watching. If the role stays intact, the usage matters more than the gap itself.';"
          extra="if(/excessive enough to be enjoyable and useful enough to avoid becoming nonsense/i.test(x))return'The expanded role is the part worth watching; management now has a reason to keep the opportunity intact.';"
          if extra not in s:
              if anchor not in s:
                  raise SystemExit('weightless-humor patch anchor missing')
              s=s.replace(anchor,anchor+'\n '+extra,1)
          s=s.replace("`The result is real. I still want ${n} management to explain the avoidable parts before the record starts hiding them.`","`The result is real. I want ${n} management to explain the avoidable parts before the record starts hiding them.`")
          s=s.replace("`Take the result. Keep the excuses in storage; ${n} has enough football on tape to know what needs fixing.`","`Take the result. I refuse to let the record hide the avoidable football; ${n} has enough tape to know what needs fixing.`")
          s=s.replace("`${n} has a result and a process to judge separately. Keep the parts that worked and fix the avoidable mistake.`","`${n} has a result and a process to judge separately. I want the avoidable mistake fixed before the next Sunday.`")
          s=s.replace("`The record is one fact. ${n} management still has to explain the decisions that created the performance.`","`The record is one fact. I refuse to let it excuse ${n} management’s avoidable decisions.`")
          old="const list=banks[id]?.[kind]||banks[id]?.players||banks['walter-mercer'].players;\n return choose(list,`${n}|${kind}|${slot}`);"
          new="const list=banks[id]?.[kind]||banks[id]?.players||banks['walter-mercer'].players;\n const line=choose(list,`${n}|${kind}|${slot}`);\n if(STYLE_MARK.test(line))return line;\n const lead={'walter-mercer':'I want this clear:','tess-delaney':'I am enjoying the drama, but the football still has to make sense:','mack-hollis':'The audience is allowed to boo when the football deserves it:','nora-voss':'I refuse the easy explanation:'}[id]||'I want this clear:';\n return `${lead} ${line}`;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('meaningfulLine return anchor missing')
          p.write_text(s)
          PY
      - name: Install generator dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Capture R22 smoke
        run: |
          set +e
          node scripts/inquirer-week2-r22-smoke.mjs > /tmp/r22.log 2>&1
          code=$?
          echo "$code" > /tmp/r22.exit
          cat /tmp/r22.log
          exit 0
      - name: Upload R22 diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week2-r22-fix-diagnostic
          path: |
            /tmp/r22.log
            /tmp/r22.exit
          retention-days: 2
      - name: Enforce R22 smoke
        run: test "$(cat /tmp/r22.exit)" = "0"
      - name: Commit verified R22 patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/inquirer-week2-editorial-r22.mjs
          git commit -m 'Fix Week 2 R22 commentary weight'
          git push origin HEAD:player-signal-layer-r1
