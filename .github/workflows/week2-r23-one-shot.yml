name: Week 2 R23 one-shot
on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - 'netlify/functions/inquirer-week2-editorial-r23.mjs'
      - 'scripts/inquirer-week2-r23-smoke.mjs'
      - '.github/workflows/week2-r23-one-shot.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run R23 regression smoke
        id: smoke
        shell: bash
        run: |
          set +e
          node scripts/inquirer-week2-r23-smoke.mjs > r23-smoke.log 2>&1
          code=$?
          cat r23-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload R23 smoke log
        uses: actions/upload-artifact@v4
        with:
          name: week2-r23-smoke-log
          path: r23-smoke.log
      - name: Enforce R23 smoke result
        shell: bash
        run: exit "${{ steps.smoke.outputs.exit_code }}"
