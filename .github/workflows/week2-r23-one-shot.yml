name: Week 2 R23 one-shot
on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - 'netlify/functions/inquirer-week2-editorial-r23.mjs'
      - 'netlify/functions/inquirer-week2-editorial-r24.mjs'
      - 'scripts/inquirer-week2-r23-smoke.mjs'
      - '.github/workflows/week2-r23-one-shot.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct verifier false-positive
        run: node -e "const fs=require('fs');const p='scripts/inquirer-week2-r23-smoke.mjs';let s=fs.readFileSync(p,'utf8');s=s.replace('|\\\\bi respect\\\\b','');fs.writeFileSync(p,s)"
      - name: Run R24 regression smoke
        id: smoke
        shell: bash
        run: |
          set +e
          node scripts/inquirer-week2-r23-smoke.mjs > r23-smoke.log 2>&1
          code=$?
          cat r23-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload R24 smoke log
        uses: actions/upload-artifact@v4
        with:
          name: week2-r24-smoke-log
          path: r23-smoke.log
      - name: Enforce R24 smoke result
        shell: bash
        run: exit "${{ steps.smoke.outputs.exit_code }}"
