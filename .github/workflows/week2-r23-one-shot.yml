name: Week 2 R27 integration one-shot
on:
  push:
    branches: [player-signal-layer-r1]
    paths:
      - 'netlify/functions/inquirer-week2-editorial-r23.mjs'
      - 'netlify/functions/inquirer-week2-editorial-r24.mjs'
      - 'netlify/functions/inquirer-week2-editorial-r25.mjs'
      - 'netlify/functions/inquirer-week2-editorial-r26.mjs'
      - 'netlify/functions/inquirer-week2-editorial-r27.mjs'
      - 'scripts/inquirer-week2-r23-smoke.mjs'
      - 'scripts/week2-r27-integration-patch.mjs'
      - '.github/workflows/week2-r23-one-shot.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependency
        run: npm install --no-save --package-lock=false @netlify/blobs
      - name: Stage R27 runtime wiring
        run: node scripts/week2-r27-integration-patch.mjs
      - name: Syntax check R27 runtime
        run: |
          node --check netlify/functions/inquirer-week2-editorial-r27.mjs
          node --check netlify/functions/league-hub.mjs
          node --check scripts/inquirer-v25-generated-audit.mjs
          node --check scripts/inquirer-week2-r23-smoke.mjs
      - name: Preserve R20 scoring and recap regression
        run: node scripts/inquirer-week2-r20-smoke.mjs
      - name: Preserve R21 all-team editorial regression
        run: node scripts/inquirer-week2-r21-smoke.mjs
      - name: Preserve R22 repetition humor and tag regression
        run: node scripts/inquirer-week2-r22-smoke.mjs
      - name: Run R27 all-32 regression
        run: node scripts/inquirer-week2-r23-smoke.mjs
      - name: Materialize R27 Week 2 edition
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import rawWeek2 from './netlify/functions/inquirer-week2-2026-preload.mjs';
          import {applyWeek2EditorialR16} from './netlify/functions/inquirer-week2-editorial-r27.mjs';
          const week2=applyWeek2EditorialR16(rawWeek2);
          if(!week2?.published_locked||Number(week2?.season)!==2026||Number(week2?.week)!==2||Number(week2?.editorial_revision)!==27||week2?.voice_revision!=='week2-r27')throw new Error('Week 2 revision 27 did not materialize from the locked preload');
          fs.writeFileSync('/tmp/week2-inquirer-r27.json',JSON.stringify(week2,null,2)+'\n');
          NODE
      - name: Run full generated Week 2 audit
        id: generated
        shell: bash
        run: |
          set +e
          node scripts/inquirer-v25-generated-audit.mjs /tmp/week2-inquirer-r27.json > /tmp/week2-r27-generated-audit.log 2>&1
          code=$?
          cat /tmp/week2-r27-generated-audit.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload R27 integration diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: week2-r27-integration-diagnostic
          path: |
            /tmp/week2-inquirer-r27.json
            /tmp/week2-r27-generated-audit.log
          retention-days: 2
      - name: Enforce full generated Week 2 audit
        run: exit "${{ steps.generated.outputs.exit_code }}"
      - name: Commit verified normal-file wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add netlify/functions/league-hub.mjs scripts/inquirer-v25-generated-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Wire Week 2 editorial R27"
          git push
