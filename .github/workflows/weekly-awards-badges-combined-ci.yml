name: Combined weekly badges preview acceptance
on:
  pull_request:
    paths:
      - 'netlify/functions/league-hub.mjs'
      - 'netlify/functions/value-history.mjs'
      - 'netlify/functions/lib/player-weekly-milestone-awards.mjs'
      - 'netlify/functions/weekly-awards-refresh.mjs'
      - 'value-history-v276.js'
      - 'league-hub-v451.js'
      - 'netlify/functions/site-v29.mjs'
      - 'tests/weekly-awards-badges-combined-contract.test.mjs'
      - 'scripts/audit-combined-weekly-badge-provenance.mjs'
      - 'scripts/approved-market-intelligence-overlay.mjs'
      - 'scripts/approved-market-period-browser-overlay.mjs'
      - 'scripts/approved-market-period-server-overlay.mjs'
      - 'scripts/approved-awards-browser-overlay.mjs'
      - 'scripts/approved-awards-server-overlay.mjs'
      - 'scripts/approved-managers-browser-overlay.mjs'
      - 'scripts/approved-managers-server-overlay.mjs'
      - 'scripts/approved-hub-refresh-overlay.mjs'
      - 'scripts/approved-inquirer-browser-overlay.mjs'
      - 'scripts/approved-inquirer-server-overlay.mjs'
      - 'tests/audit-combined-weekly-badge-provenance.test.mjs'
      - 'tests/player-weekly-milestone-awards.test.mjs'
      - 'tests/player-weekly-badge-completion-readback.test.mjs'
      - 'tests/weekly-awards-scheduled-capture.test.mjs'
      - 'tests/league-awards-independent-week-sync.test.mjs'
      - 'tests/inquirer-approved-cutover.test.mjs'
      - 'tests/inquirer-weekly-publication-consistency.test.mjs'
      - '.github/workflows/weekly-awards-badges-combined-ci.yml'
  push:
    branches:
      - integration/weekly-awards-badges-preview-20261122
permissions:
  contents: read
jobs:
  verified-badges-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing source dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Fetch independently tested weekly badge PR source heads (read-only)
        run: |
          for pr in 579 580; do
            git fetch --no-tags origin "+refs/pull/$pr/head:refs/remotes/pr-badge-source/$pr"
          done
      - name: Verify combined sources match previously validated badge and awards implementations
        run: |
          node --check scripts/audit-combined-weekly-badge-provenance.mjs
          node --check scripts/approved-market-intelligence-overlay.mjs
          node --check scripts/approved-market-period-browser-overlay.mjs
          node --check scripts/approved-market-period-server-overlay.mjs
          node --check scripts/approved-awards-browser-overlay.mjs
          node --check scripts/approved-awards-server-overlay.mjs
          node --check scripts/approved-managers-browser-overlay.mjs
          node --check scripts/approved-managers-server-overlay.mjs
          node --check scripts/approved-hub-refresh-overlay.mjs
          node --check scripts/approved-inquirer-browser-overlay.mjs
          node --check scripts/approved-inquirer-server-overlay.mjs
          node --test tests/audit-combined-weekly-badge-provenance.test.mjs
          node scripts/audit-combined-weekly-badge-provenance.mjs
      - name: Check combined runtime syntax and asset loader
        run: |
          node --check netlify/functions/league-hub.mjs
          node --check netlify/functions/value-history.mjs
          node --check netlify/functions/weekly-awards-refresh.mjs
          node --check netlify/functions/site-v29.mjs
          node --check value-history-v276.js
          node --check league-hub-v451.js
      - name: Verify weekly-awards publication and Player Value History badges together
        run: |
          node --test tests/league-awards-independent-week-sync.test.mjs tests/weekly-awards-scheduled-capture.test.mjs tests/league-week-independent-news.test.mjs
          node --test tests/player-weekly-milestone-awards.test.mjs tests/player-weekly-badge-completion-readback.test.mjs
          node --test tests/weekly-awards-badges-combined-contract.test.mjs
      - name: Preserve Value History, trade readback, and loader regression tests
        run: |
          node --test tests/presentation-copy-cleanup-v539.test.mjs
          node --test tests/team-net-choice-v540.test.mjs
          node --test tests/trade-history-live-sleeper.test.mjs
          node --test tests/inquirer-week9-unattended-publish-regression.test.mjs
          node --test tests/inquirer-approved-cutover.test.mjs tests/inquirer-weekly-publication-consistency.test.mjs
