
[build]
  publish = "."
  functions = "netlify/functions"
  # Handoff review #501 is intentionally isolated from old accounts and production.
  # The new Netlify site must explicitly opt in using its own SITE_ID; it must
  # NOT be the currently published site's ID. No production/branch deploy builds.
  # Netlify: ignore command exits 1 to build, 0 to skip.
  ignore = "node -e \"const e=process.env;const newSite=String(e.FLEECED_NEXT_NETLIFY_PREVIEW_SITE_ID||'').trim();const site=String(e.SITE_ID||'').trim();const allowed=!!newSite&&!!site&&newSite===site&&!['fa33dfe4-8293-441e-8da0-25cc66fc984c','3b9ae5bd-0d0f-4570-b2b7-89afae8a0e5f','8776d155-bc7b-4dcd-bafc-3d70d3d51800'].includes(site);const preview=e.CONTEXT==='deploy-preview'&&String(e.REVIEW_ID)==='501';process.exit(allowed&&preview?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
