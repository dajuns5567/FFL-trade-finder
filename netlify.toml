
[build]
  publish = "."
  functions = "netlify/functions"
  # One-time user-authorized release for the current Netlify site only.
  # Gate ONLY the original V101 and owner-authorized Inquirer V110 cutover subjects;
  # every unrelated future main commit stays skipped; allow the exact owner-
  # authorized V110 hostname correction and one verified Inquirer-only
  # Week 9 reader correction and one owner-authorized GitHub-native reader
  # cutover and the separate League Hub completed-week release; ordinary
  # future main commits never auto-deploy.
  # Allow only explicitly approved Inquirer PR previews on current V101 site.
  # Keep old authorized PR previews; block all other production builds.
  # Netlify: exit 1 builds, exit 0 skips.
  ignore = "node -e \"const e=process.env;const old=e.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||e.SITE_NAME==='precious-dango-fb4633';const oldPreview=old&&e.CONTEXT==='deploy-preview'&&['448','450'].includes(String(e.REVIEW_ID));const currentPreview=e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2'&&e.CONTEXT==='deploy-preview'&&['563','564','565','566','567','568','570','572','573','574','580','589','590','591','592','593','594','595','596','597','598','599','600','601','602','603','604'].includes(String(e.REVIEW_ID));let oneTime=false;if(e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2'&&e.CONTEXT==='production'&&e.BRANCH==='main'){try{oneTime=['Release FFL V101 site deploy once 2026-11-20','Release FFL Inquirer V110 original-history cutover 2026-11-21','Release FFL Inquirer V110 canonical scheduled host fix 2026-11-21','Release FFL Inquirer Week9 attributed reader correction 2026-11-21','Release FFL Inquirer GitHub-native reader cutover 2026-11-22','Release FFL League Hub completed-week cutover 2026-11-22'].includes(require('node:child_process').execFileSync('git',['log','-1','--format=%s'],{encoding:'utf8'}).trim())}catch{}};process.exit(oldPreview||currentPreview||oneTime?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

# Inquirer publication is run by GitHub Actions and committed directly to
# the inquirer-archive Git branch. This legacy Netlify function is deliberately
# NOT scheduled; it remains in source only for backward compatibility.
# Netlify Deploy Previews and production sites do not run the publisher.

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
