
[build]
  publish = "."
  functions = "netlify/functions"
  # TEST-ONLY INTEGRATION: enable Deploy Preview exclusively for PR #447 on
  # the canonical current site. NEVER build production, branch deploys or
  # previews from other branches/accounts. No change to main configuration.
  # Ignore exit 1 builds, exit 0 skips.
  ignore = "node -e \"const e=process.env;const site=e.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||e.SITE_NAME==='precious-dango-fb4633';const preview=e.CONTEXT==='deploy-preview'&&String(e.REVIEW_ID)==='447';process.exit(site&&preview?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
