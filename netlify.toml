
[build]
  publish = "."
  functions = "netlify/functions"
  # Explicitly allow PR #501 Deploy Preview only on the new account.
  # A new account does not initially have the custom build environment
  # variables available; use its verified site ID as the authorization.
  # Production and branch deploys always skip. Netlify builds on exit 1.
  ignore = "node -e \"const e=process.env;const allowed=e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2';const preview=e.CONTEXT==='deploy-preview'&&String(e.REVIEW_ID)==='501';process.exit(allowed&&preview?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
