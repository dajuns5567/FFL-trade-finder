
[build]
  publish = "."
  functions = "netlify/functions"
  # ONE-TIME REVIEW PREVIEW ONLY. No production/branch builds on any site.
  # Fail-closed until the exact draft PR number is installed below.
  # Netlify ignore command: exit 1 permits only an explicitly pinned Deploy Preview.
  ignore = "node -e \"const e=process.env;const site=e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2';const review=e.CONTEXT==='deploy-preview'&&String(e.REVIEW_ID)==='PIN_REVIEW_PR';process.exit(site&&review?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

# Preview-only: do not register the Inquirer scheduled publisher.
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
