
[build]
  publish = "."
  functions = "netlify/functions"
  # Production deploys and branch deploys are disabled by owner instruction.
  # Only explicitly authorized PR #499, PR #505, PR #507, PR #508, PR #509, PR #510, PR #511 and V107 PR #513 and V108 visual review PR #515 previews may build on this canonical site;
  # skip other sites and unrelated previews to conserve Netlify credits.
  # Draft PR previews target main for preview discovery; production and branch builds remain blocked.
  # V108 preview validation only: PR #515's final Value History / Market Dashboard UI review.
  # PR #513 one-time preview validation: no production or branch deployment enabled.
  # Ignore exit 1 builds, exit 0 skips.
  ignore = "node -e \"const e=process.env;const site=e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2';const preview=e.CONTEXT==='deploy-preview'&&(String(e.REVIEW_ID)==='499'||String(e.REVIEW_ID)==='505'||String(e.REVIEW_ID)==='507'||String(e.REVIEW_ID)==='508'||String(e.REVIEW_ID)==='509'||String(e.REVIEW_ID)==='510'||String(e.REVIEW_ID)==='511'||String(e.REVIEW_ID)==='513'||String(e.REVIEW_ID)==='515');process.exit(site&&preview?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
