
[build]
  publish = "."
  functions = "netlify/functions"
  # PR #443 private validation ONLY: build one Deploy Preview on the canonical
  # site; skip all production and every other deploy context on this branch.
  # This remains isolated in the unmerged draft PR, never in production main.
  # Ignore command exit 1 = build; exit 0 = skip.
  ignore = "node -e \"const site=process.env.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||process.env.SITE_NAME==='precious-dango-fb4633';const preview=process.env.CONTEXT==='deploy-preview'&&String(process.env.REVIEW_ID)==='443';process.exit(site&&preview?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
