
[build]
  publish = "."
  functions = "netlify/functions"
  # Only the current Netlify project may consume build/deploy credits.
  # Other historical Git-linked copies exit 0 and skip before the build.
  # Exit 1 on the active project means Netlify continues its normal build.
  ignore = "node -e \"process.exit(process.env.SITE_NAME === 'brilliant-faun-c5b649' ? 1 : 0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  schedule = "0 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
