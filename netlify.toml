
[build]
  publish = "."
  functions = "netlify/functions"
  # Build only the owner's NEW Netlify account. The previous published
  # project remains a read-only historical source and no longer builds.
  # Netlify ignore-command exit 0 skips; exit 1 builds.
  # Preserve the current production cutover behavior. Also permit exactly
  # this Trade History PR's Deploy Preview on the canonical site for testing.
  # All other preview/branch builds remain skipped to minimize build credits.
  ignore = "node -e \"const site=process.env.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||process.env.SITE_NAME==='precious-dango-fb4633';const production=process.env.CONTEXT==='production';const tradePreview=process.env.CONTEXT==='deploy-preview'&&process.env.BRANCH==='fix/trade-history-live-sleeper-2026';process.exit(site&&(production||tradePreview)?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
