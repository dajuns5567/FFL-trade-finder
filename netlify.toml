
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-native-scheduled"]
  schedule = "0 * * * *"

[functions."inquirer-projection-capture-native-scheduled"]
  schedule = "5 * * * *"

[functions."value-history-capture-background"]
  included_files = ["*.js", "*.css", "data/*.js", "index.html", "netlify/functions/*.mjs", "scripts/value-history-headless-refresh.mjs", "!.tmp/**", "!.git/**"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true

# Safe baseline response hardening. Strict CSP requires a separate compatibility
# audit because the app currently uses legitimate inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
