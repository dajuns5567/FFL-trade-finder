
[build]
  publish = "."
  functions = "netlify/functions"
  # Allow the existing and replacement Netlify sites to build PR previews during migration.
  # Netlify ignore-command exit 0 skips, exit 1 continues normally; disable old publisher before cutover.
  ignore = "node -e \"process.exit(['brilliant-faun-c5b649','transcendent-manatee-2f0123'].includes(process.env.SITE_NAME) ? 1 : 0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every two hours; the function skips previously published/held weeks.
  # Actual publication still waits for final Sleeper roster records.
  schedule = "0 */2 * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
