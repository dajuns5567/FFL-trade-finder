
[build]
  publish = "."
  functions = "netlify/functions"
  # Build only the owner's NEW Netlify account. The previous published
  # project remains a read-only historical source and no longer builds.
  # Netlify ignore-command exit 0 skips; exit 1 builds.
  # Keep production behavior unchanged; enable this one PR preview on the
  # canonical site only. Accept the Netlify deploy URL as site identity in
  # case SITE_ID/SITE_NAME are not present during the ignore-command phase.
  # exit 1 = build; exit 0 = skip. No other previews are authorized.
  ignore = "node -e \"const e=process.env;const site=e.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||e.SITE_NAME==='precious-dango-fb4633'||[e.DEPLOY_PRIME_URL,e.DEPLOY_URL,e.URL].some(v=>String(v||'').includes('precious-dango-fb4633.netlify.app'));const preview=e.CONTEXT==='deploy-preview'&&(e.REVIEW_ID==='439'||e.BRANCH==='fix/trade-history-live-sleeper-2026'||String(e.DEPLOY_PRIME_URL||'').includes('deploy-preview-439--'));process.exit(site&&(e.CONTEXT==='production'||preview)?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
