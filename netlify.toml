
[build]
  publish = "."
  functions = "netlify/functions"
  # One-time user-authorized release for the current Netlify site only.
  # Gate the exact Git commit subject so later main pushes remain skipped.
  # Allow only explicitly approved Inquirer PR previews on current V101 site.
  # Keep old authorized PR previews; block all other production builds.
  # Netlify: exit 1 builds, exit 0 skips.
  ignore = "node -e \"const e=process.env;const old=e.SITE_ID==='fa33dfe4-8293-441e-8da0-25cc66fc984c'||e.SITE_NAME==='precious-dango-fb4633';const oldPreview=old&&e.CONTEXT==='deploy-preview'&&['448','450'].includes(String(e.REVIEW_ID));const currentPreview=e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2'&&e.CONTEXT==='deploy-preview'&&['563','564','565','566'].includes(String(e.REVIEW_ID));let oneTime=false;if(e.SITE_ID==='a516be3b-6c65-4f54-a9fb-23c5361bf3d2'&&e.CONTEXT==='production'&&e.BRANCH==='main'){try{oneTime=require('node:child_process').execFileSync('git',['log','-1','--format=%s'],{encoding:'utf8'}).trim()===\\\"Release FFL V101 site deploy once 2026-11-20\\\"}catch{}};process.exit(oldPreview||currentPreview||oneTime?1:0)\""

[functions]
  node_bundler = "esbuild"
  included_files = ["index.html", "trade-section1-core-v100.js", "trade-section1-v100.css", "trade-section1-v106.css"]

[functions."inquirer-publish-scheduled"]
  # Poll every five minutes so a multiweek backlog catches up one verified
  # week per background job. The scheduler suppresses active/held/completed
  # work; publication still requires finalized Sleeper roster records.
  schedule = "*/5 * * * *"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/sleeper-data/*"
  to = "https://raw.githubusercontent.com/dajuns5567/FFL-trade-finder/sleeper-data/data/sleeper/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/site-v29"
  status = 200
  force = true

[[redirects]]
  from = "/api/update"
  to = "/.netlify/functions/update"
  status = 200
  force = true

[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true
