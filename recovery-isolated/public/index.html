<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FLEECED! Isolated Recovery Acceptance</title><style>body{font:16px system-ui;max-width:760px;margin:4rem auto;padding:1rem;line-height:1.6;background:#131923;color:#f4f6fb}pre{white-space:pre-wrap;background:#243044;padding:1.5rem;border-radius:12px}a{color:#9dc9ff}</style></head><body><h1>FLEECED! Recovery Acceptance</h1><p>Read-only recovery status from independently restored historical and Inquirer Blob stores. This is not the production application. No publishers, schedules, or user actions are enabled.</p><pre id="status">Checking isolated recovery API…</pre><script>fetch('/api/recovery',{cache:'no-store'}).then(async r=>{const data=await r.json();if(!r.ok)throw Error(JSON.stringify(data));document.getElementById('status').textContent=JSON.stringify(data,null,2)}).catch(e=>{document.getElementById('status').textContent='Recovery API failed: '+e.message})</script></body></html>
